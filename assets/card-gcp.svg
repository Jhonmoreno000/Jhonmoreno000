<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 145" width="100%" height="145">
  <defs>
    <linearGradient id="gcpCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="60%" stop-color="#080d1a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
  </defs>

  <!-- Base Card -->
  <rect width="850" height="145" rx="10" fill="url(#gcpCardBg)"/>
  <rect x="0.5" y="0.5" width="849" height="144" rx="9.5" fill="none" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Left Accent Glow Bar -->
  <line x1="2" y1="20" x2="2" y2="125" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Category & Live Status -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" letter-spacing="1">
    <text x="32" y="28" fill="#c084fc">REPOSITORY // 03 · ENTERPRISE PRODUCT PLATFORM</text>
    <text x="818" y="28" text-anchor="end" fill="#c084fc">LAYERED ARCHITECTURE</text>
    <circle cx="654" cy="25" r="3" fill="#c084fc"/>
  </g>

  <!-- Title -->
  <text x="32" y="58" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="20" 
        font-weight="700" 
        fill="#f8fafc" 
        letter-spacing="-0.3">
    GCP-GESTION-DE-PRODUCTOS-
  </text>

  <!-- Technical Description -->
  <text x="32" y="82" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="13" 
        fill="#94a3b8">
    Sistema corporativo de gestion, catalogo y control transaccional de productos desarrollado en C# (.NET Core).
  </text>
  <text x="32" y="100" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="13" 
        fill="#94a3b8">
    Implementacion de arquitectura en capas desacopladas, validacion de dominio y persistencia relacional transaccional.
  </text>

  <!-- Tech Pills Bar & CTA -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10">
    <!-- Pill 1 -->
    <rect x="32" y="114" width="55" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="59" y="128" fill="#cbd5e1" text-anchor="middle">C#</text>
    
    <!-- Pill 2 -->
    <rect x="95" y="114" width="76" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="133" y="128" fill="#cbd5e1" text-anchor="middle">.NET Core</text>
    
    <!-- Pill 3 -->
    <rect x="179" y="114" width="88" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="223" y="128" fill="#cbd5e1" text-anchor="middle">Layered Arch</text>
    
    <!-- Pill 4 -->
    <rect x="275" y="114" width="102" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="326" y="128" fill="#c084fc" text-anchor="middle">SQL Relational</text>

    <!-- Pill 5 -->
    <rect x="385" y="114" width="80" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="425" y="128" fill="#cbd5e1" text-anchor="middle">Clean CRUD</text>

    <!-- CTA Button on Right -->
    <rect x="700" y="114" width="118" height="20" rx="4" fill="#7c3aed" fill-opacity="0.2" stroke="#c084fc" stroke-width="1"/>
    <text x="759" y="128" fill="#c084fc" text-anchor="middle" font-weight="700">EXPLORE REPO &gt;</text>
  </g>
</svg>
