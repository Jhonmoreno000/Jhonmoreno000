<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 220" width="100%" height="220">
  <defs>
    <linearGradient id="bgGc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080c"/>
      <stop offset="100%" stop-color="#19080f"/>
    </linearGradient>
    <pattern id="dotsGc" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#ff2a5f" fill-opacity="0.14"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @keyframes railGc { to { stroke-dashoffset: -26; } }
      @keyframes floatGc { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
      .rail { stroke-dasharray: 8 5; animation: railGc 1.6s linear infinite; }
      .float3d { animation: floatGc 3.4s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="490" height="220" rx="6" fill="#030508"/>
  <path d="M 22,6 L 160,6 L 170,13 L 360,13 L 370,6 L 474,6 L 484,16 L 484,204 L 472,214 L 18,214 L 6,202 L 6,22 Z"
        fill="url(#bgGc)" stroke="#1e293b" stroke-width="1.5"/>
  <path d="M 22,6 L 160,6 L 170,13 L 360,13 L 370,6 L 474,6 L 484,16 L 484,204 L 472,214 L 18,214 L 6,202 L 6,22 Z"
        fill="url(#dotsGc)"/>
  <path d="M 22,6 L 160,6 L 170,13 L 360,13 L 370,6 L 474,6 L 484,16 L 484,204 L 472,214 L 18,214 L 6,202 L 6,22 Z"
        fill="none" stroke="#ff2a5f" stroke-width="1.4" stroke-opacity="0.7" class="rail"/>

  <rect x="24" y="5" width="90" height="3" fill="#ff2a5f"/>
  <text x="24" y="28" class="mono" font-size="9" font-weight="800" fill="#ff2a5f" letter-spacing="2">SYS_05 // .NET 10 ENGINE</text>

  <text x="25.5" y="53.5" class="mono" font-size="20" font-weight="900" fill="#ff2a5f" fill-opacity="0.35" letter-spacing="2">GCP POS .NET 10</text>
  <text x="24" y="52" class="mono" font-size="20" font-weight="900" fill="#f8fafc" letter-spacing="2">GCP POS .NET 10</text>
  <text x="224" y="51" class="mono" font-size="10" font-weight="700" fill="#00e5ff" letter-spacing="1">// GDI+ 60FPS</text>

  <g class="sans" font-size="11.2" fill="#94a3b8">
    <text x="24" y="78">Sistema nativo de punto de venta e inventario en C# 12</text>
    <text x="24" y="96">y .NET 10 con renderizado vectorial GDI+ a 60 FPS,</text>
    <text x="24" y="114">telemetria en vivo y alertas automaticas de stock.</text>
  </g>

  <!-- 3D ISOMETRIC SCULPTURE: 3D RISING TELEMETRY COLUMNS -->
  <g transform="translate(418, 88)">
    <polygon points="0,8 44,26 0,44 -44,26" fill="#0a0407" stroke="#ff2a5f" stroke-opacity="0.45" stroke-width="1"/>
    <g class="float3d">
      <!-- Column 1 (Left, Cyan) -->
      <polygon points="-26,-4 -18,-8 -10,-4 -18,0" fill="#00e5ff"/>
      <polygon points="-26,-4 -18,0 -18,22 -26,18" fill="#084c61"/>
      <polygon points="-18,0 -10,-4 -10,18 -18,22" fill="#052f3d"/>
      <!-- Column 2 (Center, Emerald) -->
      <polygon points="-8,-18 0,-22 8,-18 0,-14" fill="#00ff66"/>
      <polygon points="-8,-18 0,-14 0,24 -8,20" fill="#05603a"/>
      <polygon points="0,-14 8,-18 8,20 0,24" fill="#033b24"/>
      <!-- Column 3 (Right, Crimson Tall) -->
      <polygon points="10,-32 18,-36 26,-32 18,-28" fill="#ff2a5f"/>
      <polygon points="10,-32 18,-28 18,22 10,18" fill="#9f1239"/>
      <polygon points="18,-28 26,-32 26,18 18,22" fill="#6b0d28"/>
    </g>
  </g>

  <g transform="translate(24, 136)" class="mono" font-size="9" font-weight="800">
    <g transform="translate(0, 0)">
      <path d="M 6,0 L 82,0 L 76,22 L 0,22 Z" fill="#1f0812" stroke="#ff2a5f" stroke-width="1"/>
      <text x="41" y="14.5" text-anchor="middle" fill="#fda4af">C# 12</text>
    </g>
    <g transform="translate(86, 0)">
      <path d="M 6,0 L 90,0 L 84,22 L 0,22 Z" fill="#061523" stroke="#00e5ff" stroke-width="1"/>
      <text x="45" y="14.5" text-anchor="middle" fill="#00e5ff">.NET 10.0</text>
    </g>
    <g transform="translate(180, 0)">
      <path d="M 6,0 L 104,0 L 98,22 L 0,22 Z" fill="#051a14" stroke="#00ff66" stroke-width="1"/>
      <text x="52" y="14.5" text-anchor="middle" fill="#00ff66">GDI+ 60 FPS</text>
    </g>
    <g transform="translate(288, 0)">
      <path d="M 6,0 L 94,0 L 88,22 L 0,22 Z" fill="#1a1205" stroke="#ffaa00" stroke-width="1"/>
      <text x="47" y="14.5" text-anchor="middle" fill="#ffaa00">WINFORMS</text>
    </g>
  </g>

  <line x1="24" y1="174" x2="466" y2="174" stroke="#1e293b" stroke-width="1"/>
  <g transform="translate(24, 196)" class="mono" font-size="9.5" font-weight="800" letter-spacing="1">
    <rect x="0" y="-9" width="7" height="7" fill="#ff2a5f"/>
    <text x="14" y="-2" fill="#cbd5e1">DOUBLE-BUFFERED // ZERO FLICKER</text>
    <text x="442" y="-2" text-anchor="end" fill="#ff2a5f">OPEN_REPO // GCP-POS &gt;&gt;</text>
  </g>
</svg>
