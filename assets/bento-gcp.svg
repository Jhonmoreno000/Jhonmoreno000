<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 220" width="100%" height="220">
  <defs>
    <linearGradient id="bgBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03070b"/>
      <stop offset="100%" stop-color="#07121c"/>
    </linearGradient>
    <radialGradient id="orbGlow" cx="85%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#03070b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hudRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.50"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#00ff9d" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="cardGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#00e5ff" stroke-width="0.4" stroke-opacity="0.06"/>
    </pattern>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Share Tech Mono', 'Fira Code', Consolas, monospace; }
      .disp { font-family: 'Orbitron', 'Rajdhani', 'Space Grotesk', 'Inter', sans-serif; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @keyframes railPulse { to { stroke-dashoffset: -24; } }
      .rail-anim { stroke-dasharray: 6 6; animation: railPulse 1.5s linear infinite; }
    </style>
  </defs>

  <rect width="490" height="220" rx="12" fill="url(#bgBase)"/>
  <rect width="490" height="220" rx="12" fill="url(#cardGrid)"/>
  <rect width="490" height="220" rx="12" fill="url(#orbGlow)"/>
  <rect x="1.5" y="1.5" width="487" height="217" rx="11" fill="none" stroke="url(#hudRim)" stroke-width="1.3"/>

  <!-- Corner Tactical Reticles -->
  <path d="M 12 2 L 2 2 L 2 14" fill="none" stroke="#00ff9d" stroke-width="2"/>
  <path d="M 478 2 L 488 2 L 488 14" fill="none" stroke="#00ff9d" stroke-width="2"/>
  <path d="M 12 218 L 2 218 L 2 206" fill="none" stroke="#00ff9d" stroke-width="2"/>
  <path d="M 478 218 L 488 218 L 488 206" fill="none" stroke="#00ff9d" stroke-width="2"/>

  <!-- Animated Top Data Rail -->
  <line x1="24" y1="2" x2="240" y2="2" stroke="#00ff9d" stroke-opacity="0.75" stroke-width="1.5" class="rail-anim"/>

  <!-- Module Code & Title -->
  <g transform="translate(22, 22)">
    <text x="0" y="0" class="mono" font-size="8.5" font-weight="700" fill="#00ff9d" letter-spacing="0.8">
      [ MOD-05 // NATIVE TELEMETRY ]
    </text>
    <!-- Vector Shield/Node Icon -->
    <polygon points="0,12 7,8 14,12 14,20 7,25 0,20" fill="#061622" stroke="#00ff9d" stroke-width="1.3"/>
    <circle cx="7" cy="16.5" r="2" fill="#00ff9d"/>
    <text x="22" y="22" class="disp" font-size="15.5" font-weight="800" letter-spacing="0.4" fill="#f8fafc">GCP-GESTION-PRODUCTOS</text>
  </g>

  <!-- Tactical Status Badge -->
  <g transform="translate(332, 24)" class="mono">
    <rect x="0" y="0" width="136" height="22" rx="4" fill="#040c14" stroke="#00ff9d" stroke-opacity="0.45" stroke-width="1"/>
    <text x="68" y="14.5" text-anchor="middle" font-size="9" font-weight="700" fill="#00ff9d">.NET 10 · GDI+ 60FPS</text>
  </g>

  <!-- Description Lines -->
  <g class="sans" font-size="11.8" fill="#94a3b8">
    <text x="22" y="76">Sistema transaccional de Punto de Venta (POS) y control de</text>
    <text x="22" y="96">inventario en C# 12 y Windows Forms (.NET 10.0) con gráficas</text>
    <text x="22" y="116">vectoriales en GDI+ a 60 FPS y alertas de umbrales críticos.</text>
  </g>

  <!-- Tech Tags -->
  <g transform="translate(22, 136)" class="mono" font-size="9.2" font-weight="600">
    <rect x="0" y="0" width="54" height="22" rx="4" fill="#040c14" stroke="#00ff9d" stroke-opacity="0.32"/>
    <text x="27.0" y="14.5" text-anchor="middle" fill="#cbd5e1">C# 12</text>
    <rect x="62" y="0" width="81" height="22" rx="4" fill="#040c14" stroke="#00ff9d" stroke-opacity="0.32"/>
    <text x="102.6" y="14.5" text-anchor="middle" fill="#cbd5e1">.NET 10.0</text>
    <rect x="151" y="0" width="108" height="22" rx="4" fill="#040c14" stroke="#00ff9d" stroke-opacity="0.32"/>
    <text x="205.4" y="14.5" text-anchor="middle" fill="#cbd5e1">WinForms GDI+</text>
    <rect x="268" y="0" width="88" height="22" rx="4" fill="#040c14" stroke="#00ff9d" stroke-opacity="0.32"/>
    <text x="311.6" y="14.5" text-anchor="middle" fill="#cbd5e1">POS 60 FPS</text>
  </g>

  <line x1="22" y1="174" x2="468" y2="174" stroke="#1e293b" stroke-width="1"/>
  <g transform="translate(22, 196)" class="mono" font-size="10" font-weight="700">
    <circle cx="5" cy="-3.5" r="3.5" fill="#00ff9d">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="15" y="0" fill="#e2e8f0">C# (.NET 10.0)</text>
    <text x="446" y="0" text-anchor="end" fill="#00ff9d">REPO // GCP-POS &gt;&gt;</text>
  </g>
</svg>
