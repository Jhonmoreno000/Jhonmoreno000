<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="100%" height="250">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03070b"/>
      <stop offset="50%" stop-color="#061019"/>
      <stop offset="100%" stop-color="#020508"/>
    </linearGradient>

    <linearGradient id="pConduit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="35%" stop-color="#00e5ff"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#00ff9d"/>
    </linearGradient>

    <linearGradient id="pBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00ff9d" stop-opacity="0.08"/>
    </linearGradient>

    <pattern id="pGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#00e5ff" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>

    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <path id="secPipePath" d="M 115 128 L 308 128 L 500 128 L 692 128 L 885 128"/>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Share Tech Mono', 'Fira Code', Consolas, monospace; }
      @keyframes stFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes pipeMove {
        to { stroke-dashoffset: -32; }
      }
      @keyframes laserSweep {
        0%, 100% { transform: translateY(-18px); opacity: 0.25; }
        50% { transform: translateY(18px); opacity: 1; }
      }
      .st-1 { animation: stFloat 3.4s ease-in-out infinite 0.0s; }
      .st-2 { animation: stFloat 3.4s ease-in-out infinite 0.35s; }
      .st-3 { animation: stFloat 3.4s ease-in-out infinite 0.7s; }
      .st-4 { animation: stFloat 3.4s ease-in-out infinite 1.05s; }
      .st-5 { animation: stFloat 3.4s ease-in-out infinite 1.4s; }
      .p-dash { stroke-dasharray: 8 8; animation: pipeMove 1.2s linear infinite; }
      .s-laser { animation: laserSweep 2.1s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1000" height="250" rx="14" fill="url(#pBg)"/>
  <rect width="1000" height="250" rx="14" fill="url(#pGrid)"/>
  <rect x="1.5" y="1.5" width="997" height="247" rx="13" fill="none" stroke="url(#pBorder)" stroke-width="1.3"/>
  <path d="M 14 2 L 2 2 L 2 16" fill="none" stroke="#00ff9d" stroke-width="2"/>
  <path d="M 986 2 L 998 2 L 998 16" fill="none" stroke="#00e5ff" stroke-width="2"/>
  <path d="M 14 248 L 2 248 L 2 234" fill="none" stroke="#00e5ff" stroke-width="2"/>
  <path d="M 986 248 L 998 248 L 998 234" fill="none" stroke="#00ff9d" stroke-width="2"/>

  <!-- Top Header -->
  <rect x="2" y="2" width="996" height="34" rx="12" fill="#07131e" fill-opacity="0.9"/>
  <line x1="2" y1="36" x2="998" y2="36" stroke="#00ff9d" stroke-opacity="0.22" stroke-width="1"/>
  <g class="mono" font-size="10.5" font-weight="700" letter-spacing="0.6">
    <circle cx="24" cy="19" r="3.5" fill="#00ff9d">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="38" y="23" fill="#f1f5f9">[ PIPELINE 3D // ARQUITECTURA DEVSECOPS, SAST IA &amp; BLINDAJE ZERO-TRUST ]</text>
    <text x="976" y="23" text-anchor="end" fill="#00ff9d">POSTURE: HARDENED [100%]</text>
  </g>

  <!-- Main Conduit -->
  <line x1="115" y1="128" x2="885" y2="128" stroke="#071824" stroke-width="8" stroke-linecap="round"/>
  <line x1="115" y1="128" x2="885" y2="128" stroke="url(#pConduit)" stroke-width="2.4" class="p-dash"/>

  <!-- Animated Encrypted Packets -->
  <circle r="4.5" fill="#00ff9d" filter="url(#pGlow)">
    <animateMotion dur="3.8s" repeatCount="indefinite">
      <mpath href="#secPipePath"/>
    </animateMotion>
  </circle>
  <circle r="4.5" fill="#00e5ff" filter="url(#pGlow)">
    <animateMotion dur="3.8s" begin="1.26s" repeatCount="indefinite">
      <mpath href="#secPipePath"/>
    </animateMotion>
  </circle>
  <circle r="4.5" fill="#00ff9d" filter="url(#pGlow)">
    <animateMotion dur="3.8s" begin="2.52s" repeatCount="indefinite">
      <mpath href="#secPipePath"/>
    </animateMotion>
  </circle>

  <!-- STAGE 01: THREAT MODEL & TDD -->
  <g transform="translate(115, 128)" class="mono">
    <polygon points="0,22 58,46 0,70 -58,46" fill="#061520" stroke="#00ff9d" stroke-opacity="0.5" stroke-width="1"/>
    <g class="st-1">
      <polygon points="0,-36 36,-18 0,0 -36,-18" fill="#0d2e3d" stroke="#00ff9d" stroke-width="1.2"/>
      <polygon points="-36,-18 0,0 0,34 -36,16" fill="#081f2b" stroke="#00ff9d" stroke-opacity="0.6"/>
      <polygon points="36,-18 0,0 0,34 36,16" fill="#05131b" stroke="#00ff9d" stroke-opacity="0.6"/>
      <text x="0" y="-14" text-anchor="middle" font-size="9" font-weight="800" fill="#00ff9d">DDD/TDD</text>
    </g>
    <text x="0" y="92" text-anchor="middle" font-size="10" font-weight="700" fill="#00ff9d">01 // THREAT MODEL</text>
    <text x="0" y="106" text-anchor="middle" font-size="9" fill="#94a3b8">Clean Arch · 56 Tests</text>
  </g>

  <!-- STAGE 02: SAST IA QWEN 7B -->
  <g transform="translate(308, 128)" class="mono">
    <polygon points="0,22 58,46 0,70 -58,46" fill="#061520" stroke="#00e5ff" stroke-opacity="0.5" stroke-width="1"/>
    <g class="st-2">
      <polygon points="0,-36 36,-18 0,0 -36,-18" fill="#0c283d" stroke="#00e5ff" stroke-width="1.2"/>
      <polygon points="-36,-18 0,0 0,34 -36,16" fill="#071a29" stroke="#00e5ff" stroke-opacity="0.6"/>
      <polygon points="36,-18 0,0 0,34 36,16" fill="#04101a" stroke="#00e5ff" stroke-opacity="0.6"/>
      <text x="0" y="-14" text-anchor="middle" font-size="9" font-weight="800" fill="#00e5ff">SAST-AI</text>
      <line x1="-40" y1="0" x2="40" y2="0" stroke="#00ff9d" stroke-width="2" class="s-laser"/>
    </g>
    <text x="0" y="92" text-anchor="middle" font-size="10" font-weight="700" fill="#00e5ff">02 // SAST IA GATE</text>
    <text x="0" y="106" text-anchor="middle" font-size="9" fill="#94a3b8">Qwen 2.5 7B · Semgrep</text>
  </g>

  <!-- STAGE 03: DISTROLESS DOCKER -->
  <g transform="translate(500, 128)" class="mono">
    <polygon points="0,22 58,46 0,70 -58,46" fill="#061520" stroke="#00ff9d" stroke-opacity="0.5" stroke-width="1"/>
    <g class="st-3">
      <polygon points="0,-36 36,-18 0,0 -36,-18" fill="#0d2e3d" stroke="#00ff9d" stroke-width="1.2"/>
      <polygon points="-36,-18 0,0 0,34 -36,16" fill="#081f2b" stroke="#00ff9d" stroke-opacity="0.6"/>
      <polygon points="36,-18 0,0 0,34 36,16" fill="#05131b" stroke="#00ff9d" stroke-opacity="0.6"/>
      <text x="0" y="-14" text-anchor="middle" font-size="9" font-weight="800" fill="#00ff9d">DOCKER</text>
    </g>
    <text x="0" y="92" text-anchor="middle" font-size="10" font-weight="700" fill="#00ff9d">03 // CONTENEDORES</text>
    <text x="0" y="106" text-anchor="middle" font-size="9" fill="#94a3b8">Multi-Stage · UID 10001</text>
  </g>

  <!-- STAGE 04: WAF L7 & RATE GUARD -->
  <g transform="translate(692, 128)" class="mono">
    <polygon points="0,22 58,46 0,70 -58,46" fill="#061520" stroke="#00e5ff" stroke-opacity="0.5" stroke-width="1"/>
    <g class="st-4">
      <polygon points="0,-36 36,-18 0,0 -36,-18" fill="#0c283d" stroke="#00e5ff" stroke-width="1.2"/>
      <polygon points="-36,-18 0,0 0,34 -36,16" fill="#071a29" stroke="#00e5ff" stroke-opacity="0.6"/>
      <polygon points="36,-18 0,0 0,34 36,16" fill="#04101a" stroke="#00e5ff" stroke-opacity="0.6"/>
      <text x="0" y="-14" text-anchor="middle" font-size="9" font-weight="800" fill="#00e5ff">WAF/DMZ</text>
    </g>
    <text x="0" y="92" text-anchor="middle" font-size="10" font-weight="700" fill="#00e5ff">04 // PERIMETRO L7</text>
    <text x="0" y="106" text-anchor="middle" font-size="9" fill="#94a3b8">Envoy · 1200 req/m IP</text>
  </g>

  <!-- STAGE 05: SHA-256 & ACID CORE -->
  <g transform="translate(885, 128)" class="mono">
    <polygon points="0,22 58,46 0,70 -58,46" fill="#061520" stroke="#00ff9d" stroke-opacity="0.5" stroke-width="1"/>
    <g class="st-5">
      <polygon points="0,-36 36,-18 0,0 -36,-18" fill="#0d2e3d" stroke="#00ff9d" stroke-width="1.2"/>
      <polygon points="-36,-18 0,0 0,34 -36,16" fill="#081f2b" stroke="#00ff9d" stroke-opacity="0.6"/>
      <polygon points="36,-18 0,0 0,34 36,16" fill="#05131b" stroke="#00ff9d" stroke-opacity="0.6"/>
      <text x="0" y="-14" text-anchor="middle" font-size="9" font-weight="800" fill="#00ff9d">SHA/PG17</text>
    </g>
    <text x="0" y="92" text-anchor="middle" font-size="10" font-weight="700" fill="#00ff9d">05 // ZERO-TRUST</text>
    <text x="0" y="106" text-anchor="middle" font-size="9" fill="#94a3b8">SHA-256 · OAuth2 · ACID</text>
  </g>
</svg>
