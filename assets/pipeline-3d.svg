<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="280">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060a"/>
      <stop offset="55%" stop-color="#070c14"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>

    <linearGradient id="pConduit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="28%" stop-color="#00e5ff"/>
      <stop offset="55%" stop-color="#ffaa00"/>
      <stop offset="80%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#00ff66"/>
    </linearGradient>

    <pattern id="pDots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.65" fill="#00ff66" opacity="0.07"/>
    </pattern>

    <filter id="pGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <path id="mainBus" d="M 118 148 L 309 148 L 500 148 L 691 148 L 882 148"/>

    <style>
      .mono { font-family: ui-monospace, 'JetBrains Mono', 'SFMono-Regular', 'Cascadia Code', 'Fira Code', Consolas, monospace; }
      .marquee-rail {
        stroke-dasharray: 8, 5;
        animation: dashP 24s linear infinite;
      }
      @keyframes dashP {
        to { stroke-dashoffset: -1200; }
      }
      @keyframes float3D {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes busDash {
        to { stroke-dashoffset: -32; }
      }
      @keyframes laserRing {
        0%, 100% { transform: translateY(-20px); opacity: 0.35; }
        50% { transform: translateY(14px); opacity: 1; }
      }
      .f-1 { animation: float3D 3.4s ease-in-out infinite 0.0s; }
      .f-2 { animation: float3D 3.4s ease-in-out infinite 0.4s; }
      .f-3 { animation: float3D 3.4s ease-in-out infinite 0.8s; }
      .f-4 { animation: float3D 3.4s ease-in-out infinite 1.2s; }
      .f-5 { animation: float3D 3.4s ease-in-out infinite 1.6s; }
      .bus-flow { stroke-dasharray: 8 6; animation: busDash 1.1s linear infinite; }
      .scan-ring { animation: laserRing 2.2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Die-Cut Industrial Chassis & Dot Matrix -->
  <rect width="1000" height="280" rx="10" fill="url(#pBg)"/>
  <rect width="1000" height="280" rx="10" fill="url(#pDots)"/>

  <path d="M 36,8 L 210,8 L 224,20 L 776,20 L 790,8 L 964,8 L 992,36 L 992,244 L 964,272 L 36,272 L 8,244 L 8,36 Z"
        stroke="#162232" stroke-width="2" fill="none"/>

  <path class="marquee-rail"
        d="M 40,13 L 207,13 L 221,25 L 779,25 L 793,13 L 960,13 L 987,40 L 987,240 L 960,267 L 40,267 L 13,240 L 13,40 Z"
        stroke="#00ff66" stroke-width="0.9" opacity="0.28" fill="none"/>

  <path d="M 8,50 L 8,36 L 36,8 L 50,8" fill="none" stroke="#00ff66" stroke-width="2.2"/>
  <path d="M 950,8 L 964,8 L 992,36 L 992,50" fill="none" stroke="#00e5ff" stroke-width="2.2"/>
  <path d="M 8,230 L 8,244 L 36,272 L 50,272" fill="none" stroke="#00e5ff" stroke-width="2.2"/>
  <path d="M 950,272 L 964,272 L 992,244 L 992,230" fill="none" stroke="#00ff66" stroke-width="2.2"/>

  <text x="500" y="15" class="mono" font-size="8.5" font-weight="bold" fill="#64748b" letter-spacing="2.5" text-anchor="middle">
    DEVSECOPS_3D_PIPELINE // ARQUITECTURA DE SEGURIDAD Y DESPLIEGUE CONTINUO
  </text>

  <!-- Main 3D Data Conduit Bus -->
  <line x1="118" y1="148" x2="882" y2="148" stroke="#08121e" stroke-width="10" stroke-linecap="round"/>
  <line x1="118" y1="148" x2="882" y2="148" stroke="url(#pConduit)" stroke-width="2.6" class="bus-flow"/>

  <!-- High-Speed Encrypted Packets Traveling Across 3D Bus -->
  <circle r="5" fill="#00ff66" filter="url(#pGlow)">
    <animateMotion dur="3.6s" repeatCount="indefinite"><mpath href="#mainBus"/></animateMotion>
  </circle>
  <circle r="5" fill="#00e5ff" filter="url(#pGlow)">
    <animateMotion dur="3.6s" begin="1.2s" repeatCount="indefinite"><mpath href="#mainBus"/></animateMotion>
  </circle>
  <circle r="5" fill="#ffaa00" filter="url(#pGlow)">
    <animateMotion dur="3.6s" begin="2.4s" repeatCount="indefinite"><mpath href="#mainBus"/></animateMotion>
  </circle>

  <!-- ==================== STAGE 01: 3D LAYERED CLEAN ARCHITECTURE PYRAMID ==================== -->
  <g transform="translate(118, 148)" class="mono">
    <!-- 3D Pedestal -->
    <polygon points="0,20 62,48 0,76 -62,48" fill="#050b14" stroke="#162232" stroke-width="1.2"/>
    <polygon points="-62,48 0,76 0,84 -62,56" fill="#03070c" stroke="#00ff66" stroke-opacity="0.35"/>
    <polygon points="62,48 0,76 0,84 62,56" fill="#020408" stroke="#00ff66" stroke-opacity="0.35"/>

    <!-- 3-Tier Stacked Isometric Architecture Slabs (Not a generic box!) -->
    <g class="f-1">
      <!-- Bottom Layer: Infra -->
      <polygon points="0,-2 42,18 0,38 -42,18" fill="#061e18" stroke="#00ff66" stroke-width="1.2"/>
      <polygon points="-42,18 0,38 0,45 -42,25" fill="#041410" stroke="#00ff66" stroke-opacity="0.5"/>
      <polygon points="42,18 0,38 0,45 42,25" fill="#030d0a" stroke="#00ff66" stroke-opacity="0.5"/>
      <!-- Mid Layer: Application -->
      <polygon points="0,-20 34,-4 0,12 -34,-4" fill="#092e24" stroke="#00ff66" stroke-width="1.2"/>
      <polygon points="-34,-4 0,12 0,18 -34,2" fill="#061e18"/>
      <polygon points="34,-4 0,12 0,18 34,2" fill="#041410"/>
      <!-- Top Crown: Domain Core -->
      <polygon points="0,-38 24,-26 0,-14 -24,-26" fill="#00ff66" fill-opacity="0.85" stroke="#ffffff" stroke-width="1"/>
      <text x="0" y="-50" text-anchor="middle" font-size="8" font-weight="bold" fill="#00ff66" letter-spacing="1">DDD // TDD</text>
    </g>

    <rect x="-56" y="92" width="112" height="3" fill="#00ff66"/>
    <text x="0" y="108" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#ffffff">01. CLEAN ARCH</text>
    <text x="0" y="121" text-anchor="middle" font-size="8" fill="#8ca0ba">Domain · 56 Unit Tests</text>
  </g>

  <!-- ==================== STAGE 02: 3D HOLOGRAPHIC SAST AI SCANNING CHAMBER ==================== -->
  <g transform="translate(309, 148)" class="mono">
    <polygon points="0,20 62,48 0,76 -62,48" fill="#050b14" stroke="#162232" stroke-width="1.2"/>
    <polygon points="-62,48 0,76 0,84 -62,56" fill="#03070c" stroke="#00e5ff" stroke-opacity="0.35"/>
    <polygon points="62,48 0,76 0,84 62,56" fill="#020408" stroke="#00e5ff" stroke-opacity="0.35"/>

    <!-- 3D Cylindrical Laser Chamber + Floating Octahedron Crystal -->
    <g class="f-2">
      <!-- Bottom Emitter Ring -->
      <ellipse cx="0" cy="24" rx="34" ry="15" fill="#051824" stroke="#00e5ff" stroke-width="1.2"/>
      <!-- Glass Chamber Pillars -->
      <line x1="-34" y1="-24" x2="-34" y2="24" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="1.2" stroke-dasharray="3 2"/>
      <line x1="34" y1="-24" x2="34" y2="24" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="1.2" stroke-dasharray="3 2"/>
      <!-- Internal 3D Diamond Crystal (Code AST) -->
      <polygon points="0,-22 18,-2 0,18 -18,-2" fill="#00e5ff" fill-opacity="0.35" stroke="#00e5ff" stroke-width="1.4"/>
      <polygon points="0,-22 18,-2 0,4" fill="#00e5ff" fill-opacity="0.65"/>
      <!-- Top Emitter Ring -->
      <ellipse cx="0" cy="-24" rx="34" ry="15" fill="#072232" stroke="#00e5ff" stroke-width="1.3"/>
      <!-- Oscillating 3D Laser Scanning Ring -->
      <g class="scan-ring">
        <ellipse cx="0" cy="0" rx="38" ry="16" fill="none" stroke="#00ff66" stroke-width="2" filter="url(#pGlow)"/>
      </g>
      <text x="0" y="-46" text-anchor="middle" font-size="8" font-weight="bold" fill="#00e5ff" letter-spacing="1">QWEN 2.5 7B</text>
    </g>

    <rect x="-56" y="92" width="112" height="3" fill="#00e5ff"/>
    <text x="0" y="108" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#ffffff">02. SAST AI GATE</text>
    <text x="0" y="121" text-anchor="middle" font-size="8" fill="#8ca0ba">Semgrep · LLM Local</text>
  </g>

  <!-- ==================== STAGE 03: 3D ARMORED DOCKER MULTI-STAGE VAULT ==================== -->
  <g transform="translate(500, 148)" class="mono">
    <polygon points="0,20 62,48 0,76 -62,48" fill="#050b14" stroke="#162232" stroke-width="1.2"/>
    <polygon points="-62,48 0,76 0,84 -62,56" fill="#03070c" stroke="#ffaa00" stroke-opacity="0.35"/>
    <polygon points="62,48 0,76 0,84 62,56" fill="#020408" stroke="#ffaa00" stroke-opacity="0.35"/>

    <!-- 3D Corrugated Armored Container Module with Ribbing & Lock Cylinder -->
    <g class="f-3">
      <polygon points="0,-36 42,-16 0,4 -42,-16" fill="#291d06" stroke="#ffaa00" stroke-width="1.3"/>
      <polygon points="-42,-16 0,4 0,38 -42,18" fill="#1c1404" stroke="#ffaa00" stroke-opacity="0.7" stroke-width="1"/>
      <polygon points="42,-16 0,4 0,38 42,18" fill="#120d02" stroke="#ffaa00" stroke-opacity="0.7" stroke-width="1"/>
      <!-- Container Structural Ribs (Left Face) -->
      <line x1="-30" y1="-6" x2="-30" y2="20" stroke="#ffaa00" stroke-opacity="0.6" stroke-width="2"/>
      <line x1="-20" y1="-1" x2="-20" y2="25" stroke="#ffaa00" stroke-opacity="0.6" stroke-width="2"/>
      <line x1="-10" y1="4" x2="-10" y2="30" stroke="#ffaa00" stroke-opacity="0.6" stroke-width="2"/>
      <!-- Right Face Security Lock & LEDs -->
      <circle cx="20" cy="12" r="6" fill="#04070c" stroke="#00ff66" stroke-width="1.4"/>
      <circle cx="20" cy="12" r="2" fill="#00ff66"/>
      <!-- Top Lock Cylinder -->
      <ellipse cx="0" cy="-16" rx="12" ry="6" fill="#04070c" stroke="#ffaa00" stroke-width="1.2"/>
      <text x="0" y="-46" text-anchor="middle" font-size="8" font-weight="bold" fill="#ffaa00" letter-spacing="1">UID: 10001</text>
    </g>

    <rect x="-56" y="92" width="112" height="3" fill="#ffaa00"/>
    <text x="0" y="108" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#ffffff">03. CONTENEDORES</text>
    <text x="0" y="121" text-anchor="middle" font-size="8" fill="#8ca0ba">Docker Multi-Stage</text>
  </g>

  <!-- ==================== STAGE 04: 3D HOLOGRAPHIC WAF L7 FIREWALL SHIELD GATE ==================== -->
  <g transform="translate(691, 148)" class="mono">
    <polygon points="0,20 62,48 0,76 -62,48" fill="#050b14" stroke="#162232" stroke-width="1.2"/>
    <polygon points="-62,48 0,76 0,84 -62,56" fill="#03070c" stroke="#ff2a5f" stroke-opacity="0.35"/>
    <polygon points="62,48 0,76 0,84 62,56" fill="#020408" stroke="#00e5ff" stroke-opacity="0.35"/>

    <!-- 3D Vertical Laser Firewall Gate in Isometric Skew -->
    <g class="f-4">
      <!-- Left & Right Heavy Gate Pylons -->
      <polygon points="-32,-30 -22,-25 -22,30 -32,25" fill="#162232" stroke="#00e5ff" stroke-width="1"/>
      <polygon points="22,-8 32,-3 32,52 22,47" fill="#162232" stroke="#00e5ff" stroke-width="1"/>
      <!-- Translucent Energy Shield Wall Between Pylons -->
      <polygon points="-22,-25 22,-4 22,44 -22,23" fill="#00ff66" fill-opacity="0.18" stroke="#00ff66" stroke-width="1.5"/>
      <!-- Shield Grid Lines -->
      <line x1="-22" y1="-9" x2="22" y2="12" stroke="#00ff66" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="3 2"/>
      <line x1="-22" y1="7" x2="22" y2="28" stroke="#00ff66" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="3 2"/>
      <!-- Red Attack Deflection Spark on Left Side of Shield -->
      <circle cx="-12" cy="4" r="4" fill="#ff2a5f">
        <animate attributeName="r" values="2;8;2" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="-42" text-anchor="middle" font-size="8" font-weight="bold" fill="#ff2a5f" letter-spacing="1">WAF L7 // DMZ</text>
    </g>

    <rect x="-56" y="92" width="112" height="3" fill="#ff2a5f"/>
    <text x="0" y="108" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#ffffff">04. FIREWALL GATE</text>
    <text x="0" y="121" text-anchor="middle" font-size="8" fill="#8ca0ba">Envoy · 1200 req/m IP</text>
  </g>

  <!-- ==================== STAGE 05: 3D CYLINDRICAL POSTGRES 17 ACID DATABASE SILO ==================== -->
  <g transform="translate(882, 148)" class="mono">
    <polygon points="0,20 62,48 0,76 -62,48" fill="#050b14" stroke="#162232" stroke-width="1.2"/>
    <polygon points="-62,48 0,76 0,84 -62,56" fill="#03070c" stroke="#c084fc" stroke-opacity="0.35"/>
    <polygon points="62,48 0,76 0,84 62,56" fill="#020408" stroke="#c084fc" stroke-opacity="0.35"/>

    <!-- 3-Tiered 3D Cylindrical Database Silo (True Cylinder Geometry!) -->
    <g class="f-5">
      <!-- Bottom Cylinder Drum -->
      <path d="M -32,6 L -32,24 A 32,14 0 0,0 32,24 L 32,6 Z" fill="#170d2b" stroke="#c084fc" stroke-width="1.1"/>
      <ellipse cx="0" cy="6" rx="32" ry="14" fill="#231442" stroke="#c084fc" stroke-width="1.1"/>
      <!-- Middle Cylinder Drum -->
      <path d="M -32,-12 L -32,4 A 32,14 0 0,0 32,4 L 32,-12 Z" fill="#170d2b" stroke="#00e5ff" stroke-width="1.1"/>
      <ellipse cx="0" cy="-12" rx="32" ry="14" fill="#13293d" stroke="#00e5ff" stroke-width="1.1"/>
      <!-- Top Cylinder Drum -->
      <path d="M -32,-30 L -32,-14 A 32,14 0 0,0 32,-14 L 32,-30 Z" fill="#08241b" stroke="#00ff66" stroke-width="1.1"/>
      <ellipse cx="0" cy="-30" rx="32" ry="14" fill="#0d3829" stroke="#00ff66" stroke-width="1.3"/>
      <text x="0" y="-27" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#00ff66">SHA-256</text>
      <text x="0" y="-50" text-anchor="middle" font-size="8" font-weight="bold" fill="#c084fc" letter-spacing="1">PG 16/17 ACID</text>
    </g>

    <rect x="-56" y="92" width="112" height="3" fill="#c084fc"/>
    <text x="0" y="108" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#ffffff">05. DATA VAULT</text>
    <text x="0" y="121" text-anchor="middle" font-size="8" fill="#8ca0ba">PostgreSQL · OAuth2</text>
  </g>
</svg>
