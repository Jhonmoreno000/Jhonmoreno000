      @keyframes railB { to { stroke-dashoffset: -26; } }
      @keyframes floatB { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
      @keyframes scanB { 0%, 100% { transform: translateY(-16px); } 50% { transform: translateY(14px); } }
