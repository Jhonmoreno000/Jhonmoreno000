<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 220" width="100%" height="220">
  <defs>
    <linearGradient id="bgAr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080c"/>
      <stop offset="100%" stop-color="#071618"/>
    </linearGradient>
    <pattern id="dotsAr" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#00ff66" fill-opacity="0.12"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @keyframes railAr { to { stroke-dashoffset: -26; } }
      @keyframes floatAr { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
      @keyframes pulseRed { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
      .rail { stroke-dasharray: 8 5; animation: railAr 1.6s linear infinite; }
      .float3d { animation: floatAr 3.6s ease-in-out infinite; }
      .red-blip { animation: pulseRed 1.5s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="490" height="220" rx="6" fill="#030508"/>
  <path d="M 22,6 L 160,6 L 170,13 L 360,13 L 370,6 L 474,6 L 484,16 L 484,204 L 472,214 L 18,214 L 6,202 L 6,22 Z"
        fill="url(#bgAr)" stroke="#1e293b" stroke-width="1.5"/>
  <path d="M 22,6 L 160,6 L 170,13 L 360,13 L 370,6 L 474,6 L 484,16 L 484,204 L 472,214 L 18,214 L 6,202 L 6,22 Z"
        fill="url(#dotsAr)"/>
  <path d="M 22,6 L 160,6 L 170,13 L 360,13 L 370,6 L 474,6 L 484,16 L 484,204 L 472,214 L 18,214 L 6,202 L 6,22 Z"
        fill="none" stroke="#00ff66" stroke-width="1.4" stroke-opacity="0.7" class="rail"/>

  <rect x="24" y="5" width="90" height="3" fill="#00ff66"/>
  <text x="24" y="28" class="mono" font-size="9" font-weight="800" fill="#00ff66" letter-spacing="2">SYS_02 // PERIMETER DMZ</text>

  <text x="25.5" y="53.5" class="mono" font-size="20" font-weight="900" fill="#00e5ff" fill-opacity="0.35" letter-spacing="2">ARCHITECT-TD</text>
  <text x="24" y="52" class="mono" font-size="20" font-weight="900" fill="#f8fafc" letter-spacing="2">ARCHITECT-TD</text>
  <text x="192" y="51" class="mono" font-size="10" font-weight="700" fill="#ff2a5f" letter-spacing="1">// 360 WAF SIM</text>

  <g class="sans" font-size="11.2" fill="#94a3b8">
    <text x="24" y="78">Simulador de defensa perimetral 360 en HTML5 Canvas:</text>
    <text x="24" y="96">mitigacion activa de SYN Flood, SQLi, MITM y Spectre</text>
    <text x="24" y="114">con WAF L7, Envoy, Redis, Hotfix IDE y 56 unit tests.</text>
  </g>

  <!-- 3D ISOMETRIC SCULPTURE: 3D HOLOGRAPHIC WAF SHIELD & RADAR -->
  <g transform="translate(418, 86)">
    <polygon points="0,8 46,28 0,48 -46,28" fill="#03080e" stroke="#00ff66" stroke-opacity="0.45" stroke-width="1"/>
    <ellipse cx="0" cy="28" rx="30" ry="12" fill="none" stroke="#00e5ff" stroke-opacity="0.4" stroke-dasharray="3 2"/>
    <g class="float3d">
      <!-- 3D Hexagonal WAF Gate -->
      <polygon points="0,-34 26,-20 26,10 0,24 -26,10 -26,-20" fill="#00ff66" fill-opacity="0.16" stroke="#00ff66" stroke-width="1.6"/>
      <polygon points="0,-24 16,-14 16,4 0,14 -16,4 -16,-14" fill="#041814" stroke="#00e5ff" stroke-width="1.2"/>
      <text x="0" y="-2" text-anchor="middle" class="mono" font-size="7.5" font-weight="900" fill="#00ff66">WAF L7</text>
      <!-- Red Team Threat Deflection -->
      <line x1="-42" y1="-18" x2="-22" y2="-8" stroke="#ff2a5f" stroke-width="1.6" stroke-dasharray="3 2"/>
      <circle cx="-22" cy="-8" r="3.5" fill="#ff2a5f" class="red-blip"/>
    </g>
  </g>

  <g transform="translate(24, 136)" class="mono" font-size="9" font-weight="800">
    <g transform="translate(0, 0)">
      <path d="M 6,0 L 98,0 L 92,22 L 0,22 Z" fill="#051a14" stroke="#00ff66" stroke-width="1"/>
      <text x="49" y="14.5" text-anchor="middle" fill="#00ff66">56 UNIT TESTS</text>
    </g>
    <g transform="translate(102, 0)">
      <path d="M 6,0 L 96,0 L 90,22 L 0,22 Z" fill="#061523" stroke="#00e5ff" stroke-width="1"/>
      <text x="48" y="14.5" text-anchor="middle" fill="#e2e8f0">CANVAS 2D</text>
    </g>
    <g transform="translate(202, 0)">
      <path d="M 6,0 L 90,0 L 84,22 L 0,22 Z" fill="#1c0811" stroke="#ff2a5f" stroke-width="1"/>
      <text x="45" y="14.5" text-anchor="middle" fill="#ff2a5f">ANTI-DDoS</text>
    </g>
    <g transform="translate(296, 0)">
      <path d="M 6,0 L 86,0 L 80,22 L 0,22 Z" fill="#061523" stroke="#ffaa00" stroke-width="1"/>
      <text x="43" y="14.5" text-anchor="middle" fill="#ffaa00">DOCKER IaC</text>
    </g>
  </g>

  <line x1="24" y1="174" x2="466" y2="174" stroke="#1e293b" stroke-width="1"/>
  <g transform="translate(24, 196)" class="mono" font-size="9.5" font-weight="800" letter-spacing="1">
    <rect x="0" y="-9" width="7" height="7" fill="#00ff66"/>
    <text x="14" y="-2" fill="#cbd5e1">7 CHAPTERS // 5 DMZ TOPOLOGIES</text>
    <text x="442" y="-2" text-anchor="end" fill="#00ff66">OPEN_REPO // ARCHITECT-TD &gt;&gt;</text>
  </g>
</svg>
