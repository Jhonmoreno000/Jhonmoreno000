<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 215" width="100%" height="215">
  <defs>
    <linearGradient id="bnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111522"/>
      <stop offset="100%" stop-color="#0b0d14"/>
    </linearGradient>
    <style>
      @keyframes floatBento { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
      .b-iso { animation: floatBento 3.6s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="490" height="215" rx="14" fill="url(#bnBg)"/>
  <rect x="1" y="1" width="488" height="213" rx="13" fill="none" stroke="#22293a" stroke-width="1.5"/>

  <!-- Repo Icon + Title -->
  <g transform="translate(24, 26)">
    <!-- GitHub Repo Book Icon -->
    <path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z" fill="#93c5fd" transform="translate(0, 2) scale(1.1)"/>
    <text x="26" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="18" font-weight="800" fill="#93c5fd">
      NEXUS
    </text>
    <rect x="98" y="1" width="96" height="20" rx="10" fill="#161b2e" stroke="#4f46e5" stroke-width="1"/>
    <text x="146" y="14" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#93c5fd">SQL ENGINE</text>
  </g>

  <!-- 3D Isometric Database Cylinder in Top-Right Corner -->
  <g transform="translate(432, 46)">
    <g class="b-iso">
      <path d="M -22 0 L -22 14 A 22 9 0 0 0 22 14 L 22 0 Z" fill="#4f46e5"/>
      <ellipse cx="0" cy="0" rx="22" ry="9" fill="#93c5fd"/>
      <path d="M -22 -16 L -22 -2 A 22 9 0 0 0 22 -2 L 22 -16 Z" fill="#60a5fa"/>
      <ellipse cx="0" cy="-16" rx="22" ry="9" fill="#93c5fd"/>
    </g>
  </g>

  <!-- Description -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" fill="#9aa5ce">
    <text x="24" y="78">Simulador interactivo de esquemas relacionales y motor</text>
    <text x="24" y="98">de análisis visual de planes de ejecución SQL (EXPLAIN),</text>
    <text x="24" y="118">optimización de índices B-Tree y modelado DDL/DML.</text>
  </g>

  <!-- Tags Row -->
  <g transform="translate(24, 138)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#c0caf5">
    <rect x="0" y="0" width="76" height="22" rx="5" fill="#141923" stroke="#262f42"/>
    <text x="38" y="14.5" text-anchor="middle">React 18</text>

    <rect x="84" y="0" width="88" height="22" rx="5" fill="#141923" stroke="#262f42"/>
    <text x="128" y="14.5" text-anchor="middle">Query Plan</text>

    <rect x="180" y="0" width="90" height="22" rx="5" fill="#141923" stroke="#262f42"/>
    <text x="225" y="14.5" text-anchor="middle">B-Tree SQL</text>
  </g>

  <!-- Footer Metadata -->
  <g transform="translate(24, 184)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#787c99">
    <circle cx="6" cy="-4" r="5" fill="#3178c6"/>
    <text x="18" y="0" fill="#c0caf5">TypeScript</text>
    <text x="442" y="0" text-anchor="end" fill="#93c5fd" font-weight="700">github.com/Jhonmoreno000/NEXUS &#8599;</text>
  </g>
</svg>
