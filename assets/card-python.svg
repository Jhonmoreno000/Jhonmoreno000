<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 145" width="100%" height="145">
  <defs>
    <linearGradient id="pyCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="60%" stop-color="#080d1a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
  </defs>

  <!-- Base Card -->
  <rect width="850" height="145" rx="10" fill="url(#pyCardBg)"/>
  <rect x="0.5" y="0.5" width="849" height="144" rx="9.5" fill="none" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Left Accent Glow Bar -->
  <line x1="2" y1="20" x2="2" y2="125" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Category & Live Status -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" letter-spacing="1">
    <text x="32" y="28" fill="#38bdf8">REPOSITORY // 02 · ALGORITHMS &amp; COMPUTATIONAL LOGIC</text>
    <text x="818" y="28" text-anchor="end" fill="#38bdf8">CLEAN CODE MODULAR</text>
    <circle cx="670" cy="25" r="3" fill="#38bdf8"/>
  </g>

  <!-- Title -->
  <text x="32" y="58" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="20" 
        font-weight="700" 
        fill="#f8fafc" 
        letter-spacing="-0.3">
    I-work-in-python
  </text>

  <!-- Technical Description -->
  <text x="32" y="82" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="13" 
        fill="#94a3b8">
    Suite de resolucion de problemas computacionales y estructuras de datos avanzadas en Python puro. Enfoque
  </text>
  <text x="32" y="100" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="13" 
        fill="#94a3b8">
    riguroso en analisis de complejidad temporal y espacial Big-O, optimizacion de memoria y diseno desacoplado.
  </text>

  <!-- Tech Pills Bar & CTA -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10">
    <!-- Pill 1 -->
    <rect x="32" y="114" width="80" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="72" y="128" fill="#cbd5e1" text-anchor="middle">Python 3.x</text>
    
    <!-- Pill 2 -->
    <rect x="120" y="114" width="86" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="163" y="128" fill="#cbd5e1" text-anchor="middle">Algorithms</text>
    
    <!-- Pill 3 -->
    <rect x="214" y="114" width="112" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="270" y="128" fill="#cbd5e1" text-anchor="middle">Data Structures</text>
    
    <!-- Pill 4 -->
    <rect x="334" y="114" width="86" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="377" y="128" fill="#38bdf8" text-anchor="middle">Big-O Opt</text>

    <!-- Pill 5 -->
    <rect x="428" y="114" width="84" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="470" y="128" fill="#cbd5e1" text-anchor="middle">Clean Code</text>

    <!-- CTA Button on Right -->
    <rect x="700" y="114" width="118" height="20" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#00f2fe" stroke-width="1"/>
    <text x="759" y="128" fill="#00f2fe" text-anchor="middle" font-weight="700">EXPLORE REPO &gt;</text>
  </g>
</svg>
