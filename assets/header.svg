<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="40%" stop-color="#0b1120"/>
      <stop offset="80%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Border Accent Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f2fe" stroke-width="0.5" stroke-opacity="0.08"/>
      <circle cx="0" cy="0" r="1" fill="#00f2fe" fill-opacity="0.2"/>
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 0.9; }
      }
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes radarSweep {
        0% { transform: translateX(0); }
        100% { transform: translateX(850px); }
      }
      .glow-line {
        animation: pulseGlow 3s infinite ease-in-out;
      }
      .cursor {
        animation: blinkCursor 1s infinite;
      }
    </style>
  </defs>

  <!-- Base Card Background -->
  <rect width="850" height="220" rx="14" fill="url(#bgGrad)"/>

  <!-- Cyber Grid Overlay -->
  <rect width="850" height="220" rx="14" fill="url(#cyberGrid)"/>

  <!-- Top Accent Glowing Border -->
  <line x1="40" y1="2" x2="810" y2="2" stroke="url(#borderGrad)" stroke-width="2.5" class="glow-line"/>
  <rect x="0.5" y="0.5" width="849" height="219" rx="13.5" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Corner Tech Accents -->
  <path d="M 12 28 L 12 12 L 28 12" fill="none" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.7"/>
  <path d="M 838 28 L 838 12 L 822 12" fill="none" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.7"/>
  <path d="M 12 192 L 12 208 L 28 208" fill="none" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.7"/>
  <path d="M 838 192 L 838 208 L 822 208" fill="none" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.7"/>

  <!-- Top System Telemetry Bar -->
  <g font-family="'Fira Code', 'Courier New', monospace" font-size="11" fill="#64748b">
    <text x="36" y="32">SYS://CORE_RUNTIME</text>
    <text x="700" y="32" fill="#00f2fe" text-anchor="end">ID: JAM-000 // ARCH: x86_64</text>
    <circle cx="725" cy="28" r="4" fill="#00f5a0"/>
    <text x="736" y="32" fill="#00f5a0">ONLINE</text>
  </g>

  <!-- Divider Line -->
  <line x1="36" y1="42" x2="814" y2="42" stroke="#1e293b" stroke-width="1"/>

  <!-- Main Title: JHON ANDERSON MORENO -->
  <text x="425" y="98" 
        text-anchor="middle" 
        font-family="'Segoe UI', -apple-system, Roboto, sans-serif" 
        font-weight="900" 
        font-size="36" 
        letter-spacing="4" 
        fill="url(#cyanGrad)" 
        filter="url(#neonGlow)">
    JHON ANDERSON MORENO
  </text>

  <!-- Subtitle: Professional Role -->
  <text x="425" y="132" 
        text-anchor="middle" 
        font-family="'Fira Code', 'Courier New', monospace" 
        font-weight="600" 
        font-size="14" 
        letter-spacing="2" 
        fill="#cbd5e1">
    SOFTWARE ENGINEER // BACKEND SYSTEMS &amp; DEVSECOPS
  </text>

  <!-- Tech Focus Pills inside SVG -->
  <g font-family="'Fira Code', 'Courier New', monospace" font-size="11" text-anchor="middle">
    <!-- Pill 1 -->
    <rect x="90" y="156" width="180" height="26" rx="6" fill="#0b1324" stroke="#0284c7" stroke-width="1" stroke-opacity="0.6"/>
    <text x="180" y="173" fill="#38bdf8">&gt; DISTRIBUTED APIS</text>

    <!-- Pill 2 -->
    <rect x="290" y="156" width="170" height="26" rx="6" fill="#0b1324" stroke="#0284c7" stroke-width="1" stroke-opacity="0.6"/>
    <text x="375" y="173" fill="#38bdf8">&gt; CLEAN ARCH / TDD</text>

    <!-- Pill 3 -->
    <rect x="480" y="156" width="180" height="26" rx="6" fill="#0b1324" stroke="#0284c7" stroke-width="1" stroke-opacity="0.6"/>
    <text x="570" y="173" fill="#38bdf8">&gt; DOCKER &amp; CI/CD</text>

    <!-- Pill 4 -->
    <rect x="680" y="156" width="140" height="26" rx="6" fill="#0b1324" stroke="#0284c7" stroke-width="1" stroke-opacity="0.6"/>
    <text x="750" y="173" fill="#00f5a0">&gt; UTC-5 CORE</text>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="40" y1="202" x2="810" y2="202" stroke="url(#borderGrad)" stroke-width="1.5" class="glow-line"/>
</svg>
