<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="340">
  <defs>
    <linearGradient id="nfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11131d"/>
      <stop offset="100%" stop-color="#0b0d14"/>
    </linearGradient>

    <linearGradient id="asciiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="50%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#73daca"/>
    </linearGradient>

    <style>
      @keyframes blinkBlock {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes cmdAppear1 {
        0%, 12% { opacity: 0; }
        18%, 92% { opacity: 1; }
        96%, 100% { opacity: 0; }
      }
      @keyframes cmdAppear2 {
        0%, 32% { opacity: 0; }
        40%, 92% { opacity: 1; }
        96%, 100% { opacity: 0; }
      }
      .nf-cursor { animation: blinkBlock 1s infinite; }
      .nf-cmd-1 { animation: cmdAppear1 9s infinite; }
      .nf-cmd-2 { animation: cmdAppear2 9s infinite; }
    </style>
  </defs>

  <!-- Terminal Window Frame -->
  <rect width="1000" height="340" rx="14" fill="url(#nfBg)"/>
  <rect x="1" y="1" width="998" height="338" rx="13" fill="none" stroke="#24283b" stroke-width="1.5"/>

  <!-- Top Kitty/Alacritty Window Bar -->
  <rect x="2" y="2" width="996" height="36" rx="12" fill="#161926"/>
  <line x1="2" y1="38" x2="998" y2="38" stroke="#24283b" stroke-width="1"/>

  <circle cx="24" cy="20" r="5.5" fill="#f7768e"/>
  <circle cx="42" cy="20" r="5.5" fill="#e0af68"/>
  <circle cx="60" cy="20" r="5.5" fill="#9ece6a"/>

  <text x="500" y="24" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#787c99">
    jhon@medellin-workstation: ~ (zsh - fastfetch)
  </text>

  <!-- ==================== LEFT SIDE: 3D ISOMETRIC + ASCII LOGO ==================== -->
  <g transform="translate(46, 62)" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11.5" font-weight="700" fill="url(#asciiGrad)" xml:space="preserve">
    <text x="0" y="16">        /\        </text>
    <text x="0" y="32">       /  \       </text>
    <text x="0" y="48">      / /\ \      </text>
    <text x="0" y="64">     / /  \ \     </text>
    <text x="0" y="80">    / /    \ \    </text>
    <text x="0" y="96">   / /  /\  \ \   </text>
    <text x="0" y="112">  / /  /  \  \ \  </text>
    <text x="0" y="128"> / /__/ /\ \__\ \ </text>
    <text x="0" y="144"> \____\/  \/____/ </text>
  </g>

  <!-- 3D Isometric Mini-Cube Embedded Below ASCII Art -->
  <g transform="translate(112, 256)">
    <polygon points="0,-20 26,-7 0,6 -26,-7" fill="#7aa2f7"/>
    <polygon points="-26,-7 0,6 0,32 -26,19" fill="#3d59a1"/>
    <polygon points="26,-7 0,6 0,32 26,19" fill="#243763"/>
    <text x="0" y="48" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#565f89">ARCH // LINUX</text>
  </g>

  <!-- ==================== RIGHT SIDE: FASTFETCH SYSTEM SPECS ==================== -->
  <g transform="translate(245, 62)" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12">
    <!-- User@Host Header -->
    <text x="0" y="14" font-weight="800" fill="#7aa2f7">jhon.moreno<tspan fill="#c0caf5">@</tspan><tspan fill="#bb9af7">medellin-cluster</tspan></text>
    <text x="0" y="28" fill="#414868">--------------------------------------------</text>

    <!-- Column 1 of Specs -->
    <text x="0" y="48"><tspan fill="#7aa2f7" font-weight="700">OS</tspan><tspan fill="#565f89">           ~ </tspan><tspan fill="#c0caf5">Linux (Arch / Fedora) · Docker Engine</tspan></text>
    <text x="0" y="68"><tspan fill="#7aa2f7" font-weight="700">Role</tspan><tspan fill="#565f89">         ~ </tspan><tspan fill="#c0caf5">Backend Engineer &amp; DevSecOps Specialist</tspan></text>
    <text x="0" y="88"><tspan fill="#7aa2f7" font-weight="700">Formation</tspan><tspan fill="#565f89">    ~ </tspan><tspan fill="#c0caf5">Tecnólogo en Desarrollo de Software (SENA ADSO)</tspan></text>
    <text x="0" y="108"><tspan fill="#bb9af7" font-weight="700">Languages</tspan><tspan fill="#565f89">    ~ </tspan><tspan fill="#c0caf5">Python 3.12, Java 21, C# (.NET), TypeScript, SQL</tspan></text>
    <text x="0" y="128"><tspan fill="#bb9af7" font-weight="700">Frameworks</tspan><tspan fill="#565f89">   ~ </tspan><tspan fill="#c0caf5">Spring Boot, FastAPI, Node.js/Express, React</tspan></text>
    <text x="0" y="148"><tspan fill="#73daca" font-weight="700">Databases</tspan><tspan fill="#565f89">    ~ </tspan><tspan fill="#c0caf5">PostgreSQL, MySQL, MongoDB, Redis (ACID &amp; NoSQL)</tspan></text>
    <text x="0" y="168"><tspan fill="#73daca" font-weight="700">Architecture</tspan><tspan fill="#565f89"> ~ </tspan><tspan fill="#c0caf5">Clean Architecture, Hexagonal, DDD, SOLID, TDD</tspan></text>
    <text x="0" y="188"><tspan fill="#e0af68" font-weight="700">DevSecOps</tspan><tspan fill="#565f89">    ~ </tspan><tspan fill="#c0caf5">Multi-Stage Docker, SAST/DAST, Ollama AI, Actions</tspan></text>

    <!-- 16-Color ANSI Terminal Palette Swatches -->
    <g transform="translate(0, 204)">
      <rect x="0" y="0" width="22" height="12" rx="2" fill="#15161e"/>
      <rect x="26" y="0" width="22" height="12" rx="2" fill="#f7768e"/>
      <rect x="52" y="0" width="22" height="12" rx="2" fill="#9ece6a"/>
      <rect x="78" y="0" width="22" height="12" rx="2" fill="#e0af68"/>
      <rect x="104" y="0" width="22" height="12" rx="2" fill="#7aa2f7"/>
      <rect x="130" y="0" width="22" height="12" rx="2" fill="#bb9af7"/>
      <rect x="156" y="0" width="22" height="12" rx="2" fill="#7dcfff"/>
      <rect x="182" y="0" width="22" height="12" rx="2" fill="#a9b1d6"/>
    </g>

    <!-- Interactive Live Prompt Execution Below Fastfetch -->
    <g transform="translate(0, 236)">
      <text x="0" y="12" fill="#9ece6a" font-weight="700">&#10140;</text>
      <text x="18" y="12" fill="#7dcfff" font-weight="700">~</text>
      <text x="34" y="12" fill="#c0caf5" class="nf-cmd-1">systemctl status microservices.target nexus-sql.service ai-sec.service</text>
      <text x="0" y="32" fill="#73daca" font-size="11" class="nf-cmd-2">● Active: active (running) · 0 critical vulnerabilities · EXPLAIN index scan 0.29ms</text>
      <rect x="595" y="21" width="7" height="13" fill="#7aa2f7" class="nf-cursor"/>
    </g>
  </g>
</svg>
