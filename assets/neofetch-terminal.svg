<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="360">
  <defs>
    <linearGradient id="nfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060a"/>
      <stop offset="55%" stop-color="#070c14"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>

    <radialGradient id="nfGlowL" cx="20%" cy="50%" r="38%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#00e5ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#020306" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nfGlowR" cx="78%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#020306" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="radarFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.32"/>
    </linearGradient>

    <pattern id="nfDots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.65" fill="#00ff66" opacity="0.07"/>
    </pattern>

    <style>
      .mono { font-family: ui-monospace, 'JetBrains Mono', 'SFMono-Regular', 'Cascadia Code', 'Fira Code', Consolas, monospace; }
      .marquee-rail {
        stroke-dasharray: 8, 5;
        animation: dashNf 24s linear infinite;
      }
      @keyframes dashNf {
        to { stroke-dashoffset: -1200; }
      }
      @keyframes radarPulse {
        0%, 100% { fill-opacity: 0.28; stroke-width: 2; }
        50% { fill-opacity: 0.52; stroke-width: 2.6; }
      }
      @keyframes cmd1 {
        0%, 8% { opacity: 0; }
        16%, 92% { opacity: 1; }
        97%, 100% { opacity: 0; }
      }
      @keyframes cmd2 {
        0%, 26% { opacity: 0; }
        35%, 92% { opacity: 1; }
        97%, 100% { opacity: 0; }
      }
      @keyframes blinkCur {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0.15; }
      }
      .radar-shape { animation: radarPulse 3.6s ease-in-out infinite; }
      .c-line-1 { animation: cmd1 9.5s ease-in-out infinite; }
      .c-line-2 { animation: cmd2 9.5s ease-in-out infinite; }
      .cur-blk { animation: blinkCur 1s infinite; }
    </style>
  </defs>

  <!-- Base Canvas & Dot Matrix -->
  <rect width="1000" height="360" rx="10" fill="url(#nfBg)"/>
  <rect width="1000" height="360" rx="10" fill="url(#nfDots)"/>
  <rect width="1000" height="360" rx="10" fill="url(#nfGlowL)"/>
  <rect width="1000" height="360" rx="10" fill="url(#nfGlowR)"/>

  <!-- Die-Cut Armored Chassis -->
  <path d="M 36,8 L 210,8 L 224,20 L 776,20 L 790,8 L 964,8 L 992,36 L 992,324 L 964,352 L 36,352 L 8,324 L 8,36 Z"
        stroke="#162232" stroke-width="2" fill="none"/>

  <path class="marquee-rail"
        d="M 40,13 L 207,13 L 221,25 L 779,25 L 793,13 L 960,13 L 987,40 L 987,320 L 960,347 L 40,347 L 13,320 L 13,40 Z"
        stroke="#00e5ff" stroke-width="0.9" opacity="0.28" fill="none"/>

  <path d="M 8,50 L 8,36 L 36,8 L 50,8" fill="none" stroke="#00ff66" stroke-width="2.2"/>
  <path d="M 950,8 L 964,8 L 992,36 L 992,50" fill="none" stroke="#00e5ff" stroke-width="2.2"/>
  <path d="M 8,310 L 8,324 L 36,352 L 50,352" fill="none" stroke="#00e5ff" stroke-width="2.2"/>
  <path d="M 950,352 L 964,352 L 992,324 L 992,310" fill="none" stroke="#00ff66" stroke-width="2.2"/>

  <text x="500" y="15" class="mono" font-size="8.5" font-weight="bold" fill="#64748b" letter-spacing="2.5" text-anchor="middle">
    SEC_FETCH_V6.8 // 3D SKILL RADAR &amp; SYSTEM TELEMETRY TERMINAL
  </text>

  <!-- ==================== LEFT MODULE: 3D HEXAGONAL SKILL & SECURITY RADAR ==================== -->
  <g transform="translate(28, 34)">
    <path d="M 0,0 L 306,0 L 320,14 L 320,294 L 14,294 L 0,280 Z" fill="#04070c" stroke="#162232" stroke-width="1.2"/>
    <rect x="0" y="0" width="306" height="3" fill="#00ff66"/>
    <text x="14" y="20" class="mono" font-size="8.5" font-weight="bold" fill="#00ff66" letter-spacing="1.4">
      RADAR_3D // MATRIZ DE DOMINIO TECNICO
    </text>

    <!-- 3D Isometric Base Platform Under Radar -->
    <polygon points="160,224 256,252 160,280 64,252" fill="#07101a" stroke="#162232" stroke-width="1"/>
    <polygon points="160,232 224,252 160,272 96,252" fill="none" stroke="#00ff66" stroke-opacity="0.25" stroke-width="0.8" stroke-dasharray="3 3"/>

    <!-- 6-Axis Hexagonal Radar Web (Center: x=160, y=142, R=76) -->
    <g transform="translate(160, 142)">
      <!-- Outer Hex Ring (R=76) -->
      <polygon points="0,-76 65.8,-38 65.8,38 0,76 -65.8,38 -65.8,-38" fill="#060d16" stroke="#1e293b" stroke-width="1"/>
      <!-- Mid Hex Ring (R=52) -->
      <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="none" stroke="#1e293b" stroke-width="0.9" stroke-dasharray="3 3"/>
      <!-- Inner Hex Ring (R=28) -->
      <polygon points="0,-28 24.2,-14 24.2,14 0,28 -24.2,14 -24.2,-14" fill="none" stroke="#1e293b" stroke-width="0.8"/>

      <!-- 6 Axis Spokes -->
      <line x1="0" y1="-76" x2="0" y2="76" stroke="#1e293b" stroke-width="0.9"/>
      <line x1="-65.8" y1="-38" x2="65.8" y2="38" stroke="#1e293b" stroke-width="0.9"/>
      <line x1="-65.8" y1="38" x2="65.8" y2="-38" stroke="#1e293b" stroke-width="0.9"/>

      <!-- Active Radar Polygon (96% Backend, 92% SAST/Sec, 94% SQL ACID, 90% Docker/IaC, 88% WAF/Net, 95% Clean Arch) -->
      <polygon points="0,-73 60,-34.5 62,35.8 0,68.5 -58,33.5 -62.5,-36"
               fill="url(#radarFill)" stroke="#00ff66" class="radar-shape"/>

      <!-- Glowing Vertex Nodes -->
      <circle cx="0" cy="-73" r="3.5" fill="#00ff66"/>
      <circle cx="60" cy="-34.5" r="3.5" fill="#00e5ff"/>
      <circle cx="62" cy="35.8" r="3.5" fill="#ffaa00"/>
      <circle cx="0" cy="68.5" r="3.5" fill="#00ff9d"/>
      <circle cx="-58" cy="33.5" r="3.5" fill="#ff2a5f"/>
      <circle cx="-62.5" cy="-36" r="3.5" fill="#c084fc"/>

      <!-- 6 Axis Labels -->
      <text x="0" y="-84" class="mono" font-size="8" font-weight="bold" fill="#00ff66" text-anchor="middle">BACKEND_API [96%]</text>
      <text x="74" y="-36" class="mono" font-size="7.5" font-weight="bold" fill="#00e5ff" text-anchor="start">SAST_IA</text>
      <text x="74" y="42" class="mono" font-size="7.5" font-weight="bold" fill="#ffaa00" text-anchor="start">SQL_ACID</text>
      <text x="0" y="92" class="mono" font-size="8" font-weight="bold" fill="#00ff9d" text-anchor="middle">DOCKER_IAC [92%]</text>
      <text x="-74" y="42" class="mono" font-size="7.5" font-weight="bold" fill="#ff2a5f" text-anchor="end">WAF_DMZ</text>
      <text x="-74" y="-36" class="mono" font-size="7.5" font-weight="bold" fill="#c084fc" text-anchor="end">CLEAN_DDD</text>
    </g>

    <text x="160" y="274" class="mono" font-size="8" font-weight="bold" fill="#8ca0ba" letter-spacing="1" text-anchor="middle">
      RANK: S+ // ZERO-TRUST ENGINEER
    </text>
  </g>

  <!-- ==================== RIGHT MODULE: AUTHENTIC LINUX FASTFETCH / SEC-FETCH TERMINAL ==================== -->
  <g transform="translate(364, 34)">
    <path d="M 0,0 L 594,0 L 608,14 L 608,294 L 0,294 Z" fill="#04070c" stroke="#162232" stroke-width="1.2"/>
    <rect x="0" y="0" width="594" height="3" fill="#00e5ff"/>

    <!-- Terminal Header Prompt -->
    <g transform="translate(22, 26)" class="mono" font-size="11">
      <text x="0" y="0" font-weight="bold" fill="#00ff66">jhon.moreno</text>
      <text x="78" y="0" fill="#64748b">@</text>
      <text x="88" y="0" font-weight="bold" fill="#00e5ff">secdev-workstation</text>
      <text x="236" y="0" font-size="9" fill="#475569">──────────────────────────────────────────</text>

      <!-- Tree-Structured Fastfetch Output -->
      <text x="0" y="24" fill="#334155">┌──</text>
      <text x="28" y="24" font-weight="bold" fill="#00ff66">OS_KERNEL</text>
      <text x="114" y="24" fill="#64748b">::</text>
      <text x="132" y="24" fill="#e2e8f0">Linux 6.8-Hardened x86_64 // Docker Multi-Stage (UID 10001)</text>

      <text x="0" y="46" fill="#334155">├──</text>
      <text x="28" y="46" font-weight="bold" fill="#ffaa00">ROLE_SPEC</text>
      <text x="114" y="46" fill="#64748b">::</text>
      <text x="132" y="46" fill="#e2e8f0">Ingeniero Backend, Arquitectura de Datos &amp; Ciberseguridad</text>

      <text x="0" y="68" fill="#334155">├──</text>
      <text x="28" y="68" font-weight="bold" fill="#00e5ff">LANGUAGES</text>
      <text x="114" y="68" fill="#64748b">::</text>
      <text x="132" y="68" fill="#e2e8f0">TypeScript 5.3 · JavaScript ES6+ · Java 21 · C# 12 · Python 3.12</text>

      <text x="0" y="90" fill="#334155">├──</text>
      <text x="28" y="90" font-weight="bold" fill="#c084fc">RUNTIMES</text>
      <text x="114" y="90" fill="#64748b">::</text>
      <text x="132" y="90" fill="#e2e8f0">Fastify 4.26 · Spring Boot · Express · FastAPI · .NET 10 GDI+</text>

      <text x="0" y="112" fill="#334155">├──</text>
      <text x="28" y="112" font-weight="bold" fill="#00ff66">DATABASES</text>
      <text x="114" y="112" fill="#64748b">::</text>
      <text x="132" y="112" fill="#e2e8f0">PostgreSQL 16/17 (ACID / pg-mem) · MySQL · MongoDB v6 · Redis</text>

      <text x="0" y="134" fill="#334155">├──</text>
      <text x="28" y="134" font-weight="bold" fill="#ff2a5f">SEC_AUDIT</text>
      <text x="114" y="134" fill="#64748b">::</text>
      <text x="132" y="134" fill="#e2e8f0">Qwen 2.5 Coder 7B SAST · OWASP ASVS · HMAC-SHA256 · OAuth2</text>

      <text x="0" y="156" fill="#334155">└──</text>
      <text x="28" y="156" font-weight="bold" fill="#00e5ff">EDUCATION</text>
      <text x="114" y="156" fill="#64748b">::</text>
      <text x="132" y="156" fill="#e2e8f0">SENA — Tecnólogo ADSO // Medellín, Colombia (UTC-5)</text>

      <!-- Authentic Terminal Color Palette Bar -->
      <g transform="translate(0, 172)">
        <text x="0" y="12" font-size="9.5" font-weight="bold" fill="#64748b">PALETTE ::</text>
        <rect x="74" y="2" width="22" height="12" rx="2" fill="#00ff66"/>
        <rect x="102" y="2" width="22" height="12" rx="2" fill="#00e5ff"/>
        <rect x="130" y="2" width="22" height="12" rx="2" fill="#ffaa00"/>
        <rect x="158" y="2" width="22" height="12" rx="2" fill="#ff2a5f"/>
        <rect x="186" y="2" width="22" height="12" rx="2" fill="#c084fc"/>
        <rect x="214" y="2" width="22" height="12" rx="2" fill="#38bdf8"/>
        <rect x="242" y="2" width="22" height="12" rx="2" fill="#f8fafc"/>
        <rect x="270" y="2" width="22" height="12" rx="2" fill="#1e293b"/>
      </g>

      <!-- Live Interactive Command Bar -->
      <g transform="translate(0, 198)">
        <rect x="0" y="0" width="564" height="54" fill="#020408" stroke="#162232" stroke-width="1"/>
        <rect x="0" y="0" width="3" height="54" fill="#00ff66"/>
        <text x="12" y="20" font-size="10.5" font-weight="bold" fill="#00ff66">root@secdev:~#</text>
        <text x="110" y="20" font-size="10.5" fill="#f8fafc" class="c-line-1">
          secdev --verify-fleet --sast qwen2.5:7b --crypto sha256
        </text>
        <text x="12" y="40" font-size="10" fill="#8ca0ba" class="c-line-2">
          <tspan fill="#00ff66" font-weight="bold">[PASS]</tspan> 09 REPOS VERIFICADOS · <tspan fill="#00e5ff">56 TESTS</tspan> · <tspan fill="#ffaa00">OWASP ASVS</tspan> · <tspan fill="#00ff66">0 CVEs CRITICOS</tspan>
        </text>
        <rect x="544" y="9" width="7" height="13" fill="#00ff66" class="cur-blk"/>
      </g>
    </g>
  </g>
</svg>
