<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 348" width="100%" height="348">
  <defs>
    <!-- Tactical Obsidian Base -->
    <linearGradient id="secOsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03070b"/>
      <stop offset="50%" stop-color="#061019"/>
      <stop offset="100%" stop-color="#020508"/>
    </linearGradient>

    <radialGradient id="secOrbLeft" cx="18%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#03070b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="secOrbRight" cx="82%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#03070b" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="secPanel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1722" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#050c13" stop-opacity="0.94"/>
    </linearGradient>

    <linearGradient id="secBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00ff9d" stop-opacity="0.08"/>
    </linearGradient>

    <pattern id="secGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#00e5ff" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>

    <style>
      .mono-hdr { font-family: 'JetBrains Mono', 'Share Tech Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.7px; }
      .mono-lbl { font-family: 'JetBrains Mono', 'Share Tech Mono', 'Fira Code', Consolas, monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 0.4px; }
      .mono-cmd { font-family: 'JetBrains Mono', 'Share Tech Mono', 'Fira Code', Consolas, monospace; font-size: 11px; }
      .sans-val { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.2px; font-weight: 500; fill: #e2e8f0; }
      .disp-name { font-family: 'Orbitron', 'Rajdhani', 'Space Grotesk', 'Inter', sans-serif; font-size: 14.5px; font-weight: 800; fill: #f8fafc; letter-spacing: 0.5px; }

      @keyframes shieldScan {
        0%, 100% { transform: translateY(-28px); opacity: 0.2; }
        50% { transform: translateY(28px); opacity: 0.9; }
      }
      @keyframes cmdSeq1 {
        0%, 8% { opacity: 0; }
        15%, 92% { opacity: 1; }
        97%, 100% { opacity: 0; }
      }
      @keyframes cmdSeq2 {
        0%, 26% { opacity: 0; }
        34%, 92% { opacity: 1; }
        97%, 100% { opacity: 0; }
      }
      @keyframes pulseCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0.15; }
      }
      .bio-scan { animation: shieldScan 3.2s ease-in-out infinite; }
      .seq-1 { animation: cmdSeq1 9s ease-in-out infinite; }
      .seq-2 { animation: cmdSeq2 9s ease-in-out infinite; }
      .cur-block { animation: pulseCursor 1s infinite; }
    </style>
  </defs>

  <!-- Base Canvas & Tactical Grid -->
  <rect width="1000" height="348" rx="14" fill="url(#secOsBg)"/>
  <rect width="1000" height="348" rx="14" fill="url(#secGrid)"/>
  <rect width="1000" height="348" rx="14" fill="url(#secOrbLeft)"/>
  <rect width="1000" height="348" rx="14" fill="url(#secOrbRight)"/>

  <!-- Outer Armored Border & Corner Brackets -->
  <rect x="1.5" y="1.5" width="997" height="345" rx="13" fill="none" stroke="url(#secBorder)" stroke-width="1.3"/>
  <path d="M 14 2 L 2 2 L 2 16" fill="none" stroke="#00ff9d" stroke-width="2"/>
  <path d="M 986 2 L 998 2 L 998 16" fill="none" stroke="#00e5ff" stroke-width="2"/>
  <path d="M 14 346 L 2 346 L 2 332" fill="none" stroke="#00e5ff" stroke-width="2"/>
  <path d="M 986 346 L 998 346 L 998 332" fill="none" stroke="#00ff9d" stroke-width="2"/>

  <!-- Top Tactical Terminal Titlebar -->
  <rect x="2" y="2" width="996" height="36" rx="12" fill="#07131e" fill-opacity="0.9"/>
  <line x1="2" y1="38" x2="998" y2="38" stroke="#00ff9d" stroke-opacity="0.22" stroke-width="1"/>

  <!-- Tactical Status Indicators (Left) -->
  <g transform="translate(20, 14)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#00ff9d" fill-opacity="0.85"/>
    <rect x="16" y="0" width="10" height="10" rx="2" fill="#00e5ff" fill-opacity="0.75"/>
    <rect x="32" y="0" width="10" height="10" rx="2" fill="#1e293b" stroke="#00ff9d" stroke-opacity="0.5"/>
  </g>

  <text x="500" y="24" text-anchor="middle" class="mono-hdr" fill="#cbd5e1">
    [ SEC-OS // KERNEL v6.8-HARDENED ] :: DOSSIER CRIPTOGRAFICO &amp; ESPECIFICACIONES DE SISTEMA
  </text>
  <text x="978" y="24" text-anchor="end" class="mono-hdr" font-size="10" fill="#00ff9d">
    UID:10001 [SECURE]
  </text>

  <!-- ==================== LEFT CARD: CRYPTOGRAPHIC IDENTITY & EMBLEM ==================== -->
  <g transform="translate(20, 50)">
    <rect width="264" height="280" rx="10" fill="url(#secPanel)" stroke="url(#secBorder)" stroke-width="1"/>
    <line x1="16" y1="1" x2="160" y2="1" stroke="#00ff9d" stroke-opacity="0.65" stroke-width="1.5"/>

    <!-- Animated Vector Cyber-Shield & Rotating Cipher Ring -->
    <g transform="translate(132, 62)">
      <!-- Outer Rotating Cipher Ring -->
      <circle cx="0" cy="0" r="38" fill="none" stroke="#00e5ff" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="8 4 2 4">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      </circle>
      <!-- Counter-Rotating Inner Ring -->
      <circle cx="0" cy="0" r="31" fill="none" stroke="#00ff9d" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="12 6">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite"/>
      </circle>
      <!-- Vector Cyber Shield Polygon -->
      <polygon points="0,-24 20,-15 20,4 0,24 -20,4 -20,-15" fill="#061520" stroke="#00ff9d" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" class="disp-name" font-size="14" fill="#00ff9d">JM</text>
      <!-- Biometric Laser Scan Line -->
      <g class="bio-scan">
        <line x1="-28" y1="0" x2="28" y2="0" stroke="#00e5ff" stroke-width="1.6"/>
      </g>
    </g>

    <text x="132" y="122" text-anchor="middle" class="disp-name">JHON ANDERSON MORENO</text>
    <text x="132" y="140" text-anchor="middle" class="mono-lbl" font-size="9.5" fill="#00e5ff">
      DEVSECOPS // BACKEND ARCHITECT
    </text>

    <line x1="22" y1="154" x2="242" y2="154" stroke="#1e293b" stroke-width="1"/>

    <!-- Tactical Attribute Pills -->
    <g transform="translate(20, 166)">
      <rect width="224" height="28" rx="5" fill="#040a10" stroke="#00ff9d" stroke-opacity="0.35"/>
      <rect x="0" y="0" width="3" height="28" fill="#00ff9d"/>
      <text x="14" y="18" class="mono-lbl" font-size="10" fill="#cbd5e1">
        CLEARANCE: <tspan fill="#00ff9d">SENA ADSO // NIVEL SENIOR</tspan>
      </text>
    </g>

    <g transform="translate(20, 202)">
      <rect width="224" height="28" rx="5" fill="#040a10" stroke="#00e5ff" stroke-opacity="0.35"/>
      <rect x="0" y="0" width="3" height="28" fill="#00e5ff"/>
      <text x="14" y="18" class="mono-lbl" font-size="10" fill="#cbd5e1">
        LOC_NODE: <tspan fill="#00e5ff">MEDELLIN, CO (UTC-5)</tspan>
      </text>
    </g>

    <g transform="translate(20, 238)">
      <rect width="224" height="28" rx="5" fill="#040a10" stroke="#1e293b"/>
      <text x="112" y="18" text-anchor="middle" class="mono-lbl" font-size="9.5" fill="#94a3b8">
        KERNEL: LINUX // DOCKER // ZERO-TRUST
      </text>
    </g>
  </g>

  <!-- ==================== RIGHT CARD: TACTICAL SPECIFICATION MATRIX & CLI ==================== -->
  <g transform="translate(298, 50)">
    <rect width="682" height="280" rx="10" fill="url(#secPanel)" stroke="url(#secBorder)" stroke-width="1"/>
    <line x1="20" y1="1" x2="260" y2="1" stroke="#00e5ff" stroke-opacity="0.65" stroke-width="1.5"/>

    <!-- Row 1: Arquitectura -->
    <g transform="translate(20, 26)">
      <rect x="0" y="-14" width="152" height="22" rx="4" fill="#00ff9d" fill-opacity="0.10" stroke="#00ff9d" stroke-opacity="0.35"/>
      <text x="10" y="1" class="mono-lbl" fill="#00ff9d">01 // ARQUITECTURA</text>
      <text x="168" y="1" class="sans-val">Clean Architecture, DDD, Microservicios REST &amp; Diseño Zero-Trust</text>
    </g>
    <line x1="20" y1="42" x2="662" y2="42" stroke="#1e293b" stroke-opacity="0.7"/>

    <!-- Row 2: Ciberdefensa -->
    <g transform="translate(20, 64)">
      <rect x="0" y="-14" width="152" height="22" rx="4" fill="#00e5ff" fill-opacity="0.10" stroke="#00e5ff" stroke-opacity="0.35"/>
      <text x="10" y="1" class="mono-lbl" fill="#00e5ff">02 // CIBERDEFENSA</text>
      <text x="168" y="1" class="sans-val">SAST IA (Qwen 2.5 7B), WAF L7, OWASP ASVS, Firma SHA-256 &amp; OAuth2/JWT</text>
    </g>
    <line x1="20" y1="80" x2="662" y2="80" stroke="#1e293b" stroke-opacity="0.7"/>

    <!-- Row 3: Lenguajes Core -->
    <g transform="translate(20, 102)">
      <rect x="0" y="-14" width="152" height="22" rx="4" fill="#00ff9d" fill-opacity="0.10" stroke="#00ff9d" stroke-opacity="0.35"/>
      <text x="10" y="1" class="mono-lbl" fill="#00ff9d">03 // LENGUAJES</text>
      <text x="168" y="1" class="sans-val">TypeScript 5.3, JavaScript ES6+, Python 3.12, Java 21, C# 12 (.NET 10)</text>
    </g>
    <line x1="20" y1="118" x2="662" y2="118" stroke="#1e293b" stroke-opacity="0.7"/>

    <!-- Row 4: Frameworks & Motores -->
    <g transform="translate(20, 140)">
      <rect x="0" y="-14" width="152" height="22" rx="4" fill="#00e5ff" fill-opacity="0.10" stroke="#00e5ff" stroke-opacity="0.35"/>
      <text x="10" y="1" class="mono-lbl" fill="#00e5ff">04 // FRAMEWORKS</text>
      <text x="168" y="1" class="sans-val">Fastify 4.26, Express, FastAPI, Spring Boot, React 18, Direct3D &amp; GDI+</text>
    </g>
    <line x1="20" y1="156" x2="662" y2="156" stroke="#1e293b" stroke-opacity="0.7"/>

    <!-- Row 5: Persistencia & DevSecOps -->
    <g transform="translate(20, 178)">
      <rect x="0" y="-14" width="152" height="22" rx="4" fill="#00ff9d" fill-opacity="0.10" stroke="#00ff9d" stroke-opacity="0.35"/>
      <text x="10" y="1" class="mono-lbl" fill="#00ff9d">05 // PERSISTENCIA</text>
      <text x="168" y="1" class="sans-val">PostgreSQL 16/17 (ACID &amp; B-Tree), MySQL, MongoDB v6, Redis, Docker</text>
    </g>

    <!-- Bottom Live Security Audit Command Prompt -->
    <g transform="translate(20, 204)">
      <rect width="642" height="60" rx="6" fill="#03070b" stroke="#00ff9d" stroke-opacity="0.35"/>
      <rect x="0" y="0" width="4" height="60" fill="#00e5ff"/>
      <text x="14" y="22" class="mono-cmd" fill="#00ff9d" font-weight="700">root@secdev-node:~#</text>
      <text x="150" y="22" class="mono-cmd seq-1" fill="#f1f5f9">
        secdev-audit --sast-llm qwen2.5-coder:7b --policy owasp-asvs-l2 --verify-all
      </text>
      <text x="14" y="44" class="mono-cmd seq-2" font-size="10.5" fill="#94a3b8">
        <tspan fill="#00ff9d" font-weight="700">[OK]</tspan> 09 REPOS VERIFICADOS :: <tspan fill="#00e5ff">SHA-256 INTEGRITY</tspan> :: <tspan fill="#00ff9d">56 TESTS PASSING</tspan> :: 0 CVEs CRITICOS
      </text>
      <rect x="618" y="11" width="7" height="14" fill="#00ff9d" class="cur-block"/>
    </g>
  </g>
</svg>
