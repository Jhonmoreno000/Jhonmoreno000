  <path d="M 20,6 L 242,6 L 254,14 L 846,14 L 858,6 L 1080,6 L 1094,20 L 1094,232 L 1080,246 L 20,246 L 6,232 L 6,20 Z" fill="none" stroke="#00ff88" stroke-width="1.4" stroke-opacity="0.55" class="rail"/>

