      @keyframes railCtf { to { stroke-dashoffset: -36; } }
      @keyframes blinkCtf { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.15; } }
      .rail { stroke-dasharray: 10 8; animation: railCtf 2s linear infinite; }
      .cur { animation: blinkCtf 1s infinite; }
    </style>
  </defs>

