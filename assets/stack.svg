    <text x="16" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Spring Boot / Security</text>
    <text x="198" y="68" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#c084fc">93%</text>
