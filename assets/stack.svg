    <rect x="16" y="210" width="171" height="5" rx="2.5" fill="url(#barCyan)" class="skill-bar"/>
  </g>

  <!-- ==================== COLUMN 2: FRAMEWORKS & APIS ==================== -->
  <g transform="translate(256, 62)">
    <rect x="4" y="4" width="214" height="222" rx="10" fill="#02050b" stroke="#0f172a" stroke-width="1"/>
    <rect width="214" height="222" rx="10" fill="url(#colCardBg)" stroke="#7c3aed" stroke-opacity="0.6" stroke-width="1.2"/>
    <line x1="16" y1="1" x2="198" y2="1" stroke="#c084fc" stroke-width="2.5"/>

