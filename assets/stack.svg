    <text x="16" y="24" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800" fill="#34d399">03 // PERSISTENCE</text>
    <text x="16" y="38" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b">ACID &amp; NOSQL CLUSTERS</text>
