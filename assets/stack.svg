    <text x="198" y="102" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#c084fc">95%</text>
    <rect x="16" y="108" width="182" height="5" rx="2.5" fill="#0f172a"/>
    <rect x="16" y="108" width="173" height="5" rx="2.5" fill="url(#barPurple)" class="skill-bar">
      <animate attributeName="width" values="20;173;173" keyTimes="0;0.28;1" dur="5.2s" repeatCount="indefinite"/>
    </rect>

    <!-- Item 3 -->
    <text x="16" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Node.js / Express REST</text>
    <text x="198" y="136" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#c084fc">91%</text>
    <rect x="16" y="142" width="182" height="5" rx="2.5" fill="#0f172a"/>
    <rect x="16" y="142" width="165" height="5" rx="2.5" fill="url(#barPurple)" class="skill-bar"/>

    <!-- Item 4 -->
    <text x="16" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">React 18 / Vite / Tailwind</text>
    <text x="198" y="170" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#c084fc">88%</text>
    <rect x="16" y="176" width="182" height="5" rx="2.5" fill="#0f172a"/>
    <rect x="16" y="176" width="160" height="5" rx="2.5" fill="url(#barPurple)" class="skill-bar"/>

    <!-- Item 5 -->
    <text x="16" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">OpenAPI / JWT / OAuth2</text>
    <text x="198" y="204" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#c084fc">94%</text>
