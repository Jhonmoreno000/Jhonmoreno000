    <text x="198" y="170" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#34d399">87%</text>
    <rect x="16" y="176" width="182" height="5" rx="2.5" fill="#0f172a"/>
    <rect x="16" y="176" width="158" height="5" rx="2.5" fill="url(#barEmerald)" class="skill-bar"/>

