<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 305" width="100%" height="305">
  <defs>
    <linearGradient id="stackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040812"/>
      <stop offset="50%" stop-color="#081020"/>
      <stop offset="100%" stop-color="#04070e"/>
    </linearGradient>

    <linearGradient id="colCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1426"/>
      <stop offset="100%" stop-color="#060b14"/>
    </linearGradient>

    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <linearGradient id="barPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="barEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="barAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <pattern id="stackGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" fill-opacity="0.12"/>
    </pattern>

    <path id="busPath" d="M 35 45 L 925 45"/>

    <style>
      @keyframes floatIcon {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes barPulse {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; }
      }
      @keyframes busDash {
        to { stroke-dashoffset: -32; }
      }
      .float-3d-1 { animation: floatIcon 3.4s ease-in-out infinite; }
      .float-3d-2 { animation: floatIcon 3.8s ease-in-out infinite 0.4s; }
      .float-3d-3 { animation: floatIcon 4.2s ease-in-out infinite 0.8s; }
      .float-3d-4 { animation: floatIcon 3.6s ease-in-out infinite 1.2s; }
      .skill-bar { animation: barPulse 2.5s ease-in-out infinite; }
      .bus-line { stroke-dasharray: 8 8; animation: busDash 1.5s linear infinite; }
    </style>
  </defs>

  <!-- Main Container -->
  <rect width="960" height="305" rx="14" fill="url(#stackBg)"/>
  <rect width="960" height="305" rx="14" fill="url(#stackGrid)"/>
  <rect x="1" y="1" width="958" height="303" rx="13" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Bar -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" letter-spacing="1.2">
    <circle cx="32" cy="24" r="4" fill="#00f2fe">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="44" y="28" fill="#e2e8f0" font-weight="700">3D ARCHITECTURE // PRODUCTION TECH STACK MATRIX</text>
    <text x="932" y="28" text-anchor="end" fill="#38bdf8" font-weight="700">TELEMETRY: VERIFIED</text>
  </g>

  <!-- Animated Data Bus Line -->
  <line x1="28" y1="45" x2="932" y2="45" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="28" y1="45" x2="932" y2="45" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" class="bus-line"/>
  <circle r="3" fill="#00f2fe">
    <animateMotion dur="4.5s" repeatCount="indefinite">
      <mpath href="#busPath"/>
    </animateMotion>
  </circle>
  <circle r="3" fill="#c084fc">
    <animateMotion dur="4.5s" begin="2.25s" repeatCount="indefinite">
      <mpath href="#busPath"/>
    </animateMotion>
  </circle>

  <!-- ==================== COLUMN 1: CORE LANGUAGES ==================== -->
  <g transform="translate(24, 62)">
    <!-- 3D Isometric Depth Shadow -->
    <rect x="4" y="4" width="214" height="222" rx="10" fill="#02050b" stroke="#0f172a" stroke-width="1"/>
    <!-- Card Body -->
    <rect width="214" height="222" rx="10" fill="url(#colCardBg)" stroke="#0284c7" stroke-opacity="0.6" stroke-width="1.2"/>
    <line x1="16" y1="1" x2="198" y2="1" stroke="#00f2fe" stroke-width="2.5"/>

    <!-- Floating 3D Isometric Cube Icon -->
    <g class="float-3d-1" transform="translate(178, 24)">
      <polygon points="0,-12 16,-4 0,4 -16,-4" fill="#38bdf8"/>
      <polygon points="-16,-4 0,4 0,20 -16,12" fill="#0284c7"/>
      <polygon points="16,-4 0,4 0,20 16,12" fill="#0369a1"/>
    </g>

    <text x="16" y="24" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800" fill="#38bdf8">01 // LANGUAGES</text>
    <text x="16" y="38" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b">TYPED &amp; MULTI-PARADIGM</text>
    <line x1="16" y1="48" x2="198" y2="48" stroke="#1e293b" stroke-width="1"/>

    <!-- Item 1 -->
    <text x="16" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Python 3.x (Core / Async)</text>
    <text x="198" y="68" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38bdf8">95%</text>
    <rect x="16" y="74" width="182" height="5" rx="2.5" fill="#0f172a"/>
    <rect x="16" y="74" width="173" height="5" rx="2.5" fill="url(#barCyan)" class="skill-bar">
      <animate attributeName="width" values="20;173;173" keyTimes="0;0.25;1" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- Item 2 -->
    <text x="16" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Java (SE / OpenJDK 21)</text>
    <text x="198" y="102" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38bdf8">92%</text>
    <rect x="16" y="108" width="182" height="5" rx="2.5" fill="#0f172a"/>
    <rect x="16" y="108" width="167" height="5" rx="2.5" fill="url(#barCyan)" class="skill-bar">
      <animate attributeName="width" values="20;167;167" keyTimes="0;0.28;1" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- Item 3 -->
    <text x="16" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">C# (.NET Core / Enterprise)</text>
    <text x="198" y="136" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38bdf8">88%</text>
    <rect x="16" y="142" width="182" height="5" rx="2.5" fill="#0f172a"/>
    <rect x="16" y="142" width="160" height="5" rx="2.5" fill="url(#barCyan)" class="skill-bar">
      <animate attributeName="width" values="20;160;160" keyTimes="0;0.31;1" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- Item 4 -->
    <text x="16" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">TypeScript / JavaScript</text>
    <text x="198" y="170" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38bdf8">90%</text>
    <rect x="16" y="176" width="182" height="5" rx="2.5" fill="#0f172a"/>
    <rect x="16" y="176" width="164" height="5" rx="2.5" fill="url(#barCyan)" class="skill-bar"/>

    <!-- Item 5 -->
    <text x="16" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">SQL (Procedural / ANSI)</text>
    <text x="198" y="204" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38bdf8">94%</text>
