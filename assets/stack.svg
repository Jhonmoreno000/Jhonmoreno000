    <!-- Item 1 -->
    <text x="16" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">PostgreSQL (Indexing/ACID)</text>
