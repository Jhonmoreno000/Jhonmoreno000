  <!-- ==================== COLUMN 3: DATA ARCHITECTURE ==================== -->
  <g transform="translate(488, 62)">
    <rect x="4" y="4" width="214" height="222" rx="10" fill="#02050b" stroke="#0f172a" stroke-width="1"/>
    <rect width="214" height="222" rx="10" fill="url(#colCardBg)" stroke="#059669" stroke-opacity="0.6" stroke-width="1.2"/>
    <line x1="16" y1="1" x2="198" y2="1" stroke="#34d399" stroke-width="2.5"/>

    <!-- Floating 3D Isometric Database Cylinder Icon -->
    <g class="float-3d-3" transform="translate(178, 22)">
      <ellipse cx="0" cy="-6" rx="14" ry="6" fill="#34d399"/>
      <path d="M -14 -6 L -14 4 A 14 6 0 0 0 14 4 L 14 -6 Z" fill="#059669"/>
      <ellipse cx="0" cy="-6" rx="14" ry="6" fill="#6ee7b7" fill-opacity="0.6"/>
      <path d="M -14 6 L -14 16 A 14 6 0 0 0 14 16 L 14 6 Z" fill="#047857"/>
