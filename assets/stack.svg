    <rect x="16" y="74" width="169" height="5" rx="2.5" fill="url(#barPurple)" class="skill-bar">
      <animate attributeName="width" values="20;169;169" keyTimes="0;0.25;1" dur="5.2s" repeatCount="indefinite"/>
