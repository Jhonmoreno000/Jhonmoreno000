<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 345" width="100%" height="345">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03070b"/>
      <stop offset="50%" stop-color="#061019"/>
      <stop offset="100%" stop-color="#020508"/>
    </linearGradient>

    <radialGradient id="tOrbL" cx="24%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#03070b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="tOrbR" cx="78%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#03070b" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="tPane" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1722" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#040b11" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="tBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00ff9d" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="scanProg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <pattern id="termGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#00e5ff" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>

    <style>
      .hud-mono { font-family: 'JetBrains Mono', 'Share Tech Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
      .hud-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

      @keyframes step1 { 0%, 4% { opacity: 0; } 9%, 93% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes step2 { 0%, 14% { opacity: 0; } 21%, 93% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes step3 { 0%, 27% { opacity: 0; } 34%, 93% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes step4 { 0%, 41% { opacity: 0; } 49%, 93% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes step5 { 0%, 55% { opacity: 0; } 63%, 93% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes step6 { 0%, 69% { opacity: 0; } 77%, 93% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes blinkCur { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.15; } }
      @keyframes topoFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
      @keyframes pktDash { to { stroke-dashoffset: -16; } }

      .t-s1 { animation: step1 11s infinite; }
      .t-s2 { animation: step2 11s infinite; }
      .t-s3 { animation: step3 11s infinite; }
      .t-s4 { animation: step4 11s infinite; }
      .t-s5 { animation: step5 11s infinite; }
      .t-s6 { animation: step6 11s infinite; }
      .t-cur { animation: blinkCur 1s infinite; }
      .topo-hover { animation: topoFloat 3.6s ease-in-out infinite; }
      .topo-link { stroke-dasharray: 4 4; animation: pktDash 1.2s linear infinite; }
    </style>
  </defs>

  <!-- Outer Canvas & Grid -->
  <rect width="1000" height="345" rx="14" fill="url(#termBg)"/>
  <rect width="1000" height="345" rx="14" fill="url(#termGrid)"/>
  <rect width="1000" height="345" rx="14" fill="url(#tOrbL)"/>
  <rect width="1000" height="345" rx="14" fill="url(#tOrbR)"/>

  <!-- Armored Outer Frame & Corner Reticles -->
  <rect x="1.5" y="1.5" width="997" height="342" rx="13" fill="none" stroke="url(#tBorder)" stroke-width="1.3"/>
  <path d="M 14 2 L 2 2 L 2 16" fill="none" stroke="#00ff9d" stroke-width="2"/>
  <path d="M 986 2 L 998 2 L 998 16" fill="none" stroke="#00e5ff" stroke-width="2"/>
  <path d="M 14 343 L 2 343 L 2 329" fill="none" stroke="#00e5ff" stroke-width="2"/>
  <path d="M 986 343 L 998 343 L 998 329" fill="none" stroke="#00ff9d" stroke-width="2"/>

  <!-- Top Tactical Chrome Bar -->
  <rect x="2" y="2" width="996" height="40" rx="12" fill="#07131e" fill-opacity="0.9"/>
  <line x1="2" y1="42" x2="998" y2="42" stroke="#00ff9d" stroke-opacity="0.22" stroke-width="1"/>

  <g transform="translate(20, 16)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#00ff9d"/>
    <rect x="16" y="0" width="10" height="10" rx="2" fill="#00e5ff"/>
    <rect x="32" y="0" width="10" height="10" rx="2" fill="#1e293b" stroke="#00ff9d" stroke-opacity="0.5"/>
  </g>

  <!-- Tactical Console Tabs -->
  <g class="hud-mono" font-size="10.5" font-weight="700">
    <rect x="82" y="9" width="256" height="24" rx="5" fill="#0d2232" stroke="#00ff9d" stroke-opacity="0.45"/>
    <circle cx="96" cy="21" r="3" fill="#00ff9d"/>
    <text x="106" y="25" fill="#f1f5f9">01 // SECDEV SAST-AI &amp; HARDENING</text>

    <rect x="348" y="9" width="268" height="24" rx="5" fill="#071520" stroke="#00e5ff" stroke-opacity="0.35"/>
    <circle cx="362" cy="21" r="3" fill="#00e5ff"/>
    <text x="372" y="25" fill="#cbd5e1">02 // SIEM WAF &amp; POSTGRESQL ACID</text>

    <text x="976" y="25" text-anchor="end" font-size="10" fill="#00ff9d">SOC SPLIT-PANE // LIVE</text>
  </g>

  <!-- ==================== LEFT PANE: DOCKER HARDENING & SAST IA ==================== -->
  <g transform="translate(20, 54)">
    <rect width="470" height="272" rx="10" fill="url(#tPane)" stroke="url(#tBorder)" stroke-width="1"/>
    <line x1="16" y1="1" x2="230" y2="1" stroke="#00ff9d" stroke-opacity="0.65" stroke-width="1.5"/>

    <text x="18" y="23" class="hud-mono" font-size="11" font-weight="700" fill="#00ff9d">
      [ PANE 01 // CONTENEDORES NON-ROOT &amp; AUDITORIA SAST IA ]
    </text>
    <text x="452" y="23" text-anchor="end" class="hud-mono" font-size="9.5" fill="#94a3b8">QWEN 2.5 7B</text>
    <line x1="18" y1="32" x2="452" y2="32" stroke="#1e293b" stroke-width="1"/>

    <g class="hud-mono" font-size="10">
      <!-- Step 1 -->
      <g class="t-s1">
        <text x="18" y="52" fill="#00ff9d" font-weight="700">secdev@build:~#</text>
        <text x="118" y="52" fill="#f1f5f9">docker build --target distroless -t core:sec .</text>
      </g>

      <!-- Step 2 -->
      <g class="t-s2" font-size="9.5">
        <text x="18" y="72" fill="#94a3b8">&gt;&gt; [STAGE 1/2] Compilacion aislada :: Hash de dependencias verificado</text>
        <text x="18" y="88" fill="#cbd5e1">&gt;&gt; [STAGE 2/2] Runtime endurecido :: UID 10001 (non-root) · 34.2 MB</text>
      </g>

      <!-- Step 3 -->
      <g class="t-s3">
        <text x="18" y="114" fill="#00e5ff" font-weight="700">secdev@audit:~#</text>
        <text x="118" y="114" fill="#f1f5f9">secdev scan --sast --llm qwen2.5:7b --asvs</text>
      </g>

      <!-- Step 4 -->
      <g class="t-s4" font-size="9.5">
        <text x="18" y="134" fill="#94a3b8">&gt;&gt; Ejecutando AST Semgrep + Bandit + OWASP ASVS L2...</text>
        <text x="18" y="150" fill="#cbd5e1">&gt;&gt; Deduplicacion SHA-256 completada :: 50 rutas &amp; DAOs auditados</text>
      </g>

      <!-- Step 5 -->
      <g class="t-s5">
        <rect x="18" y="166" width="434" height="8" rx="3" fill="#03070b" stroke="#1e293b"/>
        <rect x="18" y="166" width="434" height="8" rx="3" fill="url(#scanProg)">
          <animate attributeName="width" values="14;434;434" keyTimes="0;0.55;1" dur="11s" repeatCount="indefinite"/>
        </rect>
        <text x="18" y="193" font-size="10" font-weight="700" fill="#00ff9d">
          [OK] AUDITORIA COMPLETADA: 0 CVEs CRITICOS // SHIFT-LEFT VERIFIED
        </text>
      </g>

      <!-- Step 6 -->
      <g class="t-s6">
        <rect x="18" y="210" width="434" height="42" rx="6" fill="#040d14" stroke="#00ff9d" stroke-opacity="0.45"/>
        <rect x="18" y="210" width="4" height="42" fill="#00ff9d"/>
        <text x="32" y="228" font-size="10" font-weight="700" fill="#f1f5f9">
          ESTADO: DESPLIEGUE AUTORIZADO EN CLUSTER ZERO-TRUST <tspan fill="#00ff9d">[200 OK]</tspan>
        </text>
        <text x="32" y="243" font-size="9" fill="#00e5ff">
          SIGNATURE: SHA256:4B8E9C1A7F20...E9103D [IMMUTABLE ARTIFACT]
        </text>
        <rect x="434" y="222" width="6" height="14" fill="#00ff9d" class="t-cur"/>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT PANE: SIEM TELEMETRY & SQL ACID ENGINE ==================== -->
  <g transform="translate(510, 54)">
    <rect width="470" height="272" rx="10" fill="url(#tPane)" stroke="url(#tBorder)" stroke-width="1"/>
    <line x1="16" y1="1" x2="230" y2="1" stroke="#00e5ff" stroke-opacity="0.65" stroke-width="1.5"/>

    <text x="18" y="23" class="hud-mono" font-size="11" font-weight="700" fill="#00e5ff">
      [ PANE 02 // TELEMETRIA SIEM, WAF &amp; MOTOR POSTGRESQL ]
    </text>
    <text x="452" y="23" text-anchor="end" class="hud-mono" font-size="9.5" fill="#94a3b8">NEXUS · PG 16/17</text>
    <line x1="18" y1="32" x2="452" y2="32" stroke="#1e293b" stroke-width="1"/>

    <g class="hud-mono" font-size="10">
      <!-- Step 1: SQL & Security Audit Query -->
      <g class="t-s1">
        <text x="18" y="52" fill="#00e5ff" font-weight="700">pg17-sec=#</text>
        <text x="88" y="52" fill="#00ff9d">EXPLAIN (ANALYZE, BUFFERS)</text>
        <text x="18" y="68" fill="#f1f5f9">SELECT tx_id, sha256_sig, status FROM eventos_pago_wompi</text>
        <text x="18" y="84" fill="#f1f5f9">WHERE hmac_verified = TRUE FOR UPDATE NOWAIT;</text>
      </g>

      <!-- Step 3: Execution Plan -->
      <g class="t-s3" font-size="9.5">
        <text x="18" y="108" fill="#e2e8f0" font-weight="700">Index Scan using idx_wompi_hmac_btree (cost=0.14..4.18 rows=1)</text>
        <text x="26" y="124" fill="#00ff9d">+-- Lock Mode: FOR UPDATE NOWAIT :: 0 Deadlocks Detectados</text>
        <text x="26" y="140" fill="#00e5ff">+-- Index Cond: (hmac_verified = true) :: Time: 0.24 ms</text>
      </g>

      <!-- Step 5: SIEM & ACID Telemetry Box -->
      <g class="t-s5" font-size="9.5">
        <rect x="18" y="156" width="282" height="96" rx="6" fill="#03070b" stroke="#00e5ff" stroke-opacity="0.35"/>
        <text x="28" y="176" fill="#94a3b8">WAF / RATE LIMIT : <tspan fill="#00ff9d" font-weight="700">1200 req/min IP [ACTIVE]</tspan></text>
        <text x="28" y="194" fill="#94a3b8">WEBHOOK CRYPTO   : <tspan fill="#00e5ff" font-weight="700">SHA-256 VERIFIED [100%]</tspan></text>
        <text x="28" y="212" fill="#94a3b8">SHARED BUFFERS   : <tspan fill="#f1f5f9">hit=18 read=0 (0.24 ms)</tspan></text>
        <text x="28" y="230" fill="#94a3b8">AISLAMIENTO ACID : <tspan fill="#00ff9d">SERIALIZABLE // SAFE</tspan></text>
        <text x="28" y="245" fill="#64748b">SSO OIDC TOKENS  : <tspan fill="#00e5ff">GOOGLE &amp; MICROSOFT CERT</tspan></text>
      </g>
    </g>

    <!-- Animated Cyber-Defense & B-Tree Topology Node Graph (Bottom-Right) -->
    <g transform="translate(378, 198)">
      <g class="topo-hover">
        <line x1="0" y1="-20" x2="-36" y2="18" stroke="#00ff9d" stroke-width="1.4" class="topo-link"/>
        <line x1="0" y1="-20" x2="36" y2="18" stroke="#00e5ff" stroke-width="1.4" class="topo-link"/>

        <!-- Root Node: WAF / API Gateway -->
        <rect x="-34" y="-36" width="68" height="22" rx="4" fill="#061824" stroke="#00ff9d" stroke-width="1.2"/>
        <text x="0" y="-22" text-anchor="middle" class="hud-mono" font-size="8.5" font-weight="700" fill="#00ff9d">WAF // API</text>

        <!-- Left Node: SHA-256 -->
        <rect x="-66" y="14" width="58" height="20" rx="4" fill="#061824" stroke="#00ff9d" stroke-opacity="0.7"/>
        <text x="-37" y="27" text-anchor="middle" class="hud-mono" font-size="8" font-weight="700" fill="#e2e8f0">SHA-256</text>

        <!-- Right Node: PG-ACID -->
        <rect x="8" y="14" width="58" height="20" rx="4" fill="#061824" stroke="#00e5ff" stroke-opacity="0.7"/>
        <text x="37" y="27" text-anchor="middle" class="hud-mono" font-size="8" font-weight="700" fill="#00e5ff">PG-ACID</text>

        <text x="0" y="50" text-anchor="middle" class="hud-mono" font-size="8.5" font-weight="600" fill="#94a3b8">
          ZERO-TRUST TREE
        </text>
      </g>
    </g>
  </g>
</svg>
