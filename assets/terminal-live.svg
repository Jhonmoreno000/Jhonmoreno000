<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="100%" height="330">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03060c"/>
      <stop offset="50%" stop-color="#060d1b"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <linearGradient id="paneBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070e1c"/>
      <stop offset="100%" stop-color="#040811"/>
    </linearGradient>

    <linearGradient id="progGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <style>
      @keyframes step1 { 0%, 5% { opacity: 0; } 10%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes step2 { 0%, 15% { opacity: 0; } 22%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes step3 { 0%, 28% { opacity: 0; } 35%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes step4 { 0%, 42% { opacity: 0; } 50%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes step5 { 0%, 56% { opacity: 0; } 64%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes step6 { 0%, 70% { opacity: 0; } 78%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes blinkTerm { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes floatTree { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }

      .t-s1 { animation: step1 11s infinite; }
      .t-s2 { animation: step2 11s infinite; }
      .t-s3 { animation: step3 11s infinite; }
      .t-s4 { animation: step4 11s infinite; }
      .t-s5 { animation: step5 11s infinite; }
      .t-s6 { animation: step6 11s infinite; }
      .t-cur { animation: blinkTerm 1s infinite; }
      .btree-3d { animation: floatTree 3.4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Outer 3D Shadow & Window Frame -->
  <rect width="960" height="330" rx="14" fill="url(#termBg)"/>
  <rect x="1" y="1" width="958" height="328" rx="13" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Terminal Chrome Bar (tmux / Warp style) -->
  <rect x="2" y="2" width="956" height="40" rx="12" fill="#060c18"/>
  <line x1="2" y1="42" x2="958" y2="42" stroke="#1e293b" stroke-width="1"/>

  <circle cx="28" cy="22" r="5" fill="#ef4444"/>
  <circle cx="44" cy="22" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="22" r="5" fill="#10b981"/>

  <!-- Tmux Session Tabs -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10">
    <rect x="86" y="10" width="210" height="24" rx="5" fill="#0c1930" stroke="#00f2fe" stroke-width="1"/>
    <text x="191" y="25.5" text-anchor="middle" fill="#00f2fe" font-weight="700">[0: devsecops-ci-audit*]</text>

    <rect x="304" y="10" width="205" height="24" rx="5" fill="#130d26" stroke="#c084fc" stroke-width="1"/>
    <text x="406.5" y="25.5" text-anchor="middle" fill="#c084fc" font-weight="700">[1: nexus-sql-explain]</text>

    <text x="932" y="25.5" text-anchor="end" fill="#10b981" font-weight="700">● TMUX SPLIT-3D // zsh</text>
  </g>

  <!-- ==================== LEFT PANE: DOCKER & AI SAST EXECUTION ==================== -->
  <g transform="translate(20, 54)">
    <rect width="452" height="256" rx="10" fill="url(#paneBg)" stroke="#1e293b" stroke-width="1.2"/>
    <line x1="14" y1="1" x2="220" y2="1" stroke="#00f2fe" stroke-width="2"/>

    <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5">
      <!-- Header -->
      <text x="16" y="22" fill="#38bdf8" font-weight="800">// PANE 01: CONTAINER &amp; AI SAST ORCHESTRATION</text>
      <line x1="16" y1="30" x2="436" y2="30" stroke="#1e293b" stroke-width="1"/>

      <!-- Step 1: Docker Multi-stage command -->
      <g class="t-s1">
        <text x="16" y="50" fill="#10b981" font-weight="700">jam@medellin</text>
        <text x="102" y="50" fill="#cbd5e1">:</text>
        <text x="110" y="50" fill="#38bdf8">~/api</text>
        <text x="148" y="50" fill="#f8fafc">$ docker build --target prod -t core:2.6 .</text>
      </g>

      <!-- Step 2: Docker build output -->
      <g class="t-s2" font-size="10">
        <text x="16" y="70" fill="#94a3b8">[+] Stage 1/2 (builder): Maven / Poetry deps cached (0.4s)</text>
        <text x="16" y="86" fill="#34d399">[+] Stage 2/2 (distroless): Non-root UID 10001 · Image 38.4MB</text>
      </g>

      <!-- Step 3: AI Security Orchestrator command -->
      <g class="t-s3">
        <text x="16" y="112" fill="#10b981" font-weight="700">jam@medellin</text>
        <text x="102" y="112" fill="#cbd5e1">:</text>
        <text x="110" y="112" fill="#c084fc">~/sec</text>
        <text x="148" y="112" fill="#f8fafc">$ ai-sec scan --sast --llm ollama:qwen2.5</text>
      </g>

      <!-- Step 4: SAST Output -->
      <g class="t-s4" font-size="10">
        <text x="16" y="132" fill="#c084fc">[SAST] Running Semgrep + Bandit + OWASP Dependency Check...</text>
        <text x="16" y="148" fill="#38bdf8">[HASH] SHA-256 Deduplication complete · 42 endpoints audited</text>
      </g>

      <!-- Step 5: Progress Bar & AI Verdict -->
      <g class="t-s5">
        <rect x="16" y="164" width="420" height="10" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <rect x="16" y="164" width="420" height="10" rx="5" fill="url(#progGrad)">
          <animate attributeName="width" values="10;420;420" keyTimes="0;0.55;1" dur="11s" repeatCount="indefinite"/>
        </rect>
        <text x="16" y="192" font-size="10" fill="#10b981" font-weight="700">&#10004; VULNERABILITIES: 0 CRITICAL | 0 HIGH | SHIFT-LEFT PASSED</text>
      </g>

      <!-- Step 6: Final Status Box -->
      <g class="t-s6">
        <rect x="16" y="206" width="420" height="34" rx="6" fill="#041814" stroke="#10b981" stroke-width="1"/>
        <text x="28" y="227" font-size="10.5" fill="#34d399" font-weight="800">STATUS: DEPLOYED TO PRODUCTION CLUSTER [200 OK]</text>
        <rect x="392" y="216" width="7" height="13" fill="#34d399" class="t-cur"/>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT PANE: NEXUS SQL EXPLAIN & 3D B-TREE ==================== -->
  <g transform="translate(488, 54)">
    <rect width="452" height="256" rx="10" fill="url(#paneBg)" stroke="#1e293b" stroke-width="1.2"/>
    <line x1="14" y1="1" x2="220" y2="1" stroke="#c084fc" stroke-width="2"/>

    <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5">
      <text x="16" y="22" fill="#c084fc" font-weight="800">// PANE 02: NEXUS SQL ENGINE // EXPLAIN ANALYZE</text>
      <line x1="16" y1="30" x2="436" y2="30" stroke="#1e293b" stroke-width="1"/>

      <!-- Step 1: SQL Query -->
      <g class="t-s1">
        <text x="16" y="50" fill="#fbbf24" font-weight="700">postgres=#</text>
        <text x="90" y="50" fill="#00f2fe" font-weight="700">EXPLAIN (ANALYZE, BUFFERS)</text>
        <text x="16" y="66" fill="#f8fafc">SELECT o.id, u.email, o.total FROM orders o</text>
        <text x="16" y="82" fill="#f8fafc">INNER JOIN users u ON o.user_id = u.id WHERE o.state = 'PAID';</text>
      </g>

      <!-- Step 3: Execution Plan Tree -->
      <g class="t-s3" font-size="10">
        <text x="16" y="108" fill="#38bdf8" font-weight="700">Nested Loop Inner Join (cost=0.58..16.62 rows=1 width=48)</text>
        <text x="26" y="124" fill="#34d399">&#9500;&#9472;&gt; Index Scan using idx_orders_state_btree (0.18 ms)</text>
        <text x="26" y="140" fill="#c084fc">&#9492;&#9472;&gt; Index Scan using pk_users_id on users u (0.11 ms)</text>
      </g>

      <!-- Step 5: Performance Telemetry Table -->
      <g class="t-s5" font-size="10">
        <rect x="16" y="156" width="275" height="84" rx="6" fill="#060c1a" stroke="#1e293b" stroke-width="1"/>
        <text x="28" y="176" fill="#94a3b8">Planning Time    : <tspan fill="#38bdf8" font-weight="700">0.09 ms</tspan></text>
        <text x="28" y="194" fill="#94a3b8">Execution Time   : <tspan fill="#34d399" font-weight="700">0.29 ms (B-Tree Hit)</tspan></text>
        <text x="28" y="212" fill="#94a3b8">Shared Buffers   : <tspan fill="#fbbf24" font-weight="700">hit=12 read=0 (100%)</tspan></text>
        <text x="28" y="230" fill="#94a3b8">ACID Isolation   : <tspan fill="#c084fc" font-weight="700">READ COMMITTED</tspan></text>
      </g>
    </g>

    <!-- 3D Isometric B-Tree Index Visualizer on Bottom Right of Pane 2 -->
    <g class="btree-3d" transform="translate(366, 188)">
      <!-- Connecting edges from Root Cube to Child Cubes -->
      <line x1="0" y1="-12" x2="-34" y2="22" stroke="#00f2fe" stroke-width="1.5"/>
      <line x1="0" y1="-12" x2="34" y2="22" stroke="#c084fc" stroke-width="1.5"/>

      <!-- Root B-Tree 3D Cube -->
      <polygon points="0,-32 22,-21 0,-10 -22,-21" fill="#00f2fe"/>
      <polygon points="-22,-21 0,-10 0,6 -22,-5" fill="#0284c7"/>
      <polygon points="22,-21 0,-10 0,6 22,-5" fill="#0369a1"/>
      <text x="0" y="-18" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="800" fill="#030712">ROOT</text>

      <!-- Left Child B-Tree 3D Cube -->
      <g transform="translate(-34, 26)">
        <polygon points="0,-14 16,-6 0,2 -16,-6" fill="#34d399"/>
        <polygon points="-16,-6 0,2 0,14 -16,6" fill="#059669"/>
        <polygon points="16,-6 0,2 0,14 16,6" fill="#047857"/>
      </g>

      <!-- Right Child B-Tree 3D Cube -->
      <g transform="translate(34, 26)">
        <polygon points="0,-14 16,-6 0,2 -16,-6" fill="#c084fc"/>
        <polygon points="-16,-6 0,2 0,14 -16,6" fill="#7c3aed"/>
        <polygon points="16,-6 0,2 0,14 16,6" fill="#5b21b6"/>
      </g>

      <text x="0" y="52" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#38bdf8">3D B-TREE INDEX</text>
    </g>
  </g>
</svg>
