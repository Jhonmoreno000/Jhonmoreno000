<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="100%" height="330">
  <defs>
    <!-- 60% Dominant Base: Deep Warm Slate -->
    <linearGradient id="termBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1017"/>
      <stop offset="50%" stop-color="#111622"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>

    <!-- Soft Ambient Light Orbs Behind Glass -->
    <radialGradient id="orbLeft" cx="25%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#0d1017" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbRight" cx="78%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0d1017" stop-opacity="0"/>
    </radialGradient>

    <!-- 30% Frosted Glass Surfaces -->
    <linearGradient id="glassPane" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.015"/>
    </linearGradient>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <!-- 10% Harmonious Low-Saturation Progress Gradient -->
    <linearGradient id="softProg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <style>
      .ui-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .code-mono { font-family: 'SF Mono', 'Segoe UI Mono', Consolas, 'Liberation Mono', monospace; }

      @keyframes step1 { 0%, 5% { opacity: 0; } 10%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes step2 { 0%, 15% { opacity: 0; } 22%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes step3 { 0%, 28% { opacity: 0; } 35%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes step4 { 0%, 42% { opacity: 0; } 50%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes step5 { 0%, 56% { opacity: 0; } 64%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes step6 { 0%, 70% { opacity: 0; } 78%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes blinkTerm { 0%, 49% { opacity: 0.9; } 50%, 100% { opacity: 0.15; } }
      @keyframes floatNode { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }

      .t-s1 { animation: step1 11s infinite; }
      .t-s2 { animation: step2 11s infinite; }
      .t-s3 { animation: step3 11s infinite; }
      .t-s4 { animation: step4 11s infinite; }
      .t-s5 { animation: step5 11s infinite; }
      .t-s6 { animation: step6 11s infinite; }
      .t-cur { animation: blinkTerm 1.1s infinite; }
      .btree-soft { animation: floatNode 3.8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Outer Ambient Base & Frosted Glass Window -->
  <rect width="960" height="330" rx="16" fill="url(#termBase)"/>
  <rect width="960" height="330" rx="16" fill="url(#orbLeft)"/>
  <rect width="960" height="330" rx="16" fill="url(#orbRight)"/>
  <rect x="1" y="1" width="958" height="328" rx="15" fill="url(#glassPane)" stroke="url(#glassBorder)" stroke-width="1.2"/>

  <!-- Top Frosted Glass Chrome Bar -->
  <rect x="2" y="2" width="956" height="40" rx="14" fill="#ffffff" fill-opacity="0.035"/>
  <line x1="2" y1="42" x2="958" y2="42" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="24" y1="2" x2="380" y2="2" stroke="#ffffff" stroke-opacity="0.20" stroke-width="1"/>

  <circle cx="26" cy="22" r="5" fill="#e28787" fill-opacity="0.75"/>
  <circle cx="44" cy="22" r="5" fill="#dec184" fill-opacity="0.75"/>
  <circle cx="62" cy="22" r="5" fill="#85c192" fill-opacity="0.75"/>

  <!-- Clean Sans-Serif Glass Tabs -->
  <g class="ui-sans" font-size="11.5" font-weight="500">
    <rect x="88" y="9" width="214" height="26" rx="7" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="104" cy="22" r="3" fill="#93c5fd"/>
    <text x="116" y="26" fill="#e2e8f0">Contenedores &amp; Auditoría SAST</text>

    <rect x="310" y="9" width="214" height="26" rx="7" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.07"/>
    <circle cx="326" cy="22" r="3" fill="#a5b4fc"/>
    <text x="338" y="26" fill="#cbd5e1">Motor SQL PostgreSQL 16 (NEXUS)</text>

    <text x="934" y="26" text-anchor="end" font-size="11" fill="#94a3b8">Consola Interactiva Dual</text>
  </g>

  <!-- ==================== LEFT GLASS PANE: DOCKER & AI SAST EXECUTION ==================== -->
  <g transform="translate(20, 54)">
    <rect width="452" height="256" rx="12" fill="url(#glassPane)" stroke="url(#glassBorder)" stroke-width="1"/>
    <line x1="16" y1="1" x2="210" y2="1" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>

    <text x="18" y="23" class="ui-sans" font-size="12" font-weight="600" fill="#e2e8f0">
      Despliegue Multi-Stage &amp; Análisis de Seguridad
    </text>
    <text x="434" y="23" text-anchor="end" class="ui-sans" font-size="10.5" fill="#94a3b8">Docker · Ollama SAST</text>
    <line x1="18" y1="32" x2="434" y2="32" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

    <g class="code-mono" font-size="10.5">
      <!-- Step 1: Docker Multi-stage command -->
      <g class="t-s1">
        <text x="18" y="52" fill="#93c5fd" font-weight="500">~/api</text>
        <text x="58" y="52" fill="#64748b">❯</text>
        <text x="72" y="52" fill="#e2e8f0">docker build --target prod -t core-service:2.6 .</text>
      </g>

      <!-- Step 2: Docker build output -->
      <g class="t-s2" font-size="10">
        <text x="18" y="72" fill="#94a3b8">· Etapa 1/2 (builder): Dependencias en caché verificadas (0.4s)</text>
        <text x="18" y="88" fill="#cbd5e1">· Etapa 2/2 (runtime): Usuario no-root UID 10001 · Imagen 38.4 MB</text>
      </g>

      <!-- Step 3: AI Security Orchestrator command -->
      <g class="t-s3">
        <text x="18" y="114" fill="#a5b4fc" font-weight="500">~/sec</text>
        <text x="58" y="114" fill="#64748b">❯</text>
        <text x="72" y="114" fill="#e2e8f0">ai-sec scan --sast --llm ollama:qwen2.5</text>
      </g>

      <!-- Step 4: SAST Output -->
      <g class="t-s4" font-size="10">
        <text x="18" y="134" fill="#94a3b8">· Ejecutando análisis estático Semgrep + Bandit + OWASP...</text>
        <text x="18" y="150" fill="#cbd5e1">· Deduplicación SHA-256 completada · 42 endpoints auditados</text>
      </g>

      <!-- Step 5: Progress Bar & Verdict -->
      <g class="t-s5">
        <rect x="18" y="166" width="416" height="8" rx="4" fill="#090c12" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.07"/>
        <rect x="18" y="166" width="416" height="8" rx="4" fill="url(#softProg)" fill-opacity="0.85">
          <animate attributeName="width" values="12;416;416" keyTimes="0;0.55;1" dur="11s" repeatCount="indefinite"/>
        </rect>
        <text x="18" y="192" class="ui-sans" font-size="11" font-weight="500" fill="#6ee7b7">
          ✓ Auditoría completada: 0 vulnerabilidades críticas · Shift-Left aprobado
        </text>
      </g>

      <!-- Step 6: Final Status Pill -->
      <g class="t-s6">
        <rect x="18" y="206" width="416" height="34" rx="8" fill="#ffffff" fill-opacity="0.035" stroke="#6ee7b7" stroke-opacity="0.35"/>
        <text x="32" y="227" class="ui-sans" font-size="11.5" font-weight="500" fill="#e2e8f0">
          Estado: Contenedores desplegados en producción <tspan fill="#6ee7b7" font-weight="600">[200 OK]</tspan>
        </text>
        <rect x="412" y="216" width="6" height="13" rx="1.5" fill="#6ee7b7" class="t-cur"/>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT GLASS PANE: NEXUS SQL EXPLAIN & INDEX TREE ==================== -->
  <g transform="translate(488, 54)">
    <rect width="452" height="256" rx="12" fill="url(#glassPane)" stroke="url(#glassBorder)" stroke-width="1"/>
    <line x1="16" y1="1" x2="210" y2="1" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>

    <text x="18" y="23" class="ui-sans" font-size="12" font-weight="600" fill="#e2e8f0">
      Plan de Ejecución SQL &amp; Índices B-Tree
    </text>
    <text x="434" y="23" text-anchor="end" class="ui-sans" font-size="10.5" fill="#94a3b8">Simulador NEXUS · pg-mem</text>
    <line x1="18" y1="32" x2="434" y2="32" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

    <g class="code-mono" font-size="10.5">
      <!-- Step 1: SQL Query -->
      <g class="t-s1">
        <text x="18" y="52" fill="#93c5fd" font-weight="500">postgres=#</text>
        <text x="92" y="52" fill="#a5b4fc">EXPLAIN (ANALYZE, BUFFERS)</text>
        <text x="18" y="68" fill="#e2e8f0">SELECT o.id, u.email, o.total FROM orders o</text>
        <text x="18" y="84" fill="#e2e8f0">INNER JOIN users u ON o.user_id = u.id WHERE o.state = 'PAID';</text>
      </g>

      <!-- Step 3: Execution Plan Tree -->
      <g class="t-s3" font-size="10">
        <text x="18" y="109" fill="#cbd5e1" font-weight="500">Nested Loop Inner Join (cost=0.58..16.62 rows=1 width=48)</text>
        <text x="28" y="125" fill="#93c5fd">├─ Index Scan using idx_orders_state_btree (0.18 ms)</text>
        <text x="28" y="141" fill="#a5b4fc">└─ Index Scan using pk_users_id on users u (0.11 ms)</text>
      </g>

      <!-- Step 5: Performance Telemetry Card -->
      <g class="t-s5" font-size="10">
        <rect x="18" y="156" width="272" height="84" rx="8" fill="#090c12" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.07"/>
        <text x="30" y="176" fill="#94a3b8">Tiempo de planeación : <tspan fill="#e2e8f0">0.09 ms</tspan></text>
        <text x="30" y="194" fill="#94a3b8">Tiempo de ejecución  : <tspan fill="#6ee7b7">0.29 ms (Index Hit)</tspan></text>
        <text x="30" y="212" fill="#94a3b8">Buffers en memoria   : <tspan fill="#93c5fd">hit=12 read=0 (100%)</tspan></text>
        <text x="30" y="230" fill="#94a3b8">Aislamiento ACID     : <tspan fill="#a5b4fc">READ COMMITTED</tspan></text>
      </g>
    </g>

    <!-- Frosted Glass B-Tree Node Diagram on Bottom Right of Pane 2 (Safely nested transform!) -->
    <g transform="translate(366, 194)">
      <g class="btree-soft">
        <line x1="0" y1="-14" x2="-32" y2="18" stroke="#93c5fd" stroke-opacity="0.45" stroke-width="1.2"/>
        <line x1="0" y1="-14" x2="32" y2="18" stroke="#a5b4fc" stroke-opacity="0.45" stroke-width="1.2"/>

        <!-- Root Node Pill -->
        <rect x="-28" y="-30" width="56" height="20" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#93c5fd" stroke-opacity="0.5"/>
        <text x="0" y="-17" text-anchor="middle" class="ui-sans" font-size="9" font-weight="600" fill="#e2e8f0">Root</text>

        <!-- Left Leaf Node -->
        <rect x="-56" y="14" width="46" height="18" rx="5" fill="#ffffff" fill-opacity="0.04" stroke="#6ee7b7" stroke-opacity="0.45"/>
        <text x="-33" y="26" text-anchor="middle" class="ui-sans" font-size="8.5" fill="#cbd5e1">Idx A</text>

        <!-- Right Leaf Node -->
        <rect x="10" y="14" width="46" height="18" rx="5" fill="#ffffff" fill-opacity="0.04" stroke="#a5b4fc" stroke-opacity="0.45"/>
        <text x="33" y="26" text-anchor="middle" class="ui-sans" font-size="8.5" fill="#cbd5e1">Idx B</text>

        <text x="0" y="46" text-anchor="middle" class="ui-sans" font-size="9.5" font-weight="500" fill="#94a3b8">Índice B-Tree</text>
      </g>
    </g>
  </g>
</svg>
