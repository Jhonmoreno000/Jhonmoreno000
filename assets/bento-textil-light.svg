  <text x="25.5" y="56.5" class="mono" font-size="19.5" font-weight="900" fill="#d97706" fill-opacity="0.28" letter-spacing="1.4">D&amp;D TEXTIL ERP</text>
  <text x="24" y="55" class="mono" font-size="19.5" font-weight="900" fill="#0f172a" letter-spacing="1.4">D&amp;D TEXTIL ERP</text>
