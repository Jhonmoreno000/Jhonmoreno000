<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="400">
  <defs>
    <linearGradient id="msBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="50%" stop-color="#111522"/>
      <stop offset="100%" stop-color="#090b10"/>
    </linearGradient>

    <radialGradient id="msCenterGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#bb9af7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <pattern id="msGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1f2437" stroke-width="0.6" stroke-opacity="0.5"/>
      <circle cx="28" cy="28" r="0.9" fill="#7aa2f7" fill-opacity="0.25"/>
    </pattern>

    <filter id="msGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Motion Paths for Live Traffic (Well-Spaced Coordinates) -->
    <path id="pathGwToFast" d="M 130 200 L 240 200 L 280 104 L 370 104"/>
    <path id="pathGwToSpring" d="M 130 200 L 370 200"/>
    <path id="pathGwToNet" d="M 130 200 L 240 200 L 280 296 L 370 296"/>

    <path id="pathFastToRedis" d="M 370 104 L 500 104 L 545 148 L 630 148"/>
    <path id="pathSpringToRedis" d="M 370 200 L 500 200 L 545 148 L 630 148"/>
    <path id="pathSpringToQueue" d="M 370 200 L 500 200 L 545 256 L 630 256"/>
    <path id="pathNetToQueue" d="M 370 296 L 500 296 L 545 256 L 630 256"/>

    <path id="pathRedisToPg" d="M 630 148 L 835 148"/>
    <path id="pathQueueToMongo" d="M 630 256 L 835 256"/>

    <style>
      @keyframes floatNodeA {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes floatNodeB {
        0%, 100% { transform: translateY(-3px); }
        50% { transform: translateY(3px); }
      }
      @keyframes dashStream {
        to { stroke-dashoffset: -32; }
      }
      .f-a { animation: floatNodeA 3.6s ease-in-out infinite; }
      .f-b { animation: floatNodeB 4.0s ease-in-out infinite; }
      .stream-line { stroke-dasharray: 8 8; animation: dashStream 1.4s linear infinite; }
    </style>
  </defs>

  <!-- Background & Grid -->
  <rect width="960" height="400" rx="14" fill="url(#msBg)"/>
  <rect width="960" height="400" rx="14" fill="url(#msGrid)"/>
  <rect width="960" height="400" rx="14" fill="url(#msCenterGlow)"/>
  <rect x="1" y="1" width="958" height="398" rx="13" fill="none" stroke="#1f2437" stroke-width="1.5"/>

  <!-- Top Header Bar -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" letter-spacing="1">
    <circle cx="32" cy="24" r="4" fill="#73daca">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="44" y="28" fill="#e2e8f0" font-weight="700">3D HOLOGRAPHIC MICROSERVICES TOPOLOGY // LIVE DATA MESH</text>
    <text x="932" y="28" text-anchor="end" fill="#73daca" font-weight="700">LATENCY: &lt;8.5ms P99</text>
  </g>
  <line x1="24" y1="42" x2="936" y2="42" stroke="#1f2437" stroke-width="1"/>

  <!-- Tier Column Headers -->
  <g font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" letter-spacing="1">
    <text x="130" y="62" text-anchor="middle" fill="#7dcfff">01 // INGRESS GATEWAY</text>
    <text x="370" y="62" text-anchor="middle" fill="#bb9af7">02 // DOMAIN SERVICES</text>
    <text x="630" y="62" text-anchor="middle" fill="#e0af68">03 // CACHE &amp; BROKER</text>
    <text x="835" y="62" text-anchor="middle" fill="#73daca">04 // ACID &amp; NOSQL DB</text>
  </g>

  <!-- ==================== CIRCUIT CONDUITS (BACKGROUND LAYER) ==================== -->
  <g fill="none" stroke="#0d101b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <use href="#pathGwToFast"/>
    <use href="#pathGwToSpring"/>
    <use href="#pathGwToNet"/>
    <use href="#pathFastToRedis"/>
    <use href="#pathSpringToRedis"/>
    <use href="#pathSpringToQueue"/>
    <use href="#pathNetToQueue"/>
    <use href="#pathRedisToPg"/>
    <use href="#pathQueueToMongo"/>
  </g>

  <g fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="stream-line">
    <use href="#pathGwToFast" stroke="#7dcfff" stroke-opacity="0.7"/>
    <use href="#pathGwToSpring" stroke="#bb9af7" stroke-opacity="0.7"/>
    <use href="#pathGwToNet" stroke="#e0af68" stroke-opacity="0.7"/>
    <use href="#pathFastToRedis" stroke="#7dcfff" stroke-opacity="0.6"/>
    <use href="#pathSpringToRedis" stroke="#bb9af7" stroke-opacity="0.6"/>
    <use href="#pathSpringToQueue" stroke="#bb9af7" stroke-opacity="0.6"/>
    <use href="#pathNetToQueue" stroke="#e0af68" stroke-opacity="0.6"/>
    <use href="#pathRedisToPg" stroke="#73daca" stroke-opacity="0.75"/>
    <use href="#pathQueueToMongo" stroke="#73daca" stroke-opacity="0.75"/>
  </g>

  <!-- ==================== ANIMATED LIVE TRAFFIC PACKETS ==================== -->
  <circle r="4" fill="#7dcfff" filter="url(#msGlow)">
    <animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#pathGwToFast"/></animateMotion>
  </circle>
  <circle r="4" fill="#bb9af7" filter="url(#msGlow)">
    <animateMotion dur="2.0s" repeatCount="indefinite"><mpath href="#pathGwToSpring"/></animateMotion>
  </circle>
  <circle r="4" fill="#e0af68" filter="url(#msGlow)">
    <animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#pathGwToNet"/></animateMotion>
  </circle>
  <circle r="3.5" fill="#7dcfff" filter="url(#msGlow)">
    <animateMotion dur="2.2s" begin="0.8s" repeatCount="indefinite"><mpath href="#pathFastToRedis"/></animateMotion>
  </circle>
  <circle r="3.5" fill="#bb9af7" filter="url(#msGlow)">
    <animateMotion dur="2.3s" begin="0.5s" repeatCount="indefinite"><mpath href="#pathSpringToQueue"/></animateMotion>
  </circle>
  <circle r="3.5" fill="#e0af68" filter="url(#msGlow)">
    <animateMotion dur="2.5s" begin="1.1s" repeatCount="indefinite"><mpath href="#pathNetToQueue"/></animateMotion>
  </circle>
  <circle r="4" fill="#73daca" filter="url(#msGlow)">
    <animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#pathRedisToPg"/></animateMotion>
  </circle>
  <circle r="4" fill="#73daca" filter="url(#msGlow)">
    <animateMotion dur="1.9s" begin="0.9s" repeatCount="indefinite"><mpath href="#pathQueueToMongo"/></animateMotion>
  </circle>

  <!-- ==================== TIER 1: NGINX API GATEWAY & JWT WAF ==================== -->
  <g transform="translate(130, 195)">
    <polygon points="0,24 68,52 0,80 -68,52" fill="#0d1526" stroke="#7dcfff" stroke-width="1.2"/>
    <polygon points="-68,52 0,80 0,88 -68,60" fill="#080d18" stroke="#2ac3de" stroke-width="0.8"/>
    <polygon points="68,52 0,80 0,88 68,60" fill="#050910" stroke="#0284c7" stroke-width="0.8"/>

    <ellipse cx="0" cy="6" rx="54" ry="22" fill="none" stroke="#7dcfff" stroke-width="1" stroke-dasharray="5 5" stroke-opacity="0.6"/>

    <g class="f-a">
      <polygon points="0,-46 40,-26 0,-6 -40,-26" fill="#7dcfff" stroke="#e0f2fe" stroke-width="1.1"/>
      <polygon points="-40,-26 0,-6 0,44 -40,24" fill="#2ac3de" stroke="#7dcfff" stroke-width="0.9"/>
      <polygon points="40,-26 0,-6 0,44 40,24" fill="#0284c7" stroke="#2ac3de" stroke-width="0.9"/>
      <text x="0" y="-22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#0b0d14">GATEWAY</text>
      <text x="-20" y="12" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#ffffff">JWT</text>
      <text x="20" y="12" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#e0f2fe">TLS</text>
    </g>

    <text x="0" y="106" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#7dcfff">NGINX // API GATEWAY</text>
    <text x="0" y="120" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#9aa5ce">Rate-Limit · OAuth2 · 1.2ms</text>
  </g>

  <!-- ==================== TIER 2: MICROSERVICES MESH (WELL-SPACED AT Y=104, 200, 296) ==================== -->
  <!-- Service 1: FastAPI (Python) -->
  <g transform="translate(370, 104)">
    <polygon points="0,10 44,28 0,46 -44,28" fill="#0d1828" stroke="#7dcfff" stroke-width="1"/>
    <g class="f-a">
      <polygon points="0,-24 28,-10 0,4 -28,-10" fill="#7dcfff" stroke="#e0f2fe" stroke-width="1"/>
      <polygon points="-28,-10 0,4 0,28 -28,14" fill="#2ac3de" stroke="#7dcfff" stroke-width="0.8"/>
      <polygon points="28,-10 0,4 0,28 28,14" fill="#0284c7" stroke="#2ac3de" stroke-width="0.8"/>
      <text x="0" y="-7" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#0b0d14">FASTAPI</text>
    </g>
    <rect x="-58" y="34" width="116" height="16" rx="4" fill="#0b0d14" fill-opacity="0.85" stroke="#2ac3de" stroke-width="0.8"/>
    <text x="0" y="45" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#7dcfff">PYTHON ASYNC · AI</text>
  </g>

  <!-- Service 2: Spring Boot (Java) -->
  <g transform="translate(370, 200)">
    <polygon points="0,10 44,28 0,46 -44,28" fill="#161129" stroke="#bb9af7" stroke-width="1"/>
    <g class="f-b">
      <polygon points="0,-24 28,-10 0,4 -28,-10" fill="#bb9af7" stroke="#f3e8ff" stroke-width="1"/>
      <polygon points="-28,-10 0,4 0,28 -28,14" fill="#9d7cd8" stroke="#bb9af7" stroke-width="0.8"/>
      <polygon points="28,-10 0,4 0,28 28,14" fill="#5a3e8e" stroke="#9d7cd8" stroke-width="0.8"/>
      <text x="0" y="-7" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#0b0d14">SPRING</text>
    </g>
    <rect x="-58" y="34" width="116" height="16" rx="4" fill="#0b0d14" fill-opacity="0.85" stroke="#9d7cd8" stroke-width="0.8"/>
    <text x="0" y="45" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#bb9af7">JAVA 21 · CORE ERP</text>
  </g>

  <!-- Service 3: .NET Core (C#) -->
  <g transform="translate(370, 296)">
    <polygon points="0,10 44,28 0,46 -44,28" fill="#21180b" stroke="#e0af68" stroke-width="1"/>
    <g class="f-a">
      <polygon points="0,-24 28,-10 0,4 -28,-10" fill="#e0af68" stroke="#fef3c7" stroke-width="1"/>
      <polygon points="-28,-10 0,4 0,28 -28,14" fill="#b58338" stroke="#e0af68" stroke-width="0.8"/>
      <polygon points="28,-10 0,4 0,28 28,14" fill="#78521b" stroke="#b58338" stroke-width="0.8"/>
      <text x="0" y="-7" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="800" fill="#0b0d14">.NET CORE</text>
    </g>
    <rect x="-58" y="34" width="116" height="16" rx="4" fill="#0b0d14" fill-opacity="0.85" stroke="#b58338" stroke-width="0.8"/>
    <text x="0" y="45" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#e0af68">C# · TRANSACTIONS</text>
  </g>

  <!-- ==================== TIER 3: REDIS CACHE & EVENT BROKER ==================== -->
  <!-- Node 1: Redis In-Memory Cache -->
  <g transform="translate(630, 148)">
    <polygon points="0,12 46,30 0,48 -46,30" fill="#21180b" stroke="#e0af68" stroke-width="1"/>
    <g class="f-b">
      <polygon points="0,-26 30,-12 0,2 -30,-12" fill="#e0af68" stroke="#fef3c7" stroke-width="1"/>
      <polygon points="-30,-12 0,2 0,28 -30,14" fill="#b58338" stroke="#e0af68" stroke-width="0.8"/>
      <polygon points="30,-12 0,2 0,28 30,14" fill="#78521b" stroke="#b58338" stroke-width="0.8"/>
      <text x="0" y="-9" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#0b0d14">REDIS</text>
    </g>
    <rect x="-60" y="36" width="120" height="16" rx="4" fill="#0b0d14" fill-opacity="0.85" stroke="#b58338" stroke-width="0.8"/>
    <text x="0" y="47" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#e0af68">CACHE // 0.3ms HIT</text>
  </g>

  <!-- Node 2: Async Event / AI Security Queue -->
  <g transform="translate(630, 256)">
    <polygon points="0,12 46,30 0,48 -46,30" fill="#161129" stroke="#bb9af7" stroke-width="1"/>
    <g class="f-a">
      <polygon points="0,-26 30,-12 0,2 -30,-12" fill="#bb9af7" stroke="#f3e8ff" stroke-width="1"/>
      <polygon points="-30,-12 0,2 0,28 -30,14" fill="#9d7cd8" stroke="#bb9af7" stroke-width="0.8"/>
      <polygon points="30,-12 0,2 0,28 30,14" fill="#5a3e8e" stroke="#9d7cd8" stroke-width="0.8"/>
      <text x="0" y="-9" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#0b0d14">BROKER</text>
    </g>
    <rect x="-60" y="36" width="120" height="16" rx="4" fill="#0b0d14" fill-opacity="0.85" stroke="#9d7cd8" stroke-width="0.8"/>
    <text x="0" y="47" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#bb9af7">ASYNC PUB/SUB BUS</text>
  </g>

  <!-- ==================== TIER 4: 3D DATABASE CYLINDERS ==================== -->
  <!-- DB 1: PostgreSQL / MySQL Relational Engine -->
  <g transform="translate(835, 148)">
    <polygon points="0,12 48,30 0,48 -48,30" fill="#0c221e" stroke="#73daca" stroke-width="1"/>
    <g class="f-a">
      <path d="M -28 2 L -28 20 A 28 11 0 0 0 28 20 L 28 2 Z" fill="#0f766e" stroke="#73daca" stroke-width="0.8"/>
      <ellipse cx="0" cy="2" rx="28" ry="11" fill="#1abc9c" stroke="#a7f3d0" stroke-width="0.8"/>
      <path d="M -28 -18 L -28 0 A 28 11 0 0 0 28 0 L 28 -18 Z" fill="#1abc9c" stroke="#73daca" stroke-width="0.8"/>
      <ellipse cx="0" cy="-18" rx="28" ry="11" fill="#73daca" stroke="#d1fae5" stroke-width="1"/>
      <text x="0" y="-15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#0b0d14">POSTGRES</text>
    </g>
    <rect x="-62" y="36" width="124" height="16" rx="4" fill="#0b0d14" fill-opacity="0.85" stroke="#1abc9c" stroke-width="0.8"/>
    <text x="0" y="47" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#73daca">ACID · B-TREE INDEX</text>
  </g>

  <!-- DB 2: MongoDB NoSQL Cluster -->
  <g transform="translate(835, 256)">
    <polygon points="0,12 48,30 0,48 -48,30" fill="#0d1828" stroke="#7dcfff" stroke-width="1"/>
    <g class="f-b">
      <path d="M -28 2 L -28 20 A 28 11 0 0 0 28 20 L 28 2 Z" fill="#0369a1" stroke="#7dcfff" stroke-width="0.8"/>
      <ellipse cx="0" cy="2" rx="28" ry="11" fill="#0284c7" stroke="#bae6fd" stroke-width="0.8"/>
      <path d="M -28 -18 L -28 0 A 28 11 0 0 0 28 0 L 28 -18 Z" fill="#2ac3de" stroke="#7dcfff" stroke-width="0.8"/>
      <ellipse cx="0" cy="-18" rx="28" ry="11" fill="#7dcfff" stroke="#e0f2fe" stroke-width="1"/>
      <text x="0" y="-15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#0b0d14">MONGODB</text>
    </g>
    <rect x="-62" y="36" width="124" height="16" rx="4" fill="#0b0d14" fill-opacity="0.85" stroke="#2ac3de" stroke-width="0.8"/>
    <text x="0" y="47" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#7dcfff">DOCUMENT REPLICA</text>
  </g>

  <!-- ==================== BOTTOM TELEMETRY FOOTER BAR ==================== -->
  <rect x="24" y="362" width="912" height="24" rx="6" fill="#0d101b" stroke="#1f2437" stroke-width="1"/>
  <g font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#9aa5ce">
    <text x="40" y="378">PATTERN: <tspan fill="#7dcfff" font-weight="700">CLEAN ARCHITECTURE &amp; DDD</tspan></text>
    <text x="330" y="378">CONTAINERS: <tspan fill="#bb9af7" font-weight="700">DOCKER MULTI-STAGE</tspan></text>
    <text x="595" y="378">SECURITY: <tspan fill="#73daca" font-weight="700">ZERO-TRUST JWT + SAST</tspan></text>
    <text x="920" y="378" text-anchor="end" fill="#e0af68" font-weight="700">ONLINE</text>
  </g>
</svg>
