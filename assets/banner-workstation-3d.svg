<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="100%" height="390">
  <defs>
    <!-- Tokyo Night / Catppuccin Mocha Deep Canvas -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="55%" stop-color="#111522"/>
      <stop offset="100%" stop-color="#090b10"/>
    </linearGradient>

    <!-- Ambient Room Lighting Behind 3D Isometric Scene -->
    <radialGradient id="deskAura" cx="74%" cy="54%" r="36%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#bb9af7" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#090b10" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="warmAura" cx="18%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#73daca" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#090b10" stop-opacity="0"/>
    </radialGradient>

    <!-- Editorial Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#c0caf5"/>
      <stop offset="100%" stop-color="#7aa2f7"/>
    </linearGradient>

    <!-- 3D Isometric Floor & Desk Gradients -->
    <linearGradient id="isoFloor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b2e"/>
      <stop offset="100%" stop-color="#0d101b"/>
    </linearGradient>

    <linearGradient id="deskTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24283b"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>

    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2335"/>
      <stop offset="100%" stop-color="#0f1320"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cable Path from Workstation to Server Rack -->
    <path id="fiberCable1" d="M 705 275 Q 755 300, 815 265"/>
    <path id="fiberCable2" d="M 715 282 Q 765 310, 825 272"/>

    <style>
      @keyframes holoFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes holoFloatSlow {
        0%, 100% { transform: translateY(-4px); }
        50% { transform: translateY(4px); }
      }
      @keyframes steamAnim {
        0% { transform: translateY(0px); opacity: 0.75; }
        100% { transform: translateY(-12px); opacity: 0; }
      }
      @keyframes cablePulse {
        to { stroke-dashoffset: -24; }
      }
      .holo-1 { animation: holoFloat 3.6s ease-in-out infinite; }
      .holo-2 { animation: holoFloatSlow 4.2s ease-in-out infinite; }
      .steam-1 { animation: steamAnim 2.4s ease-out infinite; }
      .steam-2 { animation: steamAnim 2.4s ease-out infinite 1.2s; }
      .fiber-flow { stroke-dasharray: 6 6; animation: cablePulse 1.2s linear infinite; }
    </style>
  </defs>

  <!-- Main Canvas -->
  <rect width="1000" height="390" rx="18" fill="url(#canvasBg)"/>
  <rect width="1000" height="390" rx="18" fill="url(#warmAura)"/>
  <rect width="1000" height="390" rx="18" fill="url(#deskAura)"/>
  <rect x="1" y="1" width="998" height="388" rx="17" fill="none" stroke="#1f2437" stroke-width="1.5"/>

  <!-- ==================== LEFT HALF: EDITORIAL IDENTITY ==================== -->
  <!-- Status Pill -->
  <g transform="translate(48, 42)">
    <rect width="268" height="28" rx="14" fill="#131826" stroke="#293048" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#73daca"/>
    <circle cx="16" cy="14" r="4" fill="none" stroke="#73daca" stroke-width="1.5">
      <animate attributeName="r" from="4" to="10" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.8" to="0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="18" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5" font-weight="600" fill="#c0caf5">
      Medellín, CO · <tspan fill="#73daca">Available for Work</tspan>
    </text>
  </g>

  <!-- Main Editorial Name & Role -->
  <text x="48" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif"
        font-size="42" font-weight="800" letter-spacing="-1" fill="url(#titleGrad)">
    Jhon Anderson Moreno
  </text>

  <text x="48" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif"
        font-size="18" font-weight="600" fill="#7aa2f7">
    Backend Software Engineer <tspan fill="#565f89">·</tspan> <tspan fill="#bb9af7">Distributed Systems &amp; DevSecOps</tspan>
  </text>

  <text x="48" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif"
        font-size="14" fill="#9aa5ce">
    Diseño microservicios desacoplados, motores de persistencia SQL/NoSQL
  </text>
  <text x="48" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif"
        font-size="14" fill="#9aa5ce">
    de alto rendimiento y pipelines de seguridad automatizados con Docker e IA.
  </text>

  <!-- Clean Architectural Focus Cards (Left Bottom) -->
  <g transform="translate(48, 232)" font-family="'JetBrains Mono', 'Fira Code', monospace">
    <!-- Card A -->
    <rect x="0" y="0" width="215" height="62" rx="10" fill="#121624" stroke="#242b42" stroke-width="1"/>
    <circle cx="18" cy="22" r="4" fill="#7aa2f7"/>
    <text x="30" y="25" font-size="11" font-weight="700" fill="#e2e8f0">Backend &amp; Clean Arch</text>
    <text x="18" y="45" font-size="10" fill="#787c99">Python · Java · C# · Node.js</text>

    <!-- Card B -->
    <rect x="229" y="0" width="215" height="62" rx="10" fill="#121624" stroke="#242b42" stroke-width="1"/>
    <circle cx="247" cy="22" r="4" fill="#bb9af7"/>
    <text x="259" y="25" font-size="11" font-weight="700" fill="#e2e8f0">DevSecOps &amp; Containers</text>
    <text x="247" y="45" font-size="10" fill="#787c99">Docker · SAST/DAST · Linux</text>
  </g>

  <!-- Minimal Credential Line -->
  <g transform="translate(48, 318)" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#565f89">
    <text x="0" y="16">FORMATION: <tspan fill="#c0caf5" font-weight="600">Tecnólogo ADSO (SENA)</tspan></text>
    <text x="245" y="16">PARADIGM: <tspan fill="#73daca" font-weight="600">DDD · SOLID · TDD</tspan></text>
  </g>

  <!-- ==================== RIGHT HALF: 3D ISOMETRIC WORKSTATION & SERVER ROOM ==================== -->
  <g transform="translate(15, 8)">
    <!-- 1. Isometric Room Floor Base (Diamond Tile Platform) -->
    <!-- Center Top: (740, 120), Right: (945, 222), Bottom: (740, 324), Left: (535, 222) -->
    <polygon points="740,130 945,230 740,330 535,230" fill="url(#isoFloor)" stroke="#293048" stroke-width="1.5"/>
    <!-- Left Floor Thickness -->
    <polygon points="535,230 740,330 740,344 535,244" fill="#0d101b" stroke="#1f2437" stroke-width="1"/>
    <!-- Right Floor Thickness -->
    <polygon points="945,230 740,330 740,344 945,244" fill="#080a12" stroke="#1f2437" stroke-width="1"/>

    <!-- Isometric Floor Tile Grid Lines -->
    <g stroke="#242b42" stroke-width="0.8" stroke-opacity="0.7">
      <line x1="603" y1="196" x2="808" y2="296"/>
      <line x1="671" y1="163" x2="876" y2="263"/>
      <line x1="808" y1="163" x2="603" y2="263"/>
      <line x1="876" y1="196" x2="671" y2="296"/>
    </g>

    <!-- Glowing Fiber-Optic Floor Cables Connecting Desk to Server Tower -->
    <use href="#fiberCable1" fill="none" stroke="#1a1b26" stroke-width="4" stroke-linecap="round"/>
    <use href="#fiberCable1" fill="none" stroke="#73daca" stroke-width="1.8" class="fiber-flow"/>
    <use href="#fiberCable2" fill="none" stroke="#1a1b26" stroke-width="4" stroke-linecap="round"/>
    <use href="#fiberCable2" fill="none" stroke="#bb9af7" stroke-width="1.8" class="fiber-flow"/>

    <!-- 2. ISOMETRIC SERVER RACK TOWER (Right Side of Room: x=835, y=215) -->
    <g transform="translate(835, 212)">
      <!-- Server Base Shadow -->
      <polygon points="0,12 46,34 0,56 -46,34" fill="#05070c" fill-opacity="0.7"/>
      <!-- Server Tower Top Face -->
      <polygon points="0,-78 42,-58 0,-38 -42,-58" fill="#24283b" stroke="#7aa2f7" stroke-width="1.2"/>
      <!-- Server Tower Left Face (Front Panel with Cooling Fans & LEDs) -->
      <polygon points="-42,-58 0,-38 0,48 -42,28" fill="#161926" stroke="#293048" stroke-width="1"/>
      <!-- Server Tower Right Face (Tempered Glass Side Panel showing Internal Nodes) -->
      <polygon points="42,-58 0,-38 0,48 42,28" fill="#111420" stroke="#293048" stroke-width="1"/>

      <!-- 3 Glowing RGB Liquid-Cooling Rings on Server Front Panel -->
      <ellipse cx="-21" cy="-26" rx="8" ry="11" transform="skewY(25)" fill="none" stroke="#7aa2f7" stroke-width="2">
        <animate attributeName="stroke" values="#7aa2f7;#73daca;#bb9af7;#7aa2f7" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="-21" cy="0" rx="8" ry="11" transform="skewY(25)" fill="none" stroke="#bb9af7" stroke-width="2">
        <animate attributeName="stroke" values="#bb9af7;#7aa2f7;#73daca;#bb9af7" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="-21" cy="26" rx="8" ry="11" transform="skewY(25)" fill="none" stroke="#73daca" stroke-width="2">
        <animate attributeName="stroke" values="#73daca;#bb9af7;#7aa2f7;#73daca" dur="4s" repeatCount="indefinite"/>
      </ellipse>

      <!-- Internal GPU / Blade Server Bars inside Glass Panel -->
      <line x1="8" y1="-22" x2="34" y2="-34" stroke="#7aa2f7" stroke-width="3" stroke-linecap="round"/>
      <line x1="8" y1="-8" x2="34" y2="-20" stroke="#bb9af7" stroke-width="3" stroke-linecap="round"/>
      <line x1="8" y1="6" x2="34" y2="-6" stroke="#73daca" stroke-width="3" stroke-linecap="round"/>
      <circle cx="12" cy="24" r="2.2" fill="#39d353">
        <animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="20" cy="20" r="2.2" fill="#f7768e">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.1s" repeatCount="indefinite"/>
      </circle>

      <!-- Floating 3D Database Cylinder Hovering Above Server Tower -->
      <g class="holo-1" transform="translate(0, -104)">
        <ellipse cx="0" cy="36" rx="22" ry="9" fill="#7aa2f7" fill-opacity="0.18"/>
        <path d="M -20 -4 L -20 12 A 20 8 0 0 0 20 12 L 20 -4 Z" fill="#3d59a1" stroke="#7aa2f7" stroke-width="0.9"/>
        <ellipse cx="0" cy="-4" rx="20" ry="8" fill="#7aa2f7" stroke="#c0caf5" stroke-width="0.9"/>
        <text x="0" y="-1" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="800" fill="#0b0d14">SQL/DB</text>
      </g>
    </g>

    <!-- 3. ISOMETRIC DEVELOPER WORKSTATION DESK (Center-Left of Room: x=665, y=215) -->
    <g transform="translate(665, 205)">
      <!-- Desk Legs -->
      <polygon points="-78,12 -70,16 -70,62 -78,58" fill="#11131d"/>
      <polygon points="0,50 8,54 8,100 0,96" fill="#11131d"/>
      <polygon points="78,12 70,16 70,62 78,58" fill="#0c0e17"/>

      <!-- RGB Underglow Beneath Desk -->
      <polygon points="0,-22 86,20 0,62 -86,20" fill="#7aa2f7" fill-opacity="0.22" filter="url(#softGlow)"/>

      <!-- Isometric Desk Top Surface -->
      <polygon points="0,-26 84,15 0,56 -84,15" fill="url(#deskTopGrad)" stroke="#414868" stroke-width="1.2"/>
      <!-- Desk Edge Thickness -->
      <polygon points="-84,15 0,56 0,62 -84,21" fill="#16161e" stroke="#293048" stroke-width="0.8"/>
      <polygon points="84,15 0,56 0,62 84,21" fill="#101016" stroke="#293048" stroke-width="0.8"/>

      <!-- Isometric Mechanical Keyboard with RGB Backlight -->
      <polygon points="-8,12 18,25 8,31 -18,18" fill="#1a1b26" stroke="#73daca" stroke-width="0.9"/>
      <line x1="-12" y1="17" x2="10" y2="28" stroke="#bb9af7" stroke-width="1.2" stroke-dasharray="2 2"/>

      <!-- Isometric Coffee Mug + Rising Steam -->
      <g transform="translate(42, 14)">
        <path d="M -5 0 L -5 8 A 5 2.5 0 0 0 5 8 L 5 0 Z" fill="#f7768e"/>
        <ellipse cx="0" cy="0" rx="5" ry="2.5" fill="#1a1b26" stroke="#f7768e" stroke-width="1"/>
        <path d="M -2 -3 Q -4 -8, 0 -12" fill="none" stroke="#c0caf5" stroke-width="1.2" stroke-linecap="round" class="steam-1"/>
        <path d="M 2 -2 Q 4 -7, 1 -11" fill="none" stroke="#c0caf5" stroke-width="1.2" stroke-linecap="round" class="steam-2"/>
      </g>

      <!-- MAIN CURVED ISOMETRIC MONITOR (Left-Center on Desk) -->
      <g transform="translate(-18, -32)">
        <!-- Monitor Stand -->
        <polygon points="-4,26 4,30 4,42 -4,38" fill="#414868"/>
        <!-- Isometric Screen Frame -->
        <polygon points="-42,-36 28,-2 28,36 -42,2" fill="url(#screenGlow)" stroke="#7aa2f7" stroke-width="1.4"/>
        <!-- Animated Code Lines on Main Monitor -->
        <line x1="-34" y1="-24" x2="-12" y2="-13" stroke="#f7768e" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="-34" y1="-16" x2="6" y2="3" stroke="#7aa2f7" stroke-width="2.2" stroke-linecap="round">
          <animate attributeName="x2" values="-20;6;6" dur="3.5s" repeatCount="indefinite"/>
        </line>
        <line x1="-28" y1="-7" x2="14" y2="13" stroke="#73daca" stroke-width="2.2" stroke-linecap="round">
          <animate attributeName="x2" values="-16;14;14" dur="3.5s" repeatCount="indefinite"/>
        </line>
        <line x1="-28" y1="1" x2="2" y2="16" stroke="#bb9af7" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="-34" y1="8" x2="-8" y2="21" stroke="#e0af68" stroke-width="2.2" stroke-linecap="round"/>
      </g>

      <!-- SECONDARY VERTICAL ISOMETRIC MONITOR (Right on Desk) -->
      <g transform="translate(36, -24)">
        <polygon points="-14,-34 18,-18 18,22 -14,6" fill="url(#screenGlow)" stroke="#bb9af7" stroke-width="1.2"/>
        <!-- Telemetry Bars on Secondary Screen -->
        <line x1="-8" y1="-22" x2="10" y2="-13" stroke="#73daca" stroke-width="2" stroke-linecap="round"/>
        <line x1="-8" y1="-14" x2="6" y2="-7" stroke="#7aa2f7" stroke-width="2" stroke-linecap="round"/>
        <line x1="-8" y1="-6" x2="12" y2="4" stroke="#bb9af7" stroke-width="2" stroke-linecap="round"/>
        <line x1="-8" y1="2" x2="4" y2="8" stroke="#e0af68" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- FLOATING HOLOGRAPHIC TERMINAL ABOVE WORKSTATION -->
      <g class="holo-2" transform="translate(-10, -108)">
        <polygon points="-50,-18 46,-18 36,16 -60,16" fill="#111628" fill-opacity="0.88" stroke="#73daca" stroke-width="1.2"/>
        <circle cx="-42" cy="-10" r="2" fill="#f7768e"/>
        <circle cx="-35" cy="-10" r="2" fill="#e0af68"/>
        <circle cx="-28" cy="-10" r="2" fill="#73daca"/>
        <text x="-4" y="-1" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#73daca">
          $ docker compose up
        </text>
        <text x="-8" y="10" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#c0caf5">
          &#10004; 4 microservices live
        </text>
      </g>
    </g>

    <!-- 4. FLOATING 3D ISOMETRIC DOCKER CUBE (Front-Left of Room: x=575, y=242) -->
    <g class="holo-1" transform="translate(575, 228)">
      <ellipse cx="0" cy="28" rx="22" ry="9" fill="#73daca" fill-opacity="0.16"/>
      <polygon points="0,-18 22,-7 0,4 -22,-7" fill="#73daca" stroke="#c0caf5" stroke-width="0.9"/>
      <polygon points="-22,-7 0,4 0,24 -22,13" fill="#2ac3de" stroke="#73daca" stroke-width="0.8"/>
      <polygon points="22,-7 0,4 0,24 22,13" fill="#1abc9c" stroke="#2ac3de" stroke-width="0.8"/>
      <text x="0" y="-4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="800" fill="#0b0d14">DOCKER</text>
    </g>
  </g>
</svg>
