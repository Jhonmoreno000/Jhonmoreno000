<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="100%" height="390">
  <defs>
    <!-- 60% Dominant Base: Deep Warm Slate Canvas -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1017"/>
      <stop offset="55%" stop-color="#111622"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>

    <!-- Soft Ambient Light Orbs for Glass Refraction -->
    <radialGradient id="deskAura" cx="72%" cy="52%" r="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0b0e14" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="warmAura" cx="20%" cy="28%" r="38%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0b0e14" stop-opacity="0"/>
    </radialGradient>

    <!-- 30% Frosted Glass Surfaces & Specular Borders -->
    <linearGradient id="glassSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <linearGradient id="glassCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.018"/>
    </linearGradient>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.025"/>
    </linearGradient>

    <!-- Editorial Title Gradient (Soft Alabaster to Cool Silver-Periwinkle) -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <!-- 3D Isometric Floor & Desk Gradients (Desaturated Slate) -->
    <linearGradient id="isoFloor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161c2a"/>
      <stop offset="100%" stop-color="#0e121c"/>
    </linearGradient>

    <linearGradient id="deskTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2536"/>
      <stop offset="100%" stop-color="#141926"/>
    </linearGradient>

    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2234"/>
      <stop offset="100%" stop-color="#0f1420"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <path id="fiberCable1" d="M 705 275 Q 755 300, 815 265"/>
    <path id="fiberCable2" d="M 715 282 Q 765 310, 825 272"/>

    <style>
      .sans-ui { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono-ui { font-family: 'SF Mono', 'Segoe UI Mono', Consolas, monospace; }

      @keyframes holoFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes holoFloatSlow {
        0%, 100% { transform: translateY(-2px); }
        50% { transform: translateY(4px); }
      }
      @keyframes steamAnim {
        0% { transform: translateY(0px); opacity: 0.65; }
        100% { transform: translateY(-10px); opacity: 0; }
      }
      @keyframes cablePulse {
        to { stroke-dashoffset: -24; }
      }
      .holo-1 { animation: holoFloat 3.8s ease-in-out infinite; }
      .holo-2 { animation: holoFloatSlow 4.4s ease-in-out infinite; }
      .steam-1 { animation: steamAnim 2.6s ease-out infinite; }
      .steam-2 { animation: steamAnim 2.6s ease-out infinite 1.3s; }
      .fiber-flow { stroke-dasharray: 5 5; animation: cablePulse 1.5s linear infinite; }
    </style>
  </defs>

  <!-- Main Ambient Canvas & Frosted Outer Frame -->
  <rect width="1000" height="390" rx="18" fill="url(#canvasBg)"/>
  <rect width="1000" height="390" rx="18" fill="url(#warmAura)"/>
  <rect width="1000" height="390" rx="18" fill="url(#deskAura)"/>
  <rect x="1" y="1" width="998" height="388" rx="17" fill="url(#glassSurface)" stroke="url(#glassBorder)" stroke-width="1.2"/>
  <line x1="28" y1="2" x2="460" y2="2" stroke="#ffffff" stroke-opacity="0.20" stroke-width="1"/>

  <!-- ==================== LEFT HALF: EDITORIAL GLASSMORPHIC IDENTITY ==================== -->
  <!-- Frosted Glass Status Pill -->
  <g transform="translate(48, 42)" class="sans-ui">
    <rect width="290" height="30" rx="15" fill="url(#glassCard)" stroke="url(#glassBorder)" stroke-width="1"/>
    <circle cx="18" cy="15" r="3.5" fill="#6ee7b7"/>
    <circle cx="18" cy="15" r="3.5" fill="none" stroke="#6ee7b7" stroke-width="1.2">
      <animate attributeName="r" from="3.5" to="9" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.7" to="0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="19" font-size="11.5" font-weight="500" fill="#cbd5e1">
      Medellín, Colombia <tspan fill="#64748b">·</tspan> <tspan fill="#6ee7b7">Disponible para proyectos</tspan>
    </text>
  </g>

  <!-- Main Editorial Name & Role -->
  <text x="48" y="122" class="sans-ui" font-size="40" font-weight="700" letter-spacing="-0.8" fill="url(#titleGrad)">
    Jhon Anderson Moreno
  </text>

  <text x="48" y="154" class="sans-ui" font-size="17" font-weight="500" fill="#93c5fd">
    Ingeniero de Software Backend <tspan fill="#475569">·</tspan> <tspan fill="#cbd5e1">Arquitectura de Datos &amp; DevSecOps</tspan>
  </text>

  <text x="48" y="188" class="sans-ui" font-size="13.5" fill="#94a3b8">
    Desarrollo servicios modulares, motores de persistencia relacional y NoSQL
  </text>
  <text x="48" y="208" class="sans-ui" font-size="13.5" fill="#94a3b8">
    de alto rendimiento y entornos contenerizados con auditoría automatizada.
  </text>

  <!-- Two Frosted Glass Focus Cards (Left Bottom) -->
  <g transform="translate(48, 232)" class="sans-ui">
    <!-- Card A -->
    <rect x="0" y="0" width="218" height="64" rx="12" fill="url(#glassCard)" stroke="url(#glassBorder)" stroke-width="1"/>
    <line x1="14" y1="1" x2="120" y2="1" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/>
    <circle cx="18" cy="23" r="3.5" fill="#93c5fd"/>
    <text x="30" y="27" font-size="12" font-weight="600" fill="#f1f5f9">Ingeniería Backend &amp; APIs</text>
    <text x="18" y="47" font-size="11" fill="#94a3b8">TypeScript · Python · Java · C#</text>

    <!-- Card B -->
    <rect x="232" y="0" width="218" height="64" rx="12" fill="url(#glassCard)" stroke="url(#glassBorder)" stroke-width="1"/>
    <line x1="246" y1="1" x2="352" y2="1" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/>
    <circle cx="250" cy="23" r="3.5" fill="#a5b4fc"/>
    <text x="262" y="27" font-size="12" font-weight="600" fill="#f1f5f9">Persistencia &amp; Contenedores</text>
    <text x="250" y="47" font-size="11" fill="#94a3b8">PostgreSQL 16 · Mongo · Docker</text>
  </g>

  <!-- Minimal Credential Line -->
  <g transform="translate(48, 318)" class="sans-ui" font-size="11.5" fill="#64748b">
    <text x="0" y="16">Formación: <tspan fill="#cbd5e1" font-weight="500">Tecnólogo ADSO (SENA)</tspan></text>
    <text x="242" y="16">Estándares: <tspan fill="#93c5fd" font-weight="500">Clean Architecture · DDD · TDD</tspan></text>
  </g>

  <!-- ==================== RIGHT HALF: GLASSMORPHIC 3D WORKSTATION SCENE ==================== -->
  <g transform="translate(15, 16)">
    <!-- 1. Isometric Room Floor Base -->
    <polygon points="740,130 945,230 740,330 535,230" fill="url(#isoFloor)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2"/>
    <polygon points="535,230 740,330 740,344 535,244" fill="#0c1018" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    <polygon points="945,230 740,330 740,344 945,244" fill="#090c12" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

    <!-- Subtle Isometric Floor Grid Lines -->
    <g stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.06">
      <line x1="603" y1="196" x2="808" y2="296"/>
      <line x1="671" y1="163" x2="876" y2="263"/>
      <line x1="808" y1="163" x2="603" y2="263"/>
      <line x1="876" y1="196" x2="671" y2="296"/>
    </g>

    <!-- Subtle Data Cables Connecting Desk to Server Tower -->
    <use href="#fiberCable1" fill="none" stroke="#141926" stroke-width="3.5" stroke-linecap="round"/>
    <use href="#fiberCable1" fill="none" stroke="#93c5fd" stroke-opacity="0.65" stroke-width="1.4" class="fiber-flow"/>
    <use href="#fiberCable2" fill="none" stroke="#141926" stroke-width="3.5" stroke-linecap="round"/>
    <use href="#fiberCable2" fill="none" stroke="#a5b4fc" stroke-opacity="0.55" stroke-width="1.4" class="fiber-flow"/>

    <!-- 2. ISOMETRIC SERVER RACK TOWER (Right Side: x=835, y=212) -->
    <g transform="translate(835, 212)">
      <polygon points="0,12 46,34 0,56 -46,34" fill="#05070c" fill-opacity="0.6"/>
      <!-- Top Face -->
      <polygon points="0,-78 42,-58 0,-38 -42,-58" fill="#1e2536" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1"/>
      <!-- Left Face -->
      <polygon points="-42,-58 0,-38 0,48 -42,28" fill="#151a28" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>
      <!-- Right Tempered Glass Face -->
      <polygon points="42,-58 0,-38 0,48 42,28" fill="#101420" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>

      <!-- Desaturated Soft Glass Cooling Rings -->
      <ellipse cx="-21" cy="-26" rx="8" ry="11" transform="skewY(25)" fill="none" stroke="#93c5fd" stroke-opacity="0.55" stroke-width="1.6"/>
      <ellipse cx="-21" cy="0" rx="8" ry="11" transform="skewY(25)" fill="none" stroke="#a5b4fc" stroke-opacity="0.50" stroke-width="1.6"/>
      <ellipse cx="-21" cy="26" rx="8" ry="11" transform="skewY(25)" fill="none" stroke="#6ee7b7" stroke-opacity="0.50" stroke-width="1.6"/>

      <!-- Internal Blade Indicators -->
      <line x1="8" y1="-22" x2="34" y2="-34" stroke="#93c5fd" stroke-opacity="0.65" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="8" y1="-8" x2="34" y2="-20" stroke="#a5b4fc" stroke-opacity="0.60" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="8" y1="6" x2="34" y2="-6" stroke="#6ee7b7" stroke-opacity="0.60" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="12" cy="24" r="2" fill="#6ee7b7" fill-opacity="0.85">
        <animate attributeName="opacity" values="0.9;0.3;0.9" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="20" cy="20" r="2" fill="#93c5fd" fill-opacity="0.85"/>

      <!-- Frosted Glass SQL Pill Hovering Above Server Tower (Wrapped in outer <g>!) -->
      <g transform="translate(0, -100)">
        <g class="holo-1">
          <rect x="-36" y="-12" width="72" height="22" rx="11" fill="#141926" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1"/>
          <text x="0" y="3" text-anchor="middle" class="sans-ui" font-size="9" font-weight="600" fill="#cbd5e1">PostgreSQL</text>
        </g>
      </g>
    </g>

    <!-- 3. ISOMETRIC DEVELOPER WORKSTATION DESK (Center-Left: x=665, y=205) -->
    <g transform="translate(665, 205)">
      <!-- Desk Legs -->
      <polygon points="-78,12 -70,16 -70,62 -78,58" fill="#10131d"/>
      <polygon points="0,50 8,54 8,100 0,96" fill="#10131d"/>
      <polygon points="78,12 70,16 70,62 78,58" fill="#0c0e16"/>

      <!-- Subtle Ambient Glow Beneath Desk -->
      <polygon points="0,-22 86,20 0,62 -86,20" fill="#6366f1" fill-opacity="0.14" filter="url(#softGlow)"/>

      <!-- Isometric Desk Top Surface -->
      <polygon points="0,-26 84,15 0,56 -84,15" fill="url(#deskTopGrad)" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/>
      <polygon points="-84,15 0,56 0,62 -84,21" fill="#141824" stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.8"/>
      <polygon points="84,15 0,56 0,62 84,21" fill="#0f121c" stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.8"/>

      <!-- Minimalist Keyboard -->
      <polygon points="-8,12 18,25 8,31 -18,18" fill="#141824" stroke="#93c5fd" stroke-opacity="0.45" stroke-width="0.8"/>
      <line x1="-12" y1="17" x2="10" y2="28" stroke="#cbd5e1" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="2 2"/>

      <!-- Minimalist Ceramic Mug + Soft Steam -->
      <g transform="translate(42, 14)">
        <path d="M -5 0 L -5 8 A 5 2.5 0 0 0 5 8 L 5 0 Z" fill="#64748b"/>
        <ellipse cx="0" cy="0" rx="5" ry="2.5" fill="#1e293b" stroke="#94a3b8" stroke-width="0.8"/>
        <g class="steam-1">
          <path d="M -2 -3 Q -4 -8, 0 -12" fill="none" stroke="#94a3b8" stroke-opacity="0.6" stroke-width="1" stroke-linecap="round"/>
        </g>
        <g class="steam-2">
          <path d="M 2 -2 Q 4 -7, 1 -11" fill="none" stroke="#94a3b8" stroke-opacity="0.6" stroke-width="1" stroke-linecap="round"/>
        </g>
      </g>

      <!-- MAIN CURVED ISOMETRIC MONITOR (Harmonious Desaturated Code Lines) -->
      <g transform="translate(-18, -32)">
        <polygon points="-4,26 4,30 4,42 -4,38" fill="#334155"/>
        <polygon points="-42,-36 28,-2 28,36 -42,2" fill="url(#screenGlow)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.2"/>
        <line x1="-34" y1="-24" x2="-12" y2="-13" stroke="#93c5fd" stroke-opacity="0.85" stroke-width="2" stroke-linecap="round"/>
        <line x1="-34" y1="-16" x2="6" y2="3" stroke="#cbd5e1" stroke-opacity="0.75" stroke-width="2" stroke-linecap="round">
          <animate attributeName="x2" values="-20;6;6" dur="4s" repeatCount="indefinite"/>
        </line>
        <line x1="-28" y1="-7" x2="14" y2="13" stroke="#6ee7b7" stroke-opacity="0.75" stroke-width="2" stroke-linecap="round">
          <animate attributeName="x2" values="-16;14;14" dur="4s" repeatCount="indefinite"/>
        </line>
        <line x1="-28" y1="1" x2="2" y2="16" stroke="#a5b4fc" stroke-opacity="0.75" stroke-width="2" stroke-linecap="round"/>
        <line x1="-34" y1="8" x2="-8" y2="21" stroke="#64748b" stroke-opacity="0.75" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- SECONDARY VERTICAL ISOMETRIC MONITOR -->
      <g transform="translate(36, -24)">
        <polygon points="-14,-34 18,-18 18,22 -14,6" fill="url(#screenGlow)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.1"/>
        <line x1="-8" y1="-22" x2="10" y2="-13" stroke="#93c5fd" stroke-opacity="0.75" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="-8" y1="-14" x2="6" y2="-7" stroke="#cbd5e1" stroke-opacity="0.65" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="-8" y1="-6" x2="12" y2="4" stroke="#a5b4fc" stroke-opacity="0.75" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="-8" y1="2" x2="4" y2="8" stroke="#6ee7b7" stroke-opacity="0.70" stroke-width="1.8" stroke-linecap="round"/>
      </g>

      <!-- FROSTED GLASS FLOATING CONSOLE ABOVE WORKSTATION (Wrapped in outer <g>!) -->
      <g transform="translate(-8, -112)">
        <g class="holo-2">
          <rect x="-64" y="-18" width="128" height="36" rx="8" fill="#131826" fill-opacity="0.78" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1"/>
          <line x1="-50" y1="-18" x2="30" y2="-18" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
          <circle cx="-52" cy="-9" r="2" fill="#e28787" fill-opacity="0.75"/>
          <circle cx="-45" cy="-9" r="2" fill="#dec184" fill-opacity="0.75"/>
          <circle cx="-38" cy="-9" r="2" fill="#85c192" fill-opacity="0.75"/>
          <text x="0" y="2" text-anchor="middle" class="mono-ui" font-size="8.5" fill="#e2e8f0">
            docker compose up
          </text>
          <text x="0" y="13" text-anchor="middle" class="sans-ui" font-size="8" fill="#6ee7b7">
            ● 4 servicios activos
          </text>
        </g>
      </g>
    </g>

    <!-- 4. TRANSLUCENT FROSTED GLASS 3D PRISM (Front-Left: x=582, y=262, wrapped in outer <g>!) -->
    <g transform="translate(582, 262)">
      <g class="holo-1">
        <ellipse cx="0" cy="24" rx="18" ry="7" fill="#6366f1" fill-opacity="0.14"/>
        <polygon points="0,-16 20,-6 0,4 -20,-6" fill="#93c5fd" fill-opacity="0.45" stroke="#ffffff" stroke-opacity="0.35" stroke-width="0.9"/>
        <polygon points="-20,-6 0,4 0,20 -20,10" fill="#6366f1" fill-opacity="0.35" stroke="#ffffff" stroke-opacity="0.2" stroke-width="0.8"/>
        <polygon points="20,-6 0,4 0,20 20,10" fill="#38bdf8" fill-opacity="0.30" stroke="#ffffff" stroke-opacity="0.2" stroke-width="0.8"/>
      </g>
    </g>
  </g>
</svg>
