<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b0d14; }
      .grid { stroke: #161926; stroke-width: 1; }
      .card { fill: #111420; stroke: #24293e; stroke-width: 1.5; }
      .card-inner { fill: #0d101a; stroke: #1e2436; stroke-width: 1; }
      .mono-title { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; font-weight: 700; fill: #a9b1d6; letter-spacing: 1.2px; }
      .name-h1 { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 800; fill: #c0caf5; letter-spacing: 0.4px; }
      .role-sub { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 700; fill: #7aa2f7; letter-spacing: 0.6px; }
      .card-h { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
      .card-p { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #9aa5ce; }
      .mono-sm { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; fill: #787c99; }
      .mono-val { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; }
      .kpi-num { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 800; }
      .kpi-lbl { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; font-weight: 700; fill: #565f89; letter-spacing: 0.8px; }

      @keyframes floatBadge {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -24; }
      }
      .float-iso { animation: floatBadge 4s ease-in-out infinite; }
      .pulse-led { animation: pulseGlow 2.4s ease-in-out infinite; }
      .dash-line { stroke-dasharray: 4 4; animation: flowDash 1.5s linear infinite; }
    </style>

    <pattern id="dnaGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" class="grid"/>
    </pattern>

    <linearGradient id="barJs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0af68"/>
      <stop offset="100%" stop-color="#73daca"/>
    </linearGradient>
    <linearGradient id="barTs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d59a1"/>
      <stop offset="100%" stop-color="#7dcfff"/>
    </linearGradient>
    <linearGradient id="barCs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7847bd"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
    <linearGradient id="barPy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ac3de"/>
      <stop offset="100%" stop-color="#9ece6a"/>
    </linearGradient>
  </defs>

  <!-- Outer Frame -->
  <rect width="1000" height="450" rx="14" class="bg"/>
  <rect width="1000" height="450" rx="14" fill="url(#dnaGrid)" opacity="0.65"/>
  <rect x="1" y="1" width="998" height="448" rx="13" fill="none" stroke="#24293e" stroke-width="1.5"/>

  <!-- Top Bar Header -->
  <rect x="1" y="1" width="998" height="38" rx="13" fill="#131624"/>
  <line x1="1" y1="39" x2="999" y2="39" stroke="#24293e" stroke-width="1"/>
  <circle cx="24" cy="20" r="4.5" fill="#73daca" class="pulse-led"/>
  <text x="38" y="24" class="mono-title">JHON ANDERSON MORENO POSSO // DOSSIER DE INGENIERÍA &amp; ADN DE REPOSITORIOS</text>
  <text x="976" y="24" class="mono-sm" text-anchor="end" fill="#7aa2f7">MEDELLÍN, CO · SENA ADSO · @Jhonmoreno000</text>

  <!-- ======================================================================= -->
  <!-- LEFT COLUMN: PERSONAL ENGINEERING DOSSIER & TRAJECTORY (x=22..478)      -->
  <!-- ======================================================================= -->
  <rect x="22" y="54" width="456" height="376" rx="10" class="card"/>

  <!-- Personal Identity Header Card -->
  <rect x="36" y="68" width="428" height="86" rx="8" class="card-inner"/>

  <!-- 3D Isometric Personal Monogram Cube on Left (Safely nested transform!) -->
  <g transform="translate(80, 112)">
    <g class="float-iso">
      <!-- Outer glowing base diamond -->
      <polygon points="0,-30 32,-14 0,2 -32,-14" fill="#161926" stroke="#7aa2f7" stroke-width="1.2"/>
      <!-- 3D Cube Top -->
      <polygon points="0,-28 22,-17 0,-6 -22,-17" fill="#7aa2f7"/>
      <!-- 3D Cube Left -->
      <polygon points="-22,-17 0,-6 0,18 -22,7" fill="#3d59a1"/>
      <!-- 3D Cube Right -->
      <polygon points="22,-17 0,-6 0,18 22,7" fill="#2ac3de"/>
      <text x="0" y="-14" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#0b0d14" text-anchor="middle">JM</text>
      <text x="-11" y="4" font-family="'JetBrains Mono', monospace" font-size="6.5" font-weight="800" fill="#ffffff" text-anchor="middle">SQL</text>
      <text x="11" y="4" font-family="'JetBrains Mono', monospace" font-size="6.5" font-weight="800" fill="#0b0d14" text-anchor="middle">API</text>
    </g>
  </g>

  <!-- Personal Bio & Credentials -->
  <text x="128" y="90" class="name-h1">Jhon Anderson Moreno Posso</text>
  <text x="128" y="108" class="role-sub">BACKEND ENGINEER · DEVSECOPS · ARQUITECTURA SQL</text>

  <rect x="128" y="118" width="146" height="20" rx="4" fill="#132226" stroke="#73daca" stroke-width="0.8"/>
  <text x="201" y="132" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#73daca" text-anchor="middle">SENA · TECNÓLOGO ADSO</text>

  <rect x="282" y="118" width="166" height="20" rx="4" fill="#161926" stroke="#bb9af7" stroke-width="0.8"/>
  <text x="365" y="132" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#bb9af7" text-anchor="middle">MEDELLÍN, COLOMBIA (UTC-5)</text>

  <!-- Section Title: 3 Personal Pillars -->
  <text x="36" y="176" class="mono-sm" fill="#7aa2f7" font-weight="700">// PILARES TÉCNICOS &amp; ENFOQUE DE INGENIERÍA PERSONAL</text>

  <!-- Pillar 1: SENA ADSO & Clean Architecture -->
  <rect x="36" y="186" width="428" height="68" rx="7" class="card-inner"/>
  <rect x="36" y="186" width="4" height="68" rx="2" fill="#7aa2f7"/>
  <text x="52" y="205" class="card-h" fill="#7aa2f7">01 · FORMACIÓN ADSO (SENA) &amp; CLEAN ARCHITECTURE</text>
  <text x="452" y="205" class="mono-sm" text-anchor="end" fill="#73daca">SOLID · DDD · TDD</text>
  <text x="52" y="224" class="card-p">Diseño de software desacoplado en capas, contratos REST estrictos,</text>
  <text x="52" y="241" class="card-p">inversión de dependencias y validación continua con suites de pruebas.</text>

  <!-- Pillar 2: Simulation-Driven Engineering (NEXUS & Architect-TD) -->
  <rect x="36" y="264" width="428" height="68" rx="7" class="card-inner"/>
  <rect x="36" y="264" width="4" height="68" rx="2" fill="#bb9af7"/>
  <text x="52" y="283" class="card-h" fill="#bb9af7">02 · CREADOR DE SIMULADORES TÉCNICOS INTERACTIVOS</text>
  <text x="452" y="283" class="mono-sm" text-anchor="end" fill="#e0af68">NEXUS &amp; ARCHITECT-TD</text>
  <text x="52" y="302" class="card-p">Construcción de motores propios: PostgreSQL 16 en memoria (pg-mem)</text>
  <text x="52" y="319" class="card-p">para incidentes SQL reales y defensa perimetral 360° con generador IaC.</text>

  <!-- Pillar 3: DevSecOps, Multi-Stage Docker & Enterprise POS -->
  <rect x="36" y="342" width="428" height="72" rx="7" class="card-inner"/>
  <rect x="36" y="342" width="4" height="72" rx="2" fill="#73daca"/>
  <text x="52" y="361" class="card-h" fill="#73daca">03 · DEVSECOPS SHIFT-LEFT, DOCKER &amp; SISTEMAS POS (.NET 10)</text>
  <text x="452" y="361" class="mono-sm" text-anchor="end" fill="#7dcfff">DOCKER · SAST IA</text>
  <text x="52" y="380" class="card-p">Orquestación multi-contenedor (Node/Mongo/Postgres), auditoría SAST</text>
  <text x="52" y="397" class="card-p">con LLMs locales (Ollama SHA-256) y analíticas nativas GDI+ a 60 FPS.</text>

  <!-- ======================================================================= -->
  <!-- RIGHT COLUMN: REAL GITHUB REPOSITORY CODEBASE DNA (x=496..978)          -->
