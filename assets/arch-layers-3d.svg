  <g transform="translate(514, 224)">
    <text x="0" y="14" class="card-h" fill="#bb9af7">C# 12 (.NET 10.0 WinForms GDI+) &amp; Java Spring Boot</text>
    <text x="446" y="14" class="mono-val" fill="#bb9af7" text-anchor="end">64.0 KB · 11.2%</text>
    <text x="0" y="30" class="mono-sm">Repos: GCP-GESTION-DE-PRODUCTOS- (POS 60FPS · FormVentas/Catalogo) + D&amp;D ERP</text>
    <!-- Progress Track -->
    <rect x="0" y="38" width="446" height="10" rx="5" fill="#0b0d14" stroke="#1e2436" stroke-width="1"/>
    <rect x="0" y="38" width="96" height="10" rx="5" fill="url(#barCs)">
      <animate attributeName="width" values="0;96" dur="1.4s" fill="freeze"/>
    </rect>
  </g>

  <!-- Language 4: Python 3, Docker Multi-Stage & HTML/Tailwind -->
  <g transform="translate(514, 286)">
    <text x="0" y="14" class="card-h" fill="#9ece6a">Python 3 · Docker Compose IaC · HTML5/Tailwind</text>
    <text x="446" y="14" class="mono-val" fill="#9ece6a" text-anchor="end">57.8 KB · 6.3%</text>
    <text x="0" y="30" class="mono-sm">Repos: I-work-in-python (ejercicio_1..8.py) + Dockerfiles en 4 repos + Ollama SAST</text>
    <!-- Progress Track -->
    <rect x="0" y="38" width="446" height="10" rx="5" fill="#0b0d14" stroke="#1e2436" stroke-width="1"/>
    <rect x="0" y="38" width="68" height="10" rx="5" fill="url(#barPy)">
      <animate attributeName="width" values="0;68" dur="1.4s" fill="freeze"/>
