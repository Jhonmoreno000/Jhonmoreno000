    <!-- Progress Track -->
    <rect x="0" y="38" width="446" height="10" rx="5" fill="#0b0d14" stroke="#1e2436" stroke-width="1"/>
    <rect x="0" y="38" width="248" height="10" rx="5" fill="url(#barJs)">
      <animate attributeName="width" values="0;248" dur="1.4s" fill="freeze"/>
    </rect>
  </g>

  <!-- Language 2: TypeScript 5.3 / Fastify / React 18 -->
  <g transform="translate(514, 162)">
    <text x="0" y="14" class="card-h" fill="#7dcfff">TypeScript 5.3 · Fastify 4.26 · React 18</text>
    <text x="446" y="14" class="mono-val" fill="#7dcfff" text-anchor="end">278.7 KB · 27.1%</text>
    <text x="0" y="30" class="mono-sm">Repo: NEXUS (Monorepo SQL IDE · Monaco Editor · PostgreSQL 16 pg-mem Engine)</text>
    <!-- Progress Track -->
    <rect x="0" y="38" width="446" height="10" rx="5" fill="#0b0d14" stroke="#1e2436" stroke-width="1"/>
    <rect x="0" y="38" width="160" height="10" rx="5" fill="url(#barTs)">
      <animate attributeName="width" values="0;160" dur="1.4s" fill="freeze"/>
    </rect>
  </g>

