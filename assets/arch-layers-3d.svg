  <!-- Bottom Live Repository KPI Counters (4 Mini Telemetry Cards) -->
  <g transform="translate(514, 352)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="104" height="62" rx="7" class="card-inner"/>
    <text x="52" y="28" class="kpi-num" fill="#7aa2f7" text-anchor="middle">07</text>
    <text x="52" y="44" class="kpi-lbl" text-anchor="middle">REPOS PÚBLICOS</text>
    <text x="52" y="55" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#73daca" text-anchor="middle">100% OPEN SOURCE</text>

    <!-- KPI 2 -->
    <rect x="114" y="0" width="104" height="62" rx="7" class="card-inner"/>
    <text x="166" y="28" class="kpi-num" fill="#73daca" text-anchor="middle">918 KB</text>
    <text x="166" y="44" class="kpi-lbl" text-anchor="middle">CÓDIGO FUENTE</text>
    <text x="166" y="55" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#7aa2f7" text-anchor="middle">TS · JS · C# · PY</text>

    <!-- KPI 3 -->
    <rect x="228" y="0" width="104" height="62" rx="7" class="card-inner"/>
    <text x="280" y="28" class="kpi-num" fill="#bb9af7" text-anchor="middle">56 PASS</text>
    <text x="280" y="44" class="kpi-lbl" text-anchor="middle">SUITE DE TESTS</text>
    <text x="280" y="55" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#e0af68" text-anchor="middle">ARCHITECT-TD CI</text>

    <!-- KPI 4 -->
    <rect x="342" y="0" width="104" height="62" rx="7" class="card-inner"/>
    <text x="394" y="28" class="kpi-num" fill="#e0af68" text-anchor="middle">04 STACKS</text>
    <text x="394" y="44" class="kpi-lbl" text-anchor="middle">DOCKER COMPOSE</text>
    <text x="394" y="55" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#9ece6a" text-anchor="middle">MULTI-CONTAINER</text>
  </g>
</svg>
