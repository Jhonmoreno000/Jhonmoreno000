<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" height="460">
  <defs>
    <linearGradient id="didBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03070b"/>
      <stop offset="50%" stop-color="#061019"/>
      <stop offset="100%" stop-color="#020508"/>
    </linearGradient>

    <radialGradient id="didOrb1" cx="22%" cy="28%" r="46%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#03070b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="didOrb2" cx="78%" cy="72%" r="46%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#03070b" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="didPanel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1722" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#050c13" stop-opacity="0.94"/>
    </linearGradient>

    <linearGradient id="didSub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1e2d" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#050d15" stop-opacity="0.88"/>
    </linearGradient>

    <linearGradient id="didBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00ff9d" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Tactical Cyber Progress Bar Gradients -->
    <linearGradient id="cyberBar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#00ff9d"/>
    </linearGradient>
    <linearGradient id="cyberBar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="cyberBar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="cyberBar4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <pattern id="didGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00e5ff" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>

    <style>
      .mono-top { font-family: 'JetBrains Mono', 'Share Tech Mono', 'Fira Code', Consolas, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.7px; }
      .disp-h1 { font-family: 'Orbitron', 'Rajdhani', 'Space Grotesk', 'Inter', sans-serif; font-size: 16px; font-weight: 800; fill: #f8fafc; letter-spacing: 0.4px; }
      .mono-sub { font-family: 'JetBrains Mono', 'Share Tech Mono', 'Fira Code', Consolas, monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.4px; }
      .card-title { font-family: 'JetBrains Mono', 'Share Tech Mono', 'Fira Code', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #f1f5f9; }
      .card-desc { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.2px; fill: #94a3b8; }
      .kpi-val { font-family: 'Orbitron', 'JetBrains Mono', monospace; font-size: 16px; font-weight: 800; }

      @keyframes layerFloat1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes layerFloat2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes pulseBeacon {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
      .iso-layer-1 { animation: layerFloat1 3.6s ease-in-out infinite; }
      .iso-layer-2 { animation: layerFloat2 3.6s ease-in-out infinite; }
      .beacon-dot { animation: pulseBeacon 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1000" height="460" rx="14" fill="url(#didBg)"/>
  <rect width="1000" height="460" rx="14" fill="url(#didGrid)"/>
  <rect width="1000" height="460" rx="14" fill="url(#didOrb1)"/>
  <rect width="1000" height="460" rx="14" fill="url(#didOrb2)"/>

  <!-- Outer Armored Frame & Corner Brackets -->
  <rect x="1.5" y="1.5" width="997" height="457" rx="13" fill="none" stroke="url(#didBorder)" stroke-width="1.3"/>
  <path d="M 14 2 L 2 2 L 2 16" fill="none" stroke="#00ff9d" stroke-width="2"/>
  <path d="M 986 2 L 998 2 L 998 16" fill="none" stroke="#00e5ff" stroke-width="2"/>
  <path d="M 14 458 L 2 458 L 2 444" fill="none" stroke="#00e5ff" stroke-width="2"/>
  <path d="M 986 458 L 998 458 L 998 444" fill="none" stroke="#00ff9d" stroke-width="2"/>

  <!-- Top Header Bar -->
  <rect x="2" y="2" width="996" height="36" rx="12" fill="#07131e" fill-opacity="0.9"/>
  <line x1="2" y1="38" x2="998" y2="38" stroke="#00ff9d" stroke-opacity="0.22" stroke-width="1"/>
  <circle cx="24" cy="20" r="3.5" fill="#00ff9d" class="beacon-dot"/>
  <text x="38" y="24" class="mono-top" fill="#e2e8f0">
    [ DEFENSE-IN-DEPTH // ARQUITECTURA DE SEGURIDAD &amp; TELEMETRIA DE CODIGO ]
  </text>
  <text x="978" y="24" text-anchor="end" class="mono-sub" fill="#00e5ff">
    OWASP ASVS // ISO 25010 // @JHONMORENO000
  </text>

  <!-- ======================================================================= -->
  <!-- LEFT COLUMN: DEFENSE-IN-DEPTH DOSSIER & 3 SECURITY LAYERS (x=20..480)   -->
  <!-- ======================================================================= -->
  <rect x="20" y="50" width="460" height="392" rx="10" fill="url(#didPanel)" stroke="url(#didBorder)" stroke-width="1"/>
  <line x1="36" y1="51" x2="240" y2="51" stroke="#00ff9d" stroke-opacity="0.65" stroke-width="1.5"/>

  <!-- Top Operator Header Card -->
  <rect x="34" y="64" width="432" height="86" rx="8" fill="url(#didSub)" stroke="#00e5ff" stroke-opacity="0.28"/>

  <!-- Animated 3D Isometric Layered Defense Stack Icon -->
  <g transform="translate(76, 114)">
    <!-- Base Layer (Data/Persistence) -->
    <polygon points="0,-6 28,8 0,22 -28,8" fill="#061824" stroke="#00e5ff" stroke-width="1.2"/>
    <!-- Middle Layer (API/Zero-Trust) -->
    <g class="iso-layer-1">
      <polygon points="0,-18 28,-4 0,10 -28,-4" fill="#082836" stroke="#00e5ff" stroke-width="1.2"/>
    </g>
    <!-- Top Crown Layer (WAF/SAST Shield) -->
    <g class="iso-layer-2">
      <polygon points="0,-30 28,-16 0,-2 -28,-16" fill="#00ff9d" fill-opacity="0.25" stroke="#00ff9d" stroke-width="1.4"/>
      <circle cx="0" cy="-16" r="3" fill="#00ff9d"/>
    </g>
  </g>

  <text x="120" y="88" class="disp-h1">JHON ANDERSON MORENO POSSO</text>
  <text x="120" y="106" class="mono-sub" fill="#00ff9d">INGENIERO BACKEND // DEVSECOPS &amp; CIBERDEFENSA</text>

  <rect x="120" y="116" width="154" height="22" rx="4" fill="#040a10" stroke="#00ff9d" stroke-opacity="0.35"/>
  <text x="197" y="131" class="mono-sub" font-size="9.5" fill="#cbd5e1" text-anchor="middle">SENA :: TECNOLOGO ADSO</text>

  <rect x="282" y="116" width="170" height="22" rx="4" fill="#040a10" stroke="#00e5ff" stroke-opacity="0.35"/>
  <text x="367" y="131" class="mono-sub" font-size="9.5" fill="#00e5ff" text-anchor="middle">ZERO-TRUST &amp; CLEAN ARCH</text>

  <text x="36" y="172" class="mono-sub" fill="#00e5ff" letter-spacing="0.8">
    &gt;&gt; CAPAS DE INGENIERIA Y SEGURIDAD APLICADA EN MIS SISTEMAS
  </text>

  <!-- Pillar 1: Shift-Left & AI SAST -->
  <rect x="34" y="182" width="432" height="74" rx="7" fill="url(#didSub)" stroke="#1e293b"/>
  <rect x="34" y="182" width="3.5" height="74" rx="1.5" fill="#00ff9d"/>
  <text x="48" y="201" class="card-title">01 // AUDITORIA SAST CON IA LOCAL &amp; SHIFT-LEFT</text>
  <text x="454" y="201" class="mono-sub" font-size="9.5" text-anchor="end" fill="#00ff9d">SECDEV · QWEN 2.5 7B</text>
  <text x="48" y="221" class="card-desc">Estación nativa de ciberseguridad con inferencia LLM local (Qwen 2.5 Coder</text>
  <text x="48" y="238" class="card-desc">7B / Ollama), análisis estático Semgrep/Bandit y deduplicación SHA-256.</text>

  <!-- Pillar 2: Cryptographic FinTech & Identity -->
  <rect x="34" y="266" width="432" height="74" rx="7" fill="url(#didSub)" stroke="#1e293b"/>
  <rect x="34" y="266" width="3.5" height="74" rx="1.5" fill="#00e5ff"/>
  <text x="48" y="285" class="card-title">02 // CRIPTOGRAFIA TRANSACCIONAL &amp; BLINDAJE API</text>
  <text x="454" y="285" class="mono-sub" font-size="9.5" text-anchor="end" fill="#00e5ff">SHA-256 · OAUTH2 · ASVS</text>
  <text x="48" y="305" class="card-desc">Verificación criptográfica SHA-256 en webhooks de pasarelas (Wompi),</text>
  <text x="48" y="322" class="card-desc">SSO certificado directo con Google/Microsoft y Rate Limiting (1200 req/m).</text>

  <!-- Pillar 3: Perimeter Defense & ACID Resilience -->
  <rect x="34" y="350" width="432" height="76" rx="7" fill="url(#didSub)" stroke="#1e293b"/>
  <rect x="34" y="350" width="3.5" height="76" rx="1.5" fill="#2dd4bf"/>
  <text x="48" y="369" class="card-title">03 // DEFENSA PERIMETRAL 360 &amp; MOTORES SQL ACID</text>
  <text x="454" y="369" class="mono-sub" font-size="9.5" text-anchor="end" fill="#2dd4bf">NEXUS · ARCHITECT-TD</text>
  <text x="48" y="389" class="card-desc">Simulación de mitigación SYN Flood, SQLi y MITM con nodos WAF/Envoy, y</text>
  <text x="48" y="406" class="card-desc">resolución de deadlocks transaccionales sobre PostgreSQL 16/17.</text>

  <!-- ======================================================================= -->
  <!-- RIGHT COLUMN: ARSENAL CODEBASE DISTRIBUTION & TELEMETRY (x=496..980)    -->
  <!-- ======================================================================= -->
  <rect x="496" y="50" width="484" height="392" rx="10" fill="url(#didPanel)" stroke="url(#didBorder)" stroke-width="1"/>
  <line x1="514" y1="51" x2="760" y2="51" stroke="#00e5ff" stroke-opacity="0.65" stroke-width="1.5"/>

  <text x="514" y="75" class="mono-top" fill="#f1f5f9">ARSENAL DE CODIGO POR ECOSISTEMA &amp; PROYECTO</text>
  <text x="962" y="75" class="mono-sub" text-anchor="end" fill="#00ff9d">09 REPOSITORIOS ACTIVOS</text>
  <line x1="514" y1="86" x2="962" y2="86" stroke="#1e293b" stroke-width="1"/>

  <!-- Bar 1: JavaScript ES6+ / React / Node.js -->
  <g transform="translate(514, 98)">
    <text x="0" y="14" class="card-title">JAVASCRIPT ES6+ // REACT 18 // NODE.JS 20</text>
    <text x="448" y="14" class="mono-sub" fill="#00ff9d" text-anchor="end">46.5% // CORE STACK</text>
    <text x="0" y="31" class="card-desc">D&amp;D Textil E-Commerce · architect-td (56 Tests · WAF Sim) · Todo-API</text>
    <rect x="0" y="40" width="448" height="8" rx="3" fill="#03070b" stroke="#1e293b"/>
    <rect x="0" y="40" width="268" height="8" rx="3" fill="url(#cyberBar1)">
      <animate attributeName="width" values="0;268" dur="1.4s" fill="freeze"/>
    </rect>
  </g>

  <!-- Bar 2: TypeScript 5.3 / Fastify / PostgreSQL 16 -->
  <g transform="translate(514, 162)">
    <text x="0" y="14" class="card-title">TYPESCRIPT 5.3 // FASTIFY 4.26 // SQL ENGINE</text>
    <text x="448" y="14" class="mono-sub" fill="#00e5ff" text-anchor="end">24.8% // ACID &amp; IDE</text>
    <text x="0" y="31" class="card-desc">NEXUS (Simulador SQL PostgreSQL 16 pg-mem · Deadlocks · EXPLAIN)</text>
    <rect x="0" y="40" width="448" height="8" rx="3" fill="#03070b" stroke="#1e293b"/>
    <rect x="0" y="40" width="176" height="8" rx="3" fill="url(#cyberBar2)">
      <animate attributeName="width" values="0;176" dur="1.4s" fill="freeze"/>
    </rect>
  </g>

  <!-- Bar 3: Java 21 & C# 12 (.NET 10 / Direct3D / GDI+) -->
  <g transform="translate(514, 226)">
    <text x="0" y="14" class="card-title">JAVA 21 &amp; C# 12 (.NET 10 // DIRECT3D &amp; GDI+)</text>
    <text x="448" y="14" class="mono-sub" fill="#2dd4bf" text-anchor="end">18.4% // NATIVE &amp; API</text>
    <text x="0" y="31" class="card-desc">secdev (Estación IA Ciberseguridad C#) · D&amp;D Backend JDBC · GCP POS</text>
    <rect x="0" y="40" width="448" height="8" rx="3" fill="#03070b" stroke="#1e293b"/>
    <rect x="0" y="40" width="132" height="8" rx="3" fill="url(#cyberBar3)">
      <animate attributeName="width" values="0;132" dur="1.4s" fill="freeze"/>
    </rect>
  </g>

  <!-- Bar 4: Python 3.12 / Docker / SAST Orchestration -->
  <g transform="translate(514, 290)">
    <text x="0" y="14" class="card-title">PYTHON 3.12 // DOCKER MULTI-STAGE // SAST IA</text>
    <text x="448" y="14" class="mono-sub" fill="#38bdf8" text-anchor="end">10.3% // SEC-AUTOMATION</text>
    <text x="0" y="31" class="card-desc">Orquestador SAST Ollama · I-work-in-python (Big-O) · Contenedores</text>
    <rect x="0" y="40" width="448" height="8" rx="3" fill="#03070b" stroke="#1e293b"/>
    <rect x="0" y="40" width="92" height="8" rx="3" fill="url(#cyberBar4)">
      <animate attributeName="width" values="0;92" dur="1.4s" fill="freeze"/>
    </rect>
  </g>

  <!-- Bottom 4 Tactical HUD KPI Counters -->
  <g transform="translate(514, 356)">
    <rect x="0" y="0" width="104" height="68" rx="6" fill="url(#didSub)" stroke="#00ff9d" stroke-opacity="0.35"/>
    <text x="52" y="28" class="kpi-val" fill="#00ff9d" text-anchor="middle">09</text>
    <text x="52" y="45" class="mono-sub" font-size="9" fill="#e2e8f0" text-anchor="middle">REPOSITORIOS</text>
    <text x="52" y="58" class="mono-sub" font-size="8.5" fill="#64748b" text-anchor="middle">OPEN SOURCE</text>

    <rect x="114" y="0" width="104" height="68" rx="6" fill="url(#didSub)" stroke="#00e5ff" stroke-opacity="0.35"/>
    <text x="166" y="28" class="kpi-val" fill="#00e5ff" text-anchor="middle">SHA-256</text>
    <text x="166" y="45" class="mono-sub" font-size="9" fill="#e2e8f0" text-anchor="middle">CRIPTOGRAFIA</text>
    <text x="166" y="58" class="mono-sub" font-size="8.5" fill="#64748b" text-anchor="middle">JWT · OAUTH2</text>

    <rect x="228" y="0" width="104" height="68" rx="6" fill="url(#didSub)" stroke="#2dd4bf" stroke-opacity="0.35"/>
    <text x="280" y="28" class="kpi-val" fill="#2dd4bf" text-anchor="middle">56+ TESTS</text>
    <text x="280" y="45" class="mono-sub" font-size="9" fill="#e2e8f0" text-anchor="middle">SUITE ACTIVA</text>
    <text x="280" y="58" class="mono-sub" font-size="8.5" fill="#64748b" text-anchor="middle">OWASP ASVS</text>

    <rect x="342" y="0" width="106" height="68" rx="6" fill="url(#didSub)" stroke="#38bdf8" stroke-opacity="0.35"/>
    <text x="395" y="28" class="kpi-val" fill="#38bdf8" text-anchor="middle">05 STACKS</text>
    <text x="395" y="45" class="mono-sub" font-size="9" fill="#e2e8f0" text-anchor="middle">DOCKERIZADOS</text>
    <text x="395" y="58" class="mono-sub" font-size="8.5" fill="#64748b" text-anchor="middle">NON-ROOT UID</text>
  </g>
</svg>
