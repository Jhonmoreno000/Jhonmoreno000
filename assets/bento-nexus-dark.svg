<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 232" width="100%" height="232">
  <defs>
    <linearGradient id="bgB_nexus_dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a10"/>
      <stop offset="100%" stop-color="#08121d"/>
    </linearGradient>
    <pattern id="dotsB_nexus_dark" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#00e5ff" fill-opacity="0.13"/>
