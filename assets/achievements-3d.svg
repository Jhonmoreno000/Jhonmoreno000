<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="100%" height="250">
  <defs>
    <linearGradient id="achBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040710"/>
      <stop offset="50%" stop-color="#081122"/>
      <stop offset="100%" stop-color="#04070e"/>
    </linearGradient>

    <linearGradient id="vaultCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1326"/>
      <stop offset="100%" stop-color="#050912"/>
    </linearGradient>

    <filter id="badgeGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes hexFloat1 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-7px); } }
      @keyframes hexFloat2 { 0%, 100% { transform: translateY(-6px); } 50% { transform: translateY(2px); } }
      .hex-1 { animation: hexFloat1 3.4s ease-in-out infinite; }
      .hex-2 { animation: hexFloat2 3.8s ease-in-out infinite; }
      .hex-3 { animation: hexFloat1 4.1s ease-in-out infinite 0.5s; }
      .hex-4 { animation: hexFloat2 3.6s ease-in-out infinite 0.7s; }
    </style>
  </defs>

  <!-- Main Container -->
  <rect width="960" height="250" rx="14" fill="url(#achBg)"/>
  <rect x="1" y="1" width="958" height="248" rx="13" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Header -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" letter-spacing="1.2">
    <circle cx="32" cy="24" r="4" fill="#fbbf24">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="44" y="28" fill="#e2e8f0" font-weight="700">3D CREDENTIALS &amp; ACHIEVEMENTS VAULT // ENGINEERING MASTERY</text>
    <text x="932" y="28" text-anchor="end" fill="#fbbf24" font-weight="700">4 CORE BADGES UNLOCKED</text>
  </g>
  <line x1="24" y1="42" x2="936" y2="42" stroke="#1e293b" stroke-width="1"/>

  <!-- ==================== BADGE 01: SENA ADSO ==================== -->
  <g transform="translate(24, 56)">
    <rect width="214" height="174" rx="10" fill="url(#vaultCard)" stroke="#0284c7" stroke-opacity="0.6" stroke-width="1.2"/>
    <line x1="20" y1="1" x2="194" y2="1" stroke="#00f2fe" stroke-width="2.5"/>

    <!-- Isometric Glowing Pedestal -->
    <ellipse cx="107" cy="92" rx="44" ry="14" fill="#071930" stroke="#00f2fe" stroke-width="1"/>
    <ellipse cx="107" cy="92" rx="28" ry="8" fill="none" stroke="#38bdf8" stroke-dasharray="4 3" stroke-width="0.8"/>

    <!-- Floating 3D Hexagonal Medallion -->
    <g class="hex-1" transform="translate(107, 56)">
      <!-- 3D Hexagon Top & Side Faces -->
      <polygon points="0,-28 28,-16 28,4 0,16 -28,4 -28,-16" fill="#0284c7" stroke="#7dd3fc" stroke-width="1.2"/>
      <polygon points="0,-22 22,-12 22,2 0,12 -22,2 -22,-12" fill="#00f2fe" fill-opacity="0.25" stroke="#ffffff" stroke-width="0.8"/>
      <polygon points="-28,4 0,16 0,26 -28,14" fill="#0369a1" stroke="#38bdf8" stroke-width="0.8"/>
      <polygon points="28,4 0,16 0,26 28,14" fill="#075985" stroke="#0284c7" stroke-width="0.8"/>
      <text x="0" y="-2" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#ffffff">ADSO</text>
    </g>

    <text x="107" y="122" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800" fill="#00f2fe">TECNÓLOGO SENA ADSO</text>
    <text x="107" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#cbd5e1">Análisis y Desarrollo de Software</text>
    <rect x="32" y="148" width="150" height="18" rx="4" fill="#061528" stroke="#0284c7" stroke-width="0.8"/>
    <text x="107" y="160" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#38bdf8">VERIFIED FORMATION</text>
  </g>

  <!-- ==================== BADGE 02: DEVSECOPS & AI ==================== -->
  <g transform="translate(256, 56)">
    <rect width="214" height="174" rx="10" fill="url(#vaultCard)" stroke="#7c3aed" stroke-opacity="0.6" stroke-width="1.2"/>
    <line x1="20" y1="1" x2="194" y2="1" stroke="#c084fc" stroke-width="2.5"/>

    <ellipse cx="107" cy="92" rx="44" ry="14" fill="#160c2e" stroke="#c084fc" stroke-width="1"/>
    <ellipse cx="107" cy="92" rx="28" ry="8" fill="none" stroke="#c084fc" stroke-dasharray="4 3" stroke-width="0.8"/>

    <!-- Floating 3D Hexagonal Medallion -->
    <g class="hex-2" transform="translate(107, 56)">
      <polygon points="0,-28 28,-16 28,4 0,16 -28,4 -28,-16" fill="#7c3aed" stroke="#e9d5ff" stroke-width="1.2"/>
      <polygon points="0,-22 22,-12 22,2 0,12 -22,2 -22,-12" fill="#c084fc" fill-opacity="0.25" stroke="#ffffff" stroke-width="0.8"/>
      <polygon points="-28,4 0,16 0,26 -28,14" fill="#5b21b6" stroke="#c084fc" stroke-width="0.8"/>
      <polygon points="28,4 0,16 0,26 28,14" fill="#4c1d95" stroke="#7c3aed" stroke-width="0.8"/>
      <text x="0" y="-2" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#ffffff">SEC-AI</text>
    </g>

    <text x="107" y="122" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800" fill="#c084fc">SHIFT-LEFT DEVSECOPS</text>
    <text x="107" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#cbd5e1">SAST/DAST · Docker · Ollama</text>
    <rect x="32" y="148" width="150" height="18" rx="4" fill="#140a29" stroke="#7c3aed" stroke-width="0.8"/>
    <text x="107" y="160" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#c084fc">ZERO-TRUST PIPELINES</text>
  </g>

  <!-- ==================== BADGE 03: CLEAN ARCHITECTURE ==================== -->
  <g transform="translate(488, 56)">
    <rect width="214" height="174" rx="10" fill="url(#vaultCard)" stroke="#059669" stroke-opacity="0.6" stroke-width="1.2"/>
    <line x1="20" y1="1" x2="194" y2="1" stroke="#34d399" stroke-width="2.5"/>

    <ellipse cx="107" cy="92" rx="44" ry="14" fill="#051f18" stroke="#34d399" stroke-width="1"/>
    <ellipse cx="107" cy="92" rx="28" ry="8" fill="none" stroke="#34d399" stroke-dasharray="4 3" stroke-width="0.8"/>

    <!-- Floating 3D Hexagonal Medallion -->
    <g class="hex-3" transform="translate(107, 56)">
      <polygon points="0,-28 28,-16 28,4 0,16 -28,4 -28,-16" fill="#059669" stroke="#a7f3d0" stroke-width="1.2"/>
      <polygon points="0,-22 22,-12 22,2 0,12 -22,2 -22,-12" fill="#34d399" fill-opacity="0.25" stroke="#ffffff" stroke-width="0.8"/>
      <polygon points="-28,4 0,16 0,26 -28,14" fill="#047857" stroke="#34d399" stroke-width="0.8"/>
      <polygon points="28,4 0,16 0,26 28,14" fill="#065f46" stroke="#059669" stroke-width="0.8"/>
      <text x="0" y="-2" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#ffffff">SOLID</text>
    </g>

    <text x="107" y="122" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800" fill="#34d399">CLEAN ARCH &amp; DDD</text>
    <text x="107" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#cbd5e1">Arquitectura Hexagonal y TDD</text>
    <rect x="32" y="148" width="150" height="18" rx="4" fill="#041a14" stroke="#059669" stroke-width="0.8"/>
    <text x="107" y="160" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#34d399">MODULAR &amp; DECOUPLED</text>
  </g>

  <!-- ==================== BADGE 04: DATABASE ENGINE MASTER ==================== -->
  <g transform="translate(720, 56)">
    <rect width="214" height="174" rx="10" fill="url(#vaultCard)" stroke="#d97706" stroke-opacity="0.6" stroke-width="1.2"/>
    <line x1="20" y1="1" x2="194" y2="1" stroke="#fbbf24" stroke-width="2.5"/>

    <ellipse cx="107" cy="92" rx="44" ry="14" fill="#211504" stroke="#fbbf24" stroke-width="1"/>
    <ellipse cx="107" cy="92" rx="28" ry="8" fill="none" stroke="#fbbf24" stroke-dasharray="4 3" stroke-width="0.8"/>

    <!-- Floating 3D Hexagonal Medallion -->
    <g class="hex-4" transform="translate(107, 56)">
      <polygon points="0,-28 28,-16 28,4 0,16 -28,4 -28,-16" fill="#d97706" stroke="#fde68a" stroke-width="1.2"/>
      <polygon points="0,-22 22,-12 22,2 0,12 -22,2 -22,-12" fill="#fbbf24" fill-opacity="0.25" stroke="#ffffff" stroke-width="0.8"/>
      <polygon points="-28,4 0,16 0,26 -28,14" fill="#b45309" stroke="#fbbf24" stroke-width="0.8"/>
      <polygon points="28,4 0,16 0,26 28,14" fill="#92400e" stroke="#d97706" stroke-width="0.8"/>
      <text x="0" y="-2" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#ffffff">ACID</text>
    </g>

    <text x="107" y="122" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800" fill="#fbbf24">HIGH-PERF DATABASES</text>
    <text x="107" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#cbd5e1">PostgreSQL · MySQL · MongoDB</text>
    <rect x="32" y="148" width="150" height="18" rx="4" fill="#1c1104" stroke="#d97706" stroke-width="0.8"/>
    <text x="107" y="160" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#fbbf24">INDEX &amp; EXPLAIN TUNING</text>
  </g>
</svg>
