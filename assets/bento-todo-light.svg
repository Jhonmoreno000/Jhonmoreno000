<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 232" width="100%" height="232">
  <defs>
    <linearGradient id="bgB_todo_light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf3f8"/>
    </linearGradient>
    <pattern id="dotsB_todo_light" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#0d9488" fill-opacity="0.13"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @keyframes railB { to { stroke-dashoffset: -26; } }
      @keyframes floatB { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
      @keyframes scanB { 0%, 100% { transform: translateY(-16px); } 50% { transform: translateY(14px); } }
      @keyframes ledB { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      .rail { stroke-dasharray: 8 5; animation: railB 1.8s linear infinite; }
      .float3d { animation: floatB 3.6s ease-in-out infinite; }
      .laser { animation: scanB 2.5s ease-in-out infinite; }
      .led { animation: ledB 1.6s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="540" height="232" fill="#eef2f6"/>
  <path d="M 18,6 L 119,6 L 131,14 L 409,14 L 421,6 L 522,6 L 534,18 L 534,214 L 522,226 L 18,226 L 6,214 L 6,18 Z" fill="url(#bgB_todo_light)" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M 18,6 L 119,6 L 131,14 L 409,14 L 421,6 L 522,6 L 534,18 L 534,214 L 522,226 L 18,226 L 6,214 L 6,18 Z" fill="url(#dotsB_todo_light)"/>
  <path d="M 18,6 L 119,6 L 131,14 L 409,14 L 421,6 L 522,6 L 534,18 L 534,214 L 522,226 L 18,226 L 6,214 L 6,18 Z" fill="none" stroke="#0d9488" stroke-width="1.4" stroke-opacity="0.65" class="rail"/>
  <rect x="22" y="5" width="96" height="3" fill="#0d9488"/>

  <!-- Module Code -->
  <text x="24" y="29" class="mono" font-size="9" font-weight="800" fill="#0d9488" letter-spacing="1.8">SYS_06 // DOCKER &amp; BIG-O LAB</text>

  <!-- Extruded 3D Title -->
  <text x="25.5" y="56.5" class="mono" font-size="19.5" font-weight="900" fill="#0d9488" fill-opacity="0.28" letter-spacing="1.4">TODO-API &amp; PY</text>
  <text x="24" y="55" class="mono" font-size="19.5" font-weight="900" fill="#0f172a" letter-spacing="1.4">TODO-API &amp; PY</text>
  <text x="24" y="72" class="mono" font-size="9.5" font-weight="700" fill="#0d9488" letter-spacing="0.9">// NODE 20 · MONGO V6 · PYTHON 3.12</text>

  <!-- 3-Line Architectural Summary (kept cleanly within x: 24..376) -->
  <g class="sans" font-size="11.2" fill="#334155">
    <text x="24" y="95">Microservicio RESTful contenerizado en Node.js 20,</text>
    <text x="24" y="112">Express y MongoDB v6 (Docker Multi-Stage Non-Root),</text>
    <text x="24" y="129">junto a laboratorio de algoritmos y Big-O en Python.</text>
  </g>

  <!-- Unique 3D Isometric Hardware Sculpture (right zone x: 400..510) -->
  
  <g transform="translate(454, 92)">
    <polygon points="0,10 46,28 0,46 -46,28" fill="#cbd5e1" stroke="#0284c7" stroke-opacity="0.45" stroke-width="1"/>
    <g class="float3d">
      <polygon points="0,-30 32,-15 0,0 -32,-15" fill="#f1f5f9" stroke="#0284c7" stroke-width="1.3"/>
