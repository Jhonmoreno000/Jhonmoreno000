      <polygon points="0,0 32,-15 32,10 0,25" fill="#cbd5e1" stroke="#0d9488" stroke-width="1.3"/>
      <line x1="-21" y1="-9" x2="-21" y2="15" stroke="#0284c7" stroke-opacity="0.6" stroke-width="1.5"/>
      <line x1="-10" y1="-4" x2="-10" y2="20" stroke="#0284c7" stroke-opacity="0.6" stroke-width="1.5"/>
      <circle cx="16" cy="5" r="5.5" fill="#ffffff" stroke="#0d9488" stroke-width="1.4"/>
    </g>
  </g>

  <!-- Angled Parallelogram Tech Tags -->
  <g transform="translate(24, 148)" class="mono" font-size="8.8" font-weight="800">
    <g transform="translate(0, 0)">
        <path d="M 6,0 L 86,0 L 80,22 L 0,22 Z" fill="#f1f5f9" stroke="#0d9488" stroke-opacity="0.7" stroke-width="1"/>
        <text x="43" y="14.5" text-anchor="middle" fill="#0f172a">NODE.JS 20</text>
      </g>
    <g transform="translate(92, 0)">
