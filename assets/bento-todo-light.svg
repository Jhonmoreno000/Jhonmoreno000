    <g transform="translate(264, 0)">
        <path d="M 6,0 L 92.8,0 L 86.8,22 L 0,22 Z" fill="#f1f5f9" stroke="#d97706" stroke-opacity="0.7" stroke-width="1"/>
        <text x="46.4" y="14.5" text-anchor="middle" fill="#0f172a">PYTHON 3.12</text>
      </g>
  </g>

  <!-- Live GitHub API Metadata Footer -->
  <line x1="24" y1="184" x2="516" y2="184" stroke="#dbe4ee" stroke-width="1"/>
  <g transform="translate(24, 206)" class="mono" font-size="9.2" font-weight="700" letter-spacing="0.6">
    <rect x="0" y="-8.5" width="7" height="7" fill="#0d9488"/>
    <text x="14" y="-1.5" fill="#64748b">48 KB · #14d2ea3 · 2026-10-18</text>
