<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 150" width="100%" height="150">
  <defs>
    <linearGradient id="todoCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c1a"/>
      <stop offset="60%" stop-color="#081122"/>
      <stop offset="100%" stop-color="#040710"/>
    </linearGradient>
    <style>
      @keyframes floatIsoTodo {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      .iso-todo { animation: floatIsoTodo 3.6s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="960" height="150" rx="12" fill="url(#todoCardBg)"/>
  <rect x="1" y="1" width="958" height="148" rx="11" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="2.5" y1="20" x2="2.5" y2="130" stroke="#00f2fe" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Category & Live Status -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" letter-spacing="1">
    <text x="32" y="28" fill="#38bdf8" font-weight="700">REPOSITORY // 03 · BACKEND MICROSERVICE &amp; CONTAINER CLUSTER</text>
    <circle cx="660" cy="24" r="3.5" fill="#00f2fe">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="672" y="28" fill="#00f2fe" font-weight="700">DOCKER COMPOSE READY</text>
  </g>

  <!-- Title -->
  <text x="32" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" fill="#f8fafc">
    proyecto-todo-api — Containerized RESTful Microservice
  </text>

  <!-- Technical Description -->
  <text x="32" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">
    API RESTful modular para gestión y planificación de flujos de trabajo. Construida bajo arquitectura MVC con Node.js,
  </text>
  <text x="32" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">
    persistencia NoSQL en MongoDB y orquestación contenerizada en Docker Compose para despliegue automatizado.
  </text>

  <!-- Tech Pills Bar & CTA -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10">
    <rect x="32" y="116" width="82" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="73" y="130.5" fill="#00f2fe" text-anchor="middle" font-weight="600">Node.js 20</text>

    <rect x="122" y="116" width="70" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="157" y="130.5" fill="#cbd5e1" text-anchor="middle">Express</text>

    <rect x="200" y="116" width="76" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="238" y="130.5" fill="#cbd5e1" text-anchor="middle">MongoDB</text>

    <rect x="284" y="116" width="114" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="341" y="130.5" fill="#38bdf8" text-anchor="middle">Docker Compose</text>

    <rect x="406" y="116" width="76" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="444" y="130.5" fill="#cbd5e1" text-anchor="middle">REST API</text>

    <rect x="688" y="116" width="128" height="22" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#00f2fe" stroke-width="1"/>
    <text x="752" y="130.5" fill="#00f2fe" text-anchor="middle" font-weight="700">EXPLORE REPO &gt;</text>
  </g>

  <!-- 3D Isometric Container Cube on Right -->
  <g transform="translate(885, 78)">
    <polygon points="0,20 48,40 0,60 -48,40" fill="#071526" stroke="#00f2fe" stroke-opacity="0.5" stroke-width="1"/>
    <g class="iso-todo">
      <polygon points="0,-28 28,-14 0,0 -28,-14" fill="#00f2fe" stroke="#bae6fd" stroke-width="1"/>
      <polygon points="-28,-14 0,0 0,28 -28,14" fill="#0284c7" stroke="#38bdf8" stroke-width="0.8"/>
      <polygon points="28,-14 0,0 0,28 28,14" fill="#0369a1" stroke="#0284c7" stroke-width="0.8"/>
      <text x="0" y="-11" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#040710">API</text>
    </g>
  </g>
</svg>
