<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 145" width="100%" height="145">
  <defs>
    <linearGradient id="todoCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="60%" stop-color="#080d1a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="todoGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base Card -->
  <rect width="850" height="145" rx="10" fill="url(#todoCardBg)"/>
  <rect x="0.5" y="0.5" width="849" height="144" rx="9.5" fill="none" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Left Accent Glow Bar -->
  <line x1="2" y1="20" x2="2" y2="125" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Category & Live Status -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" letter-spacing="1">
    <text x="32" y="28" fill="#38bdf8">REPOSITORY // 01 · BACKEND MICROSERVICE</text>
    <text x="818" y="28" text-anchor="end" fill="#10b981">DOCKER COMPOSE READY</text>
    <circle cx="658" cy="25" r="3" fill="#10b981"/>
  </g>

  <!-- Title -->
  <text x="32" y="58" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="20" 
        font-weight="700" 
        fill="#f8fafc" 
        letter-spacing="-0.3">
    proyecto-todo-api
  </text>

  <!-- Technical Description -->
  <text x="32" y="82" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="13" 
        fill="#94a3b8">
    API RESTful modular para gestion y planificacion de flujos de trabajo. Construida bajo arquitectura MVC con Node.js,
  </text>
  <text x="32" y="100" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="13" 
        fill="#94a3b8">
    persistencia NoSQL en MongoDB y orquestacion contenerizada en Docker Compose para despliegue automatizado.
  </text>

  <!-- Tech Pills Bar & CTA -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10">
    <!-- Pill 1 -->
    <rect x="32" y="114" width="76" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="70" y="128" fill="#cbd5e1" text-anchor="middle">Node.js 20</text>
    
    <!-- Pill 2 -->
    <rect x="116" y="114" width="65" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="148" y="128" fill="#cbd5e1" text-anchor="middle">Express</text>
    
    <!-- Pill 3 -->
    <rect x="189" y="114" width="72" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="225" y="128" fill="#cbd5e1" text-anchor="middle">MongoDB</text>
    
    <!-- Pill 4 -->
    <rect x="269" y="114" width="112" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="325" y="128" fill="#38bdf8" text-anchor="middle">Docker Compose</text>

    <!-- Pill 5 -->
    <rect x="389" y="114" width="70" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="424" y="128" fill="#cbd5e1" text-anchor="middle">REST API</text>

    <!-- CTA Button on Right -->
    <rect x="700" y="114" width="118" height="20" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#00f2fe" stroke-width="1"/>
    <text x="759" y="128" fill="#00f2fe" text-anchor="middle" font-weight="700">EXPLORE REPO &gt;</text>
  </g>
</svg>
