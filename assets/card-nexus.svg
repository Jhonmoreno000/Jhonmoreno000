<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 150" width="100%" height="150">
  <defs>
    <linearGradient id="nexusCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c1a"/>
      <stop offset="60%" stop-color="#091224"/>
      <stop offset="100%" stop-color="#040710"/>
    </linearGradient>
    <style>
      @keyframes floatIsoNexus {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      .iso-nexus { animation: floatIsoNexus 3.5s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="960" height="150" rx="12" fill="url(#nexusCardBg)"/>
  <rect x="1" y="1" width="958" height="148" rx="11" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="2.5" y1="20" x2="2.5" y2="130" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Category & Status -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" letter-spacing="1">
    <text x="32" y="28" fill="#fbbf24" font-weight="700">REPOSITORY // 01 · DATA ENGINEERING &amp; SQL EXECUTION ENGINE</text>
    <circle cx="662" cy="24" r="3.5" fill="#fbbf24">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="674" y="28" fill="#fbbf24" font-weight="700">INTERACTIVE SQL ENGINE</text>
  </g>

  <!-- Title -->
  <text x="32" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" fill="#f8fafc">
    NEXUS — Relational Schema &amp; SQL Query Simulator
  </text>

  <!-- Description -->
  <text x="32" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">
    Motor y simulador interactivo de arquitectura de bases de datos relacionales con análisis visual de planes
  </text>
  <text x="32" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">
    de ejecución SQL (EXPLAIN), optimización de índices B-Tree, modelado DDL/DML y telemetría de consultas.
  </text>

  <!-- Tech Pills -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10">
    <rect x="32" y="116" width="88" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="76" y="130.5" fill="#fbbf24" text-anchor="middle" font-weight="600">TypeScript</text>

    <rect x="128" y="116" width="76" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="166" y="130.5" fill="#cbd5e1" text-anchor="middle">React 18</text>

    <rect x="212" y="116" width="92" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="258" y="130.5" fill="#38bdf8" text-anchor="middle">SQL Engine</text>

    <rect x="312" y="116" width="110" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="367" y="130.5" fill="#cbd5e1" text-anchor="middle">Query Planner</text>

    <rect x="430" y="116" width="68" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="464" y="130.5" fill="#cbd5e1" text-anchor="middle">Vite</text>

    <rect x="688" y="116" width="128" height="22" rx="4" fill="#d97706" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1"/>
    <text x="752" y="130.5" fill="#fbbf24" text-anchor="middle" font-weight="700">EXPLORE REPO &gt;</text>
  </g>

  <!-- 3D Isometric Database Cluster on Right -->
  <g transform="translate(885, 78)">
    <polygon points="0,20 48,40 0,60 -48,40" fill="#0c1526" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1"/>
    <g class="iso-nexus">
      <path d="M -26 0 L -26 18 A 26 11 0 0 0 26 18 L 26 0 Z" fill="#b45309" stroke="#fbbf24" stroke-width="0.8"/>
      <ellipse cx="0" cy="0" rx="26" ry="11" fill="#d97706" stroke="#fde68a" stroke-width="0.8"/>
      <path d="M -26 -20 L -26 -2 A 26 11 0 0 0 26 -2 L 26 -20 Z" fill="#d97706" stroke="#fbbf24" stroke-width="0.8"/>
      <ellipse cx="0" cy="-20" rx="26" ry="11" fill="#fbbf24" stroke="#fef3c7" stroke-width="1"/>
      <text x="0" y="-17" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#451a03">NEXUS</text>
    </g>
  </g>
</svg>
