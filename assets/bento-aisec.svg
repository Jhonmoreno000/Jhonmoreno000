<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 220" width="100%" height="220">
  <defs>
    <linearGradient id="bgAi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080c"/>
      <stop offset="100%" stop-color="#130d21"/>
    </linearGradient>
    <pattern id="dotsAi" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#c084fc" fill-opacity="0.14"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @keyframes railAi { to { stroke-dashoffset: -26; } }
      @keyframes floatAi { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
      @keyframes scanAi { 0%, 100% { transform: translateY(-18px); } 50% { transform: translateY(14px); } }
      .rail { stroke-dasharray: 8 5; animation: railAi 1.6s linear infinite; }
      .float3d { animation: floatAi 3.5s ease-in-out infinite; }
      .laser-ring { animation: scanAi 2.6s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="490" height="220" rx="6" fill="#030508"/>
  <path d="M 22,6 L 160,6 L 170,13 L 360,13 L 370,6 L 474,6 L 484,16 L 484,204 L 472,214 L 18,214 L 6,202 L 6,22 Z"
