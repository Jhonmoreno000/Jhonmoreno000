  <path d="M 22,6 L 160,6 L 170,13 L 360,13 L 370,6 L 474,6 L 484,16 L 484,204 L 472,214 L 18,214 L 6,202 L 6,22 Z"
        fill="none" stroke="#c084fc" stroke-width="1.4" stroke-opacity="0.7" class="rail"/>

  <rect x="24" y="5" width="90" height="3" fill="#c084fc"/>
  <text x="24" y="28" class="mono" font-size="9" font-weight="800" fill="#c084fc" letter-spacing="2">SYS_03 // LOCAL AI SAST</text>

  <text x="25.5" y="53.5" class="mono" font-size="20" font-weight="900" fill="#c084fc" fill-opacity="0.35" letter-spacing="2">SECDEV</text>
  <text x="24" y="52" class="mono" font-size="20" font-weight="900" fill="#f8fafc" letter-spacing="2">SECDEV</text>
  <text x="114" y="51" class="mono" font-size="10" font-weight="700" fill="#00ff66" letter-spacing="1">// QWEN 2.5 7B + D3D</text>

  <g class="sans" font-size="11.2" fill="#94a3b8">
    <text x="24" y="78">Estacion nativa de ingenieria y ciberseguridad con</text>
    <text x="24" y="96">aceleracion Direct3D, auditoria SAST mediante IA local</text>
    <text x="24" y="114">(Qwen 2.5 Coder 7B) y deduplicacion SHA-256 sin nube.</text>
  </g>

  <!-- 3D ISOMETRIC SCULPTURE: 3D OCTAHEDRON AI CORE & LASER SCANNER -->
  <g transform="translate(418, 86)">
    <ellipse cx="0" cy="30" rx="42" ry="16" fill="#05040a" stroke="#c084fc" stroke-opacity="0.45" stroke-width="1"/>
    <g class="float3d">
      <!-- Top Pyramid of Octahedron -->
      <polygon points="0,-32 -24,-4 0,8" fill="#c084fc" fill-opacity="0.5" stroke="#e9d5ff" stroke-width="1.2"/>
      <polygon points="0,-32 24,-4 0,8" fill="#9333ea" fill-opacity="0.55" stroke="#c084fc" stroke-width="1.2"/>
      <!-- Bottom Pyramid of Octahedron -->
      <polygon points="0,26 -24,-4 0,8" fill="#581c87" fill-opacity="0.7" stroke="#c084fc" stroke-width="1"/>
