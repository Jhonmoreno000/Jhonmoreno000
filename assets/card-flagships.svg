      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#060912"/>
    </linearGradient>
  </defs>

  <rect width="850" height="190" rx="10" fill="#050811"/>
  <rect x="0.5" y="0.5" width="849" height="189" rx="9.5" fill="none" stroke="#172033" stroke-width="1"/>

  <!-- Top bar -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" letter-spacing="1">
    <text x="24" y="24" fill="#64748b">SYSTEM ARCHITECTURES // CORE ENGINEERING SHOWCASES</text>
    <text x="826" y="24" text-anchor="end" fill="#38bdf8">FLAGSHIP SYSTEMS</text>
  </g>
  <line x1="24" y1="32" x2="826" y2="32" stroke="#172033" stroke-width="1"/>

  <!-- Col 1: AI Security -->
  <g transform="translate(24, 44)">
    <rect width="254" height="130" rx="8" fill="url(#flagBg)" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8">AI SECURITY ORCHESTRATOR</text>
    <text x="14" y="36" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">DEVSECOPS // AI LOCAL</text>
