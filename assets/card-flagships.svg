    <text x="14" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Orquestacion multimotor de escaneres</text>
    <text x="14" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">SAST/DAST en Docker. Deduplicacion</text>
