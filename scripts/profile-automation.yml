name: Senior Profile Telemetry & Live GitHub API Sync

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/**"

permissions:
  contents: write

jobs:
  sync-senior-profile-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Senior Linear/Vercel SVGs from Real GitHub API Telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile_data.py

      - name: Commit & Push Updated Telemetry SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --cached --quiet; then
            echo "No telemetry changes to commit"
          else
            git commit -m "chore(telemetry): sync live GitHub API codebase & commit metrics [skip ci]"
            git push
          fi
