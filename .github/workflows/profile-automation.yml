name: Cyber SOC Telemetry & 3D Profile Engine

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/github-3d-contrib.svg"
      - "assets/snake-dark.svg"
      - "assets/activity-streak-telemetry.svg"
      - "profile-3d-contrib/**"

permissions:
  contents: write

jobs:
  update-cyber-soc-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Live Cyber SOC 3D Isometric & Telemetry SVG Generator
        run: python scripts/update_profile_data.py

      - name: Commit & Push Updated Cyber SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --cached --quiet; then
            echo "No telemetry changes to commit"
          else
            git commit -m "chore(soc-telemetry): auto-update 3D cyber terrain & live metrics [skip ci]"
            git push
          fi
