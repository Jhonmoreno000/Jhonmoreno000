name: Live 3D SOC Telemetry & CISA KEV Sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/**"
      - "data/.last_receipt.md"

permissions:
  contents: write

jobs:
  sync-3d-soc-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate Dual Dark/Light 3D Telemetry & CISA KEV SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update_profile_data.mjs

      - name: Commit & Push Live Telemetry SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --cached --quiet; then
            echo "No telemetry changes to commit"
          else
            git commit -m "chore(telemetry): sync live GitHub API, 3D skyline & CISA KEV feed [skip ci]"
            git push
          fi
